name: Phase 4 checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio5-core:
    name: Studio5 Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/studio5-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  ink-web:
    name: P0 Ink Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/p0-ink-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  lecture-capture-web:
    name: P3 Lecture Capture Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/p3-lecture-capture-web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: prototype/p3-lecture-capture-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run preview:verify

  worker-static-assets:
    name: Cloudflare Worker Static Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            prototype/p3-lecture-capture-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir prototype/p3-lecture-capture-web install --frozen-lockfile
      - run: pnpm run worker:verify
