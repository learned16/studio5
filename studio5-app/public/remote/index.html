// ---- tutor.js ----
/* Tutor — Studio5 teaches you by itself.
   Three layers, cheapest first:
   1. The library (on this device, free, offline): hundreds of lessons for architecture + civil engineering, each with
      explanation, formulas, a worked example, common mistakes and a quiz. Search runs locally (BM25, Arabic-aware).
   2. The teacher model on YOUR Cloudflare account (Workers AI free daily allowance) — answers free questions,
      grounded on the matching library lessons so answers stay short, correct and cheap. No Claude tokens.
   3. The laptop (through Laptop Remote) only executes: it opens apps/files or shows its screen when the
      teacher asks and you approve. Nothing heavy runs on the laptop. */
S5.kb = {
  topics: null, idx: null, loading: null, failed: false,
  norm(s) { return String(s || "").toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي"); },
  tokens(s) { return this.norm(s).split(/[^a-z0-9؀-ۿ]+/).filter((t) => t.length > 1).map((t) => (t.length > 4 && /^(وال|بال|كال|فال|لل)/.test(t) ? t.slice(3) : t.length > 3 && t.startsWith("ال") ? t.slice(2) : t)); },
  /* A failed fetch (offline at the first open, a server hiccup) is NOT kept for the session: topics stay [] with
     `failed` set so screens don't spin, and the next load() call fetches again. */
  async load() {
    if (this.topics && !this.failed) return this.topics;
    if (!this.loading) this.loading = (async () => {
      let list = typeof S5_KB !== "undefined" ? S5_KB : null, failed = false;
      if (!list) {
        try { const r = await fetch("/kb/library.json"); if (!r.ok) throw new Error("HTTP " + r.status); list = await r.json(); if (!Array.isArray(list)) throw new Error("not a library"); }
        catch { list = []; failed = true; this.failedAt = Date.now(); }
      }
      if (!failed || !this.topics) { this.topics = list; this.byId = new Map(list.map((t) => [t.id, t])); this.build(); }
      this.failed = failed; if (failed) this.loading = null;
      return this.topics;
    })();
    return this.loading;
  },
  build() { // BM25 index: title ×3, keywords ×2, summary + key points ×1
    const docs = this.topics.map((t) => { const tf = new Map(); const add = (s, w) => { for (const k of this.tokens(s)) tf.set(k, (tf.get(k) || 0) + w); }; add(t.title_en + " " + t.title_ar, 3); add((t.keywords || []).join(" "), 2); add(t.summary_ar + " " + (t.key_points_ar || []).join(" ") + " " + (t.subjects || []).join(" "), 1); let len = 0; tf.forEach((v) => (len += v)); return { tf, len }; });
    const df = new Map(); for (const d of docs) for (const k of d.tf.keys()) df.set(k, (df.get(k) || 0) + 1);
    this.idx = { docs, df, avg: docs.reduce((a, d) => a + d.len, 0) / (docs.length || 1) };
  },
  search(q, { k = 5, program, subject } = {}) {
    if (!this.idx) return []; const qs = [...new Set(this.tokens(q))]; const N = this.topics.length; const out = [];
    this.idx.docs.forEach((d, i) => {
      const t = this.topics[i]; if (program && t.program !== program && t.program !== "both") return; if (subject && !(t.subjects || []).includes(subject)) return;
      let sc = 0; for (const w of qs) { const f = d.tf.get(w); if (!f) continue; const n = this.idx.df.get(w); sc += Math.log(1 + (N - n + 0.5) / (n + 0.5)) * ((f * 2.2) / (f + 1.2 * (0.25 + 0.75 * (d.len / this.idx.avg)))); }
      if (sc > 0) out.push([sc, t]);
    });
    return out.sort((a, b) => b[0] - a[0]).slice(0, k).map((x) => x[1]);
  },
  /* lessons of one subject in order. A subject name can exist in both programs (Engineering Drawing, Building
     Construction…), so pass {program, year} to keep them apart; a lesson with program 'both' belongs to either. */
  forSubject(name, { program, year } = {}) {
    return (this.topics || []).filter((t) => (t.subjects || []).includes(name) && (!program || program === "both" || t.program === program || t.program === "both") && (year == null || +t.year === +year)).sort((a, b) => a.order - b.order);
  },
  /* seeded shuffle: a permutation of 0..n-1 fixed by `key` (FNV-1a hash + murmur3 finaliser → Park-Miller). Quiz
     choices are shown in this order while data-j keeps the stored index, so the stored answer position (often B)
     gives nothing away. The finaliser matters: keys that differ only in their last character (question 0, 1, 2 of
     one view) would otherwise give correlated orders. */
  order(n, key) {
    let h = 2166136261; for (const c of String(key)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
    let s = ((h >>> 0) % 2147483646) + 1; const a = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { s = (s * 48271) % 2147483647; const j = Math.floor((s / 2147483647) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  },
  brief(t) { // compact excerpt sent to the teacher model (keeps requests small)
    return `### ${t.title_en} — ${t.title_ar} [${t.id}]\n${t.summary_ar}\n• ${(t.key_points_ar || []).join("\n• ")}${(t.formulas || []).length ? "\nFormulas: " + t.formulas.map((f) => `${f.name}: ${f.expr} (${f.vars})`).join("; ") : ""}`;
  },
};

/* ---------- progress & spaced review (Leitner boxes: 1, 3, 7, 16, 35 days) ---------- */
S5.tutorProg = {
  all() { return S5.store.meta.tutorProg || {}; },
  get(id) { return this.all()[id] || null; },
  /* score = graded (MCQ) items only. `self` = the student's own rating of the short answers ({ok, n}); it is kept as
     evidence tier E0 ("self-check") and never moves the score or the Leitner box. */
  async set(id, score, self) {
    const all = { ...this.all() }; const p = { ...(all[id] || { box: 0, seen: 0 }) }; const days = [1, 3, 7, 16, 35];
    p.seen++; p.last = score; p.box = score >= 0.8 ? Math.min(p.box + 1, 5) : score >= 0.5 ? Math.max(p.box, 1) : 0;
    p.due = S5.addDays ? S5.addDays(S5.todayISO(), days[Math.max(0, p.box - 1)]) : S5.todayISO(); p.at = S5.now();
    if (self && self.n) p.self = { ok: self.ok, n: self.n, tier: "E0" };
    all[id] = p;
    await S5.store.setMeta("tutorProg", all);
  },
  // a self-check pressed after the lesson was scored: only the E0 note changes (not the score, box, due or `at`)
  async markSelf(id, self) {
    const all = { ...this.all() }; if (!all[id] || !self || !self.n) return;
    all[id] = { ...all[id], self: { ok: self.ok, n: self.n, tier: "E0" } };
    await S5.store.setMeta("tutorProg", all);
  },
  due() { const t = S5.todayISO(); return Object.entries(this.all()).filter(([, p]) => p.due && p.due <= t).map(([id]) => id); },
};

/* ---------- the teacher model (Cloudflare on the installed app, claude.ai inside the artifact) ---------- */
S5.tutor = {
  history: [], busy: false,
  auth() { const h = { "content-type": "application/json" }; const k = S5.store.meta.tutorKey; if (k) h["x-s5-key"] = k; const p = S5.store.meta.remote; if (p) { h["x-s5-device"] = p.device; h["x-s5-token"] = p.token; } return h; },
  async ensureAccess() {
    if (!S5.standalone || S5.store.meta.tutorKey || S5.store.meta.remote) return true;
    try { const r = await fetch("/api/tutor/claim", { method: "POST" }).then((x) => x.json()); if (r.key) { await S5.store.setMeta("tutorKey", r.key); return true; } } catch {}
    return false;
  },
  available() { return S5.standalone ? true : S5.ai.state === "ready"; },
  /* one request; streams text into onText when given */
  async ask(messages, { onText, json, max_tokens, temperature, signal } = {}) {
    if (!S5.standalone) { // claude.ai artifact: use the built-in model
      const flat = messages.map((m) => `${m.role.toUpperCase()}: ${typeof m.content === "string" ? m.content : m.content.filter((c) => c.type === "text").map((c) => c.text).join("\n")}`).join("\n\n");
      return S5.ai.ask("tutor", flat, { onText: onText ? (t) => onText(t) : undefined, json });
    }
    await this.ensureAccess();
    const r = await fetch("/api/tutor/chat", { method: "POST", headers: this.auth(), body: JSON.stringify({ messages, json: !!json, stream: !!onText && !json, max_tokens, temperature }), signal });
    if (!r.ok) { let e = {}; try { e = await r.json(); } catch {} throw new Error(e.error || "Tutor unavailable (" + r.status + ")"); }
    if (!onText || json) { const d = await r.json(); if (!json) return d.text; try { return JSON.parse(d.text); } catch { const m = /\{[\s\S]*\}/.exec(d.text || ""); if (m) return JSON.parse(m[0]); throw new Error("The tutor's answer could not be read"); } }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "", full = "";
    for (;;) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); const parts = buf.split("\n\n"); buf = parts.pop(); for (const p of parts) { const v = p.replace(/^data:\s*/, "").trim(); if (!v || v === "[DONE]") continue; try { const o = JSON.parse(v); if (o.t) { full += o.t; onText(full); } } catch {} } }
    return full;
  },
  system(ctxTopics) {
    const S = S5.settings, progs = (S.get("programs") || []).map((p) => (p === "civil" ? "Civil Engineering (University of Kirkuk)" : "Architecture & Building Technologies (Northern Technical University)")).join(" + ");
    const R = S5.remote, laptop = S5.standalone && R && R.pair && R.laptopOnline;
    const apps = laptop && R.info && R.info.apps ? R.info.apps.map((a) => a.id).join(", ") : "";
    return `You are the teacher inside Studio5. Your student is in year ${S.get("activeYear")} of ${progs} in Iraq. Teach like an excellent university tutor:
- Explain step by step, check understanding with one short question at the end, and adapt to the student's answers.
- Use clear Modern Standard Arabic with Iraqi-friendly wording when the student writes Arabic; keep English technical terms in parentheses. Use SI units.
- Ground yourself on the LIBRARY excerpts below. If they don't cover it, say so briefly and teach from standard textbook knowledge; mark uncertain points.
- For calculations: show formula → substitution → result with units. Never invent code clauses.
- Do not write graded work for the student to submit; coach them to do it.
- Keep answers focused (under ~250 words unless asked for more).${laptop ? `
- You can use the student's laptop. To do so put ONE tag on its own line (the student must approve it):
  [[laptop:open_app ID]] (IDs: ${apps}) · [[laptop:open_file PATH]] (inside the Studio5 workspace) · [[laptop:screen]] to look at the laptop screen.
  Use it only when it clearly helps (e.g. open AutoCAD to practise, look at their drawing).` : ""}
- You may suggest a library lesson or quiz with [[lesson:ID]] or [[quiz:ID]] using IDs from the excerpts.
LIBRARY:
${ctxTopics.map((t) => S5.kb.brief(t)).join("\n\n") || "(no matching lesson)"}`;
  },
};

/* ---------- the view ---------- */
S5.views.tutor = (r) => {
  const tab = r.tab || "chat";
  // re-render once when the library arrives — also when an earlier failed load succeeds on this visit. Right after
  // a failed load the screen offers "Try again" instead of fetching again on every render.
  S5.ui.mount(() => { const K = S5.kb, first = !K.topics; if ((K.topics && !K.failed) || (K.failed && Date.now() - K.failedAt < 4000)) return; K.load().then(() => { if (!K.failed || first) S5.ui.render(); }); });

  let body = "";

  else if (S5.kb.failed && tab !== "chat") body = `<div class="sheet flat"><p class="small">The library could not be loaded — check the connection.</p><div class="row" style="margin-top:8px">${H.btn("Try again", "kb-retry", {}, "sm primary")}</div></div>`;
  else if (tab === "chat") body = S5.tutorChatHTML(r);
  else if (tab === "learn") body = r.id ? S5.lessonHTML(S5.kb.byId.get(r.id)) : S5.lessonsHTML(r);
  else body = S5.reviewHTML();
  return `<div class="page-head"><div class="titles"><span class="eyebrow">Your teacher · library on this device · AI on your Cloudflare</span><h1>Tutor</h1></div></div>${H.tabs(tabs, tab, "open", { v: "tutor" })}${body}`;
};
S5.tutorChatHTML = () => {

    <div class="tc-bar"><textarea id="tc-in" dir="auto" rows="2" placeholder="Write your question… (Arabic or English)"></textarea><div class="col">${H.btn("Send", "tc-send", {}, "primary")}${laptop ? H.btn("👁 Laptop screen", "tc-screen", {}, "sm") : ""}</div></div>
    <p class="tiny muted" id="tc-note">${S5.standalone ? "Answers come from your Cloudflare account's free daily allowance and are grounded on the library. Without internet you still get the library lessons." : "Inside claude.ai the teacher uses the built-in model."}</p></div>`;
};
S5.tcMsgHTML = (m) => m.role === "user" ? `<div class="tc-msg me" dir="auto">${S5.esc(m.show || m.content)}${m.img ? ' <span class="pill">🖼</span>' : ""}</div>` : `<div class="tc-msg ai" dir="auto">${S5.tcRender(m.content)}</div>`;
/* light markdown + action chips */
S5.tcRender = (t) => {
  let h = S5.esc(t);
  h = h.replace(/\[\[laptop:(open_app|open_file|screen)\s*([^\]]*)\]\]/g, (_, a, v) => `<button class="btn sm primary tc-act" data-act="tc-laptop" data-a="${a}" data-v="${v.trim()}">💻 ${a === "open_app" ? "Open " + v.trim() + " on the laptop" : a === "open_file" ? "Open " + v.trim() : "Look at the laptop screen"}</button>`);
  h = h.replace(/\[\[(lesson|quiz):([a-z0-9-]+)\]\]/g, (_, k, id) => { const tp = S5.kb.byId && S5.kb.byId.get(id); return tp ? `<button class="btn sm" data-act="open" data-v="tutor" data-tab="learn" data-id="${id}">${k === "quiz" ? "📝" : "📘"} ${S5.esc(tp.title_ar)}</button>` : ""; });
  h = h.replace(/^### (.*)$/gm, "<b>$1</b>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<code dir="ltr">$1</code>').replace(/^[-•*] (.*)$/gm, "• $1").replace(/\n/g, "<br>");
  return h;
};
S5.bindTutorChat = () => {
  const inp = document.getElementById("tc-in"); if (!inp) return;
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); S5.act["tc-send"](); } });
  const log = document.getElementById("tc-log"); log.scrollTop = log.scrollHeight;
};
S5.tutorSend = async (text, img) => {
  const T = S5.tutor; if (T.busy || !text.trim()) return; T.busy = true;
  await S5.kb.load();
  const ctx = S5.kb.search(text + " " + T.history.slice(-2).map((m) => (typeof m.content === "string" ? m.content : "")).join(" "), { k: 3 });
  T.history.push({ role: "user", content: text, img: !!img });
  const log = document.getElementById("tc-log"); const paint = () => { if (log) { log.innerHTML = T.history.map(S5.tcMsgHTML).join(""); log.scrollTop = log.scrollHeight; } };
  T.history.push({ role: "assistant", content: "…" }); paint();
  const msgs = [{ role: "system", content: T.system(ctx) }, ...T.history.slice(-10, -2).map((m) => ({ role: m.role, content: m.content })),
    { role: "user", content: img ? [{ type: "text", text }, { type: "image_url", image_url: { url: img } }] : text }];
  const out = T.history[T.history.length - 1];
  try {
    const t = await T.ask(msgs, { onText: (s) => { out.content = s; paint(); } }); out.content = t || out.content;
  } catch (e) { // offline / allowance used up: teach from the library
    out.content = `⚠️ ${e.message}\n\n` + (ctx.length ? "From the library:\n" + ctx.map((tp) => `[[lesson:${tp.id}]]`).join(" ") + "\n\n" + ctx[0].summary_ar : "No matching lesson in the library yet.");
  }
  T.busy = false; paint();
};
Object.assign(S5.act, {
  "tc-send": () => { const i = document.getElementById("tc-in"); const t = i.value; i.value = ""; S5.tutorSend(t); },
  "tc-suggest": (el) => S5.tutorSend(el.textContent),
  "tc-screen": async () => { try { S5.ui.toast("Looking at the laptop screen…"); const d = await S5.remote.send("screen.shot", { width: 1280, quality: 60 }, { quiet: true, timeout: 20000 }); const q = document.getElementById("tc-in").value || "شوف شاشة اللابتوب مالتي وساعدني بالخطوة الجاية."; document.getElementById("tc-in").value = ""; S5.tutorSend(q, "data:image/jpeg;base64," + d.jpeg); } catch (e) { S5.ui.toast(e.message, true); } },
  "tc-laptop": (el) => {
    const a = el.dataset.a, v = el.dataset.v, R = S5.remote;
    if (a === "screen") return S5.act["tc-screen"]();
    S5.ui.confirm(a === "open_app" ? `Open “${v}” on your laptop?` : `Open “${v}” on your laptop?`, "Open", async () => {
      try { if (a === "open_app") { const r = await R.send("app.open", { id: v }); S5.ui.toast("Opened " + r.opened); } else { await R.send("file.open", { path: v }); S5.ui.toast("Opened on the laptop"); } } catch (e) { S5.ui.toast(e.message, true); }
    }, false);
  },
});

/* lessons: by subject in curriculum order, with progress */
S5.lessonsHTML = (r) => {

/* College M2 — exact-grading problem engine (docs/COLLEGE_PLAN.md §1, §2, M2). Pure and headless: no UI here.
   Seeded generators, answer keys computed by code, unit-aware grading with tolerances and structured misconception
   codes, mastery computed from attempt records (never stored), and a guard that flags numbers in AI text.
   Rule: every number that affects a mark comes from a generator's solve(); the AI never produces a key.

   Generator contract (S5.prob.register(def) → S5.PROB[def.id]):
     { id, v,                     // v: bump when gen() changes, so pid + v + seed always reproduces the same params
       obj, lesson, lessons?,     // objective id (S5.OBJ), main library lesson id, all linked lesson ids
       subject, program, lvl,     // exact curriculum subject name, 'civil' | 'arch' | 'both', difficulty 1–3
       gen(rng) → params,         // only randomness: the rng argument (S5.rng); params are plain JSON
       solve(p) → {k: SI number}, // keys for every field (extra SI numbers allowed, e.g. reactions used by steps)
       fields(p) → [{k, sym, dim, units[], unit, tol, sense?, wrap?, w?, label:{en, ar}}],
       text(p, lang) → string, steps(p, lang) → [string],   // lang 'ar' | 'en'; render inside [data-noi18n]
       svg?(p) → string,
       mis?(p) → {k: [[code, SI value]]},  // optional code-computed misconceptions (e.g. calculator in radians)
       kb?: {lesson, p, expect:{k:[printed value, unit]}} | [...] }  // reproduces the lesson's worked example

   sense: [positive, negative] labels (e.g. ['T','C'], ['CCW','CW']) — the key is signed, the student gives a
   magnitude plus a sense; wrap: angle compared modulo 360°.
   Attempt record (written by later milestones, one per submit): {pid, v, seed, obj, lesson, given:{k:[num, unit,

    dim("inertia", [["mm⁴", 1e-12], ["cm⁴", 1e-8], ["m⁴", 1]]);
    dim("angle", [["deg", DEG], ["rad", 1]]);
    dim("area", [["mm²", 1e-6], ["cm²", 1e-4], ["m²", 1]]);

      E3: { id: "E3", rank: 3, label: "Graded by code", mastery: true },
      E4: { id: "E4", rank: 4, label: "Retrieval or exam", mastery: true },
      EP: { id: "EP", rank: 5, label: "Professor or jury score", mastery: false, authoritative: true },
    };
    S5.GRADE_CODES = { ok: "Correct", rounding: "Rounding — half credit", unit: "Unit slip", sign: "Wrong sign or sense", x2: "Off by a factor of 2", "deg-rad": "Degrees/radians mix-up", wrong: "Not correct", empty: "No answer" };

       input: string or number as typed; unit: the picked unit symbol; opt: {sense, max: largest |key| of the same dimension
       in the problem (for the absolute floor), mis:[[code, SI]]}.
       Codes: ok | rounding (half credit) | unit (10ⁿ slip) | sign | x2 | deg-rad | wrong | empty (bad:true when unreadable).

/* College M2 — Year-1 problem generators, statics first (docs/COLLEGE_PLAN.md M2). Contract: see 10-problems.js.
   Every key comes from the pure solver next to each generator; parameters come from "nice" grids; each generator
   carries a `kb` instance that re-solves its library lesson's worked example (S5.prob.kbCheck flags a lesson that
   disagrees — the solver is never tuned to match). Text and steps are bilingual and are rendered with data-noi18n. */
(() => {
  try {
    const PR = S5.prob, f = PR.fmt, DEG = Math.PI / 180;
    const CIV = "Engineering Mechanics (Statics & Dynamics)", ARCH_MECH = "Mechanics & Strength of Materials";
    const FORCE = ["N", "kN", "MN"], LEN = ["mm", "cm", "m"], MOM = ["N·m", "kN·m"], ANG = ["deg", "rad"];
    const tr = (lang, en, ar) => (lang === "ar" ? ar : en);
    const fp = (x) => (x < 0 ? `(${f(x)})` : f(x)); // a negative number inside a product or a square
    const sin = (d) => Math.sin(d * DEG), cos = (d) => Math.cos(d * DEG);
    const lab = (en, ar) => ({ en, ar });
    const TC = (lang, F) => (F < 0 ? tr(lang, "compression (C)", "ضغط (C)") : tr(lang, "tension (T)", "شد (T)"));
    /* Answers of one dimension are kept within a factor of about 3 of each other: the grading floor is 0.5% of the
       LARGEST key of that dimension, so a much smaller answer next to a big one would be graded far more loosely than 1%.

    const n1 = (v) => (+v).toFixed(1);
    const line = (x1, y1, x2, y2, col = "currentColor", w = 2, extra = "") => `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${col}" stroke-width="${w}"${extra}/>`;
    const arrow = (x1, y1, x2, y2, col = "var(--cobalt)", w = 2) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 8; return line(x1, y1, x2, y2, col, w) + `<polygon points="${n1(x2)},${n1(y2)} ${n1(x2 - h * Math.cos(a - 0.4))},${n1(y2 - h * Math.sin(a - 0.4))} ${n1(x2 - h * Math.cos(a + 0.4))},${n1(y2 - h * Math.sin(a + 0.4))}" fill="${col}"/>`; };
    const txt = (x, y, s, anchor = "middle") => `<text x="${n1(x)}" y="${n1(y)}" font-size="12" fill="currentColor" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace">${s}</text>`;
    const pin = (x, y) => `<polygon points="${n1(x)},${n1(y)} ${n1(x - 9)},${n1(y + 14)} ${n1(x + 9)},${n1(y + 14)}" fill="none" stroke="currentColor" stroke-width="1.5"/>`;
    const roller = (x, y) => `<circle cx="${n1(x)}" cy="${n1(y + 7)}" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>`;
    const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${Math.round(w * 1.5)}px" role="img" direction="ltr">${body}</svg>`;

    /* ---------- objectives (static content; bilingual like problem text) ---------- */
    PR.obj({ id: "statics.forces", en: "Resolve forces into components and find their resultant", ar: "تحليل القوى إلى مركبات وإيجاد محصلتها", subjects: [CIV], program: "civil", lessons: ["c1b-mech-01"] });
    PR.obj({ id: "statics.particle", en: "Equilibrium of a particle (ΣFx = 0, ΣFy = 0)", ar: "اتزان الجسيم (ΣFx = 0 و ΣFy = 0)", subjects: [CIV], program: "civil", lessons: ["c1b-mech-02"] });
    PR.obj({ id: "statics.moment", en: "Moment of a force about a point", ar: "عزم القوة حول نقطة", subjects: [CIV], program: "civil", lessons: ["c1b-mech-03"] });
    PR.obj({ id: "statics.reactions", en: "Support reactions and maximum moment of a simple beam", ar: "ردود أفعال المساند وأقصى عزم في عتبة بسيطة", subjects: [CIV], program: "civil", lessons: ["c1b-mech-04"] });
    PR.obj({ id: "statics.joints", en: "Truss member forces by the method of joints", ar: "قوى أعضاء الجملون بطريقة العقد", subjects: [CIV], program: "civil", lessons: ["c1b-mech-05"] });
    PR.obj({ id: "statics.centroid", en: "Centroid of a composite section", ar: "مركز ثقل المقطع المركب", subjects: [CIV, ARCH_MECH], program: "both", lessons: ["c1b-mech-09", "a2-mec-04"] });

    /* ---------- 1. resultant of 2–3 concurrent forces (c1b-mech-01) ---------- */
    const resXY = (p, trig = DEG) => { let x = 0, y = 0; p.F.forEach((F, i) => { x += F * Math.cos(p.th[i] * trig); y += F * Math.sin(p.th[i] * trig); }); return [x, y]; };
    const resultant = (p) => { const [x, y] = resXY(p); let th = Math.atan2(y, x); if (th < 0) th += 2 * Math.PI; return { x, y, R: Math.hypot(x, y), th }; };
    PR.register({
      id: "mech.resultant", v: 1, obj: "statics.forces", lesson: "c1b-mech-01", subject: CIV, program: "civil", lvl: 1,
      gen(r) {
        const u = r.pick(["N", "kN"]), n = r.pick([2, 2, 3]);
        for (let t = 0; t < 50; t++) {
          const F = [], th = [];
          for (let i = 0; i < n; i++) {
            F.push(u === "N" ? r.grid(100, 900, 50) : r.grid(2, 40, 1));
            let a = r.grid(0, 355, 5); for (let k = 0; k < 30 && th.some((b) => Math.abs(((a - b + 540) % 360) - 180) < 20); k++) a = r.grid(0, 355, 5);
            th.push(a);
          }
          if (resultant({ F, th }).R >= 0.25 * Math.max(...F)) return { u, F, th };
        }
        return { u: "N", F: [500, 300], th: [30, 120] };
      },
      solve(p) { const s = S5.toSI(1, p.u), q = resultant(p); return { R: q.R * s, th: q.th, Rx: q.x * s, Ry: q.y * s }; },
      fields: (p) => [
        { k: "R", sym: "R", dim: "force", units: FORCE, unit: p.u, tol: "def", label: lab("Magnitude of the resultant R", "مقدار المحصلة R") },
        { k: "th", sym: "θ", dim: "angle", units: ANG, unit: "deg", tol: "angMech", wrap: true, label: lab("Direction θ of R, counter-clockwise from +x", "اتجاه المحصلة θ عكس عقارب الساعة من محور x الموجب") },
      ],
      text(p, lang) {
        const list = p.F.map((F, i) => `F${i + 1} = ${F} ${p.u} ${tr(lang, "at", "بزاوية")} ${p.th[i]}°`).join(tr(lang, ", ", "، "));
        return tr(lang,
          `Concurrent forces act at one point: ${list} (angles measured counter-clockwise from the +x axis). Find the magnitude of the resultant R and its direction θ from the +x axis.`,
          `تؤثر قوى متلاقية في نقطة واحدة: ${list} (الزوايا تُقاس عكس عقارب الساعة من محور x الموجب). أوجد مقدار المحصلة R واتجاهها θ من محور x الموجب.`);
      },
      steps(p, lang) {
        const q = resultant(p), u = p.u, quad = q.x >= 0 ? (q.y >= 0 ? 1 : 4) : q.y >= 0 ? 2 : 3;
        return [
          ...p.F.map((F, i) => `${tr(lang, "Resolve", "حلّل")} F${i + 1}: F${i + 1}x = ${F}·cos${p.th[i]}° = ${f(F * cos(p.th[i]))} ${u}${tr(lang, ", ", "، ")}F${i + 1}y = ${F}·sin${p.th[i]}° = ${f(F * sin(p.th[i]))} ${u}`),
          `Rx = ΣFx = ${f(q.x)} ${u}${tr(lang, ", ", "، ")}Ry = ΣFy = ${f(q.y)} ${u}`,
          `R = √(Rx² + Ry²) = √(${fp(q.x)}² + ${fp(q.y)}²) = ${f(q.R)} ${u}`,
          tr(lang, `θ = atan2(Ry, Rx) = ${f(q.th / DEG, 1)}° (quadrant ${["", "I", "II", "III", "IV"][quad]} from the signs of Rx and Ry)`,
            `θ = atan2(Ry, Rx) = ${f(q.th / DEG, 1)}° (الربع ${["", "الأول", "الثاني", "الثالث", "الرابع"][quad]} حسب إشارتي Rx و Ry)`),
        ];
      },
      // calculator left in radians; θ from atan(Ry/Rx) without fixing the quadrant points R the opposite way (a sense error)
      mis(p) { const [x, y] = resXY(p, 1), q = resultant(p); return { R: [["deg-rad", Math.hypot(x, y) * S5.toSI(1, p.u)]], th: [["sign", (q.th + Math.PI) % (2 * Math.PI)]] }; },
      svg(p) {
        const c = 110, m = Math.max(...p.F);
        return svg(220, 220, line(10, c, 210, c, "var(--rule-strong, #999)", 1) + line(c, 10, c, 210, "var(--rule-strong, #999)", 1) + txt(212, c - 4, "x", "end") + txt(c + 8, 18, "y")
          + p.F.map((F, i) => { const L = 30 + (60 * F) / m; return arrow(c, c, c + L * cos(p.th[i]), c - L * sin(p.th[i])) + txt(c + (L + 14) * cos(p.th[i]), c - (L + 14) * sin(p.th[i]) + 4, "F" + (i + 1)); }).join(""));
      },
      kb: { lesson: "c1b-mech-01", p: { u: "N", F: [500, 300], th: [30, 120] }, expect: { R: [583, "N"], th: [61.0, "deg"] } },
    });

    /* ---------- 2. particle held by two cables (c1b-mech-02) ---------- */
    const cables = (p, trig = DEG) => { const a = p.ref === "v" ? 90 - p.a : p.a, b = p.ref === "v" ? 90 - p.b : p.b, s = Math.sin((a + b) * trig); return { a, b, T1: (p.W * Math.cos(b * trig)) / s, T2: (p.W * Math.cos(a * trig)) / s }; };
    PR.register({
      id: "mech.particle2cable", v: 1, obj: "statics.particle", lesson: "c1b-mech-02", subject: CIV, program: "civil", lvl: 1,
      gen(r) { const u = r.pick(["N", "kN"]); return { u, W: u === "N" ? r.grid(200, 2000, 50) : r.grid(2, 50, 1), a: r.grid(20, 70, 5), b: r.grid(20, 70, 5), ref: r.chance(0.3) ? "v" : "h" }; },
      solve(p) { const s = S5.toSI(1, p.u), c = cables(p); return { TAB: c.T1 * s, TAC: c.T2 * s }; },
      fields: (p) => [
        { k: "TAB", sym: "T_AB", dim: "force", units: FORCE, unit: p.u, tol: "def", label: lab("Tension in cable AB", "الشد في الحبل AB") },
        { k: "TAC", sym: "T_AC", dim: "force", units: FORCE, unit: p.u, tol: "def", label: lab("Tension in cable AC", "الشد في الحبل AC") },
      ],
      text(p, lang) {
        const ref = p.ref === "v" ? tr(lang, "from the vertical", "مع الشاقول") : tr(lang, "above the horizontal", "فوق الأفق");
        return tr(lang,
          `A weight W = ${p.W} ${p.u} hangs from ring A, held by two cables. Cable AB rises to the left at ${p.a}° ${ref}; cable AC rises to the right at ${p.b}° ${ref}. Find the tension in each cable.`,
          `ثقل وزنه W = ${p.W} ${p.u} معلق بالحلقة A ويحمله حبلان. الحبل AB يصعد إلى اليسار بزاوية ${p.a}° ${ref}، والحبل AC يصعد إلى اليمين بزاوية ${p.b}° ${ref}. أوجد الشد في كل حبل.`);
      },
      steps(p, lang) {
        const c = cables(p), u = p.u, out = [];
        if (p.ref === "v") out.push(tr(lang, `Angles from the horizontal: α = 90° − ${p.a}° = ${c.a}°, β = 90° − ${p.b}° = ${c.b}°`, `الزوايا مع الأفق: α = 90° − ${p.a}° = ${c.a}°، β = 90° − ${p.b}° = ${c.b}°`));
        out.push(tr(lang, `Free-body diagram of ring A: T_AB up-left at α = ${c.a}°, T_AC up-right at β = ${c.b}°, W = ${p.W} ${u} down`, `مخطط الجسم الحر للحلقة A: T_AB إلى الأعلى يسارًا بزاوية α = ${c.a}°، و T_AC إلى الأعلى يمينًا بزاوية β = ${c.b}°، والوزن W = ${p.W} ${u} للأسفل`),
          `ΣFx = 0: −T_AB·cos${c.a}° + T_AC·cos${c.b}° = 0`,
          `ΣFy = 0: T_AB·sin${c.a}° + T_AC·sin${c.b}° − ${p.W} = 0`,
          `T_AB = W·cosβ / sin(α + β) = ${p.W}·cos${c.b}° / sin${c.a + c.b}° = ${f(c.T1)} ${u}`,
          `T_AC = W·cosα / sin(α + β) = ${p.W}·cos${c.a}° / sin${c.a + c.b}° = ${f(c.T2)} ${u}`,
          tr(lang, `Check ΣFy: ${f(c.T1)}·sin${c.a}° + ${f(c.T2)}·sin${c.b}° = ${f(c.T1 * sin(c.a) + c.T2 * sin(c.b))} ≈ W ✓`, `تحقق ΣFy: ${f(c.T1)}·sin${c.a}° + ${f(c.T2)}·sin${c.b}° = ${f(c.T1 * sin(c.a) + c.T2 * sin(c.b))} ≈ W ✓`));
        return out;
      },
      mis(p) { const c = cables(p, 1), s = S5.toSI(1, p.u); return { TAB: [["deg-rad", c.T1 * s]], TAC: [["deg-rad", c.T2 * s]] }; },
      svg(p) {
        const c = cables(p), x = 120, y = 110, L = 85, bx = x - L * cos(c.a), by = y - L * sin(c.a), cx = x + L * cos(c.b), cy = y - L * sin(c.b);
        return svg(240, 180, line(x, y, bx, by) + line(x, y, cx, cy) + line(bx - 12, by, bx + 12, by, "currentColor", 3) + line(cx - 12, cy, cx + 12, cy, "currentColor", 3)
          + `<circle cx="${x}" cy="${y}" r="4" fill="currentColor"/>` + arrow(x, y + 6, x, y + 60) + txt(x + 14, y + 4, "A", "start") + txt(bx, by - 8, "B") + txt(cx, cy - 8, "C") + txt(x + 10, y + 58, "W", "start"));
      },
      kb: { lesson: "c1b-mech-02", p: { u: "N", W: 1000, a: 30, b: 60, ref: "h" }, expect: { TAB: [500, "N"], TAC: [866, "N"] } },
    });

    /* ---------- 3. moment of a force about a point (c1b-mech-03) ---------- */
    const mom = (p, trig = DEG) => { const Fx = p.F * Math.cos(p.th * trig), Fy = p.F * Math.sin(p.th * trig), M = p.x * Fy - p.y * Fx; return { Fx, Fy, M, d: Math.abs(M) / p.F }; };
    PR.register({
      id: "mech.moment", v: 1, obj: "statics.moment", lesson: "c1b-mech-03", subject: CIV, program: "civil", lvl: 1,
      gen(r) {
        const u = r.pick(["N", "kN"]);
        for (let t = 0; t < 50; t++) {
          const x = r.grid(-3, 3, 0.5), y = r.grid(-3, 3, 0.5), F = u === "N" ? r.grid(50, 500, 10) : r.grid(2, 40, 1), th = r.grid(0, 345, 15), rr = Math.hypot(x, y);
          if (rr >= 0.5 && Math.abs(mom({ x, y, F, th }).M) >= 0.15 * F * rr) return { u, F, th, x, y };
        }
        return { u: "N", F: 200, th: 60, x: 0.5, y: 0 };
      },
      solve(p) { const m = mom(p), s = S5.toSI(1, p.u); return { d: m.d, M: m.M * s, Fx: m.Fx * s, Fy: m.Fy * s }; },
      fields: (p) => [
        { k: "d", sym: "d", dim: "length", units: LEN, unit: "m", tol: "def", label: lab("Perpendicular distance d from O to the line of action", "البعد العمودي d من O إلى خط تأثير القوة") },
        { k: "M", sym: "M_O", dim: "moment", units: MOM, unit: p.u === "N" ? "N·m" : "kN·m", tol: "def", sense: ["CCW", "CW"], label: lab("Moment of F about O", "عزم القوة F حول O") },
      ],
      text(p, lang) {
        return tr(lang,
          `A force F = ${p.F} ${p.u} acts at point A (x = ${p.x} m, y = ${p.y} m) measured from O, pointing ${p.th}° counter-clockwise from the +x axis. Find the perpendicular distance d from O to the line of action of F, and the moment of F about O (state counter-clockwise or clockwise).`,
          `قوة F = ${p.F} ${p.u} تؤثر في النقطة A (x = ${p.x} m، y = ${p.y} m) مقيسة من O، واتجاهها ${p.th}° عكس عقارب الساعة من محور x الموجب. أوجد البعد العمودي d من O إلى خط تأثير القوة، وعزم القوة حول O مع بيان اتجاهه (عكس عقارب الساعة أو مع عقارب الساعة).`);
      },
      steps(p, lang) {
        const m = mom(p), u = p.u, mu = u === "N" ? "N·m" : "kN·m";
        return [
          `Fx = F·cos${p.th}° = ${f(m.Fx)} ${u}${tr(lang, ", ", "، ")}Fy = F·sin${p.th}° = ${f(m.Fy)} ${u}`,
          tr(lang, "Varignon: ", "نظرية فارينيون: ") + `M_O = x·Fy − y·Fx = ${fp(p.x)}·${fp(m.Fy)} − ${fp(p.y)}·${fp(m.Fx)} = ${f(m.M)} ${mu}`,
          m.M >= 0 ? tr(lang, `M_O is positive → counter-clockwise (CCW), |M_O| = ${f(m.M)} ${mu}`, `M_O موجب ← عكس عقارب الساعة، |M_O| = ${f(m.M)} ${mu}`)
            : tr(lang, `M_O is negative → clockwise (CW), |M_O| = ${f(-m.M)} ${mu}`, `M_O سالب ← مع عقارب الساعة، |M_O| = ${f(-m.M)} ${mu}`),
          `d = |M_O| / F = ${f(Math.abs(m.M))} / ${p.F} = ${f(m.d)} m`,
        ];
      },
      mis(p) { const m = mom(p, 1), s = S5.toSI(1, p.u); return { M: [["deg-rad", m.M * s]], d: [["deg-rad", m.d]] }; },
      svg(p) {
        const o = 110, k = 25, ax = o + k * p.x, ay = o - k * p.y;
        return svg(220, 220, line(10, o, 210, o, "var(--rule-strong, #999)", 1) + line(o, 10, o, 210, "var(--rule-strong, #999)", 1) + `<circle cx="${o}" cy="${o}" r="3.5" fill="currentColor"/>` + txt(o - 10, o + 16, "O")
          + `<circle cx="${n1(ax)}" cy="${n1(ay)}" r="3.5" fill="currentColor"/>` + txt(ax - 10, ay - 8, "A") + arrow(ax, ay, ax + 45 * cos(p.th), ay - 45 * sin(p.th)) + txt(ax + 58 * cos(p.th), ay - 58 * sin(p.th) + 4, "F"));
      },
      kb: { lesson: "c1b-mech-03", p: { u: "N", F: 200, th: 60, x: 0.4, y: 0 }, expect: { M: [69.3, "N·m"] } },
    });

    /* ---------- 4. simply supported beam: UDL + point load (c1b-mech-04; agrees with TOOL_DEFS.beam) ---------- */
    const beam = (p) => {
      const { L, w, a } = p, Pl = p.P, RB = ((w * L * L) / 2 + Pl * a) / L, RA = w * L + Pl - RB;
      const Mx = (x) => RA * x - (w * x * x) / 2 - (x > a ? Pl * (x - a) : 0);
      const xs = [0, a, L]; if (w > 0) { const x1 = RA / w, x2 = (RA - Pl) / w; if (x1 > 0 && x1 < a) xs.push(x1); if (x2 > a && x2 < L) xs.push(x2); }
      let xm = 0, Mm = 0; for (const x of xs) { const m = Mx(x); if (Math.abs(m) > Math.abs(Mm)) { Mm = m; xm = x; } }
      return { RA, RB, Mm, xm, W: w * L };
    };
    PR.register({
      id: "mech.beamReactions", v: 1, obj: "statics.reactions", lesson: "c1b-mech-04", subject: CIV, program: "civil", lvl: 2,
      gen(r) {
        for (let t = 0; t < 50; t++) {
          const L = r.grid(3, 10, 0.5), p = { L, w: r.grid(2, 20, 1), P: r.grid(5, 50, 5), a: r.grid(0.5, L - 0.5, 0.5) }, b = beam(p);
          if (balanced([b.RA, b.RB])) return p;
        }
        return { L: 6, w: 4, P: 12, a: 2 };
      },
      solve(p) { const b = beam(p); return { RA: b.RA * 1e3, RB: b.RB * 1e3, Mmax: b.Mm * 1e3, xm: b.xm }; },
      fields: () => [
        { k: "RA", sym: "R_A", dim: "force", units: FORCE, unit: "kN", tol: "def", label: lab("Vertical reaction at A", "رد الفعل الشاقولي عند A") },
        { k: "RB", sym: "R_B", dim: "force", units: FORCE, unit: "kN", tol: "def", label: lab("Vertical reaction at B", "رد الفعل الشاقولي عند B") },
        { k: "Mmax", sym: "M_max", dim: "moment", units: MOM, unit: "kN·m", tol: "def", label: lab("Maximum bending moment", "أقصى عزم انحناء") },
      ],
      text(p, lang) {
        return tr(lang,
          `A simply supported beam AB (pin at A, roller at B) has a span L = ${p.L} m. It carries a uniformly distributed load w = ${p.w} kN/m over the whole span and a point load P = ${p.P} kN at a = ${p.a} m from A. Find the reactions at A and B and the maximum bending moment.`,
          `عتبة بسيطة الإسناد AB (مسند مفصلي عند A ودحروجي عند B) طولها L = ${p.L} m، تحمل حملًا موزعًا منتظمًا w = ${p.w} kN/m على كامل الطول وحملًا مركزًا P = ${p.P} kN على بعد a = ${p.a} m من A. أوجد ردّي الفعل عند A و B وأقصى عزم انحناء.`);
      },
      steps(p, lang) {
        const b = beam(p), after = b.xm > p.a + 1e-9, atP = Math.abs(b.xm - p.a) < 1e-9;
        return [
          tr(lang, `UDL resultant: W = w·L = ${p.w}·${p.L} = ${f(b.W)} kN, acting at L/2 = ${f(p.L / 2)} m from A`, `محصلة الحمل الموزع: W = w·L = ${p.w}·${p.L} = ${f(b.W)} kN تؤثر عند L/2 = ${f(p.L / 2)} m من A`),
          `ΣM_A = 0: R_B·${p.L} − ${f(b.W)}·${f(p.L / 2)} − ${p.P}·${p.a} = 0 → R_B = ${f(b.RB)} kN`,
          `ΣFy = 0: R_A = ${f(b.W)} + ${p.P} − ${f(b.RB)} = ${f(b.RA)} kN`,
          atP ? tr(lang, `The shear changes sign under the point load, so M is largest at x = a = ${p.a} m`, `تتغير إشارة القص تحت الحمل المركز، لذا يكون العزم أكبر ما يمكن عند x = a = ${p.a} m`)
            : tr(lang, `The shear is zero at x = ${f(b.xm)} m (V = R_A − w·x${after ? " − P" : ""} = 0)`, `القص يساوي صفرًا عند x = ${f(b.xm)} m (V = R_A − w·x${after ? " − P" : ""} = 0)`),
          `M_max = R_A·x − w·x²/2${after ? " − P·(x − a)" : ""} = ${f(b.RA)}·${f(b.xm)} − ${p.w}·${f(b.xm)}²/2${after ? ` − ${p.P}·${f(b.xm - p.a)}` : ""} = ${f(b.Mm)} kN·m`,
          tr(lang, `Check ΣM_B: −R_A·L + W·L/2 + P·(L − a) = −${f(b.RA)}·${p.L} + ${f(b.W)}·${f(p.L / 2)} + ${p.P}·${f(p.L - p.a)} = 0 ✓`, `تحقق ΣM_B: −R_A·L + W·L/2 + P·(L − a) = −${f(b.RA)}·${p.L} + ${f(b.W)}·${f(p.L / 2)} + ${p.P}·${f(p.L - p.a)} = 0 ✓`),
        ];
      },
      svg(p) {
        const x0 = 20, x1 = 240, y = 80, sx = (x) => x0 + ((x1 - x0) * x) / p.L, xp = sx(p.a); let udl = "";
        for (let i = 0; i <= 10; i++) { const x = x0 + ((x1 - x0) * i) / 10; udl += arrow(x, 50, x, y - 2, "var(--cobalt)", 1.2); }
        return svg(260, 140, line(x0, 50, x1, 50, "var(--cobalt)", 1.2) + udl + arrow(xp, 12, xp, y - 2, "var(--redline, #c33)", 2.5) + line(x0, y, x1, y, "currentColor", 4) + pin(x0, y + 2) + roller(x1, y + 2)
          + txt(x0, y + 32, "A") + txt(x1, y + 32, "B") + txt(xp + 6, 18, "P", "start") + txt(x1 + 4, 46, "w", "start") + line(x0, 128, x1, 128, "currentColor", 1) + txt((x0 + x1) / 2, 124, "L"));
      },
      kb: { lesson: "c1b-mech-04", p: { L: 6, w: 4, P: 12, a: 2 }, expect: { RA: [20, "kN"], RB: [16, "kN"] } },
    });

    /* ---------- 5. triangular truss by the method of joints (c1b-mech-05) ---------- */
    const truss = (p) => {
      const { L, c, h, H } = p, Pl = p.P, LAC = Math.hypot(c, h), LBC = Math.hypot(L - c, h);
      const By = (Pl * c + H * h) / L, Ay = Pl - By, Ax = -H;
      const AC = (-Ay * LAC) / h, AB = -Ax - (AC * c) / LAC, BC = (-By * LBC) / h;
      return { LAC, LBC, Ax, Ay, By, AC, AB, BC, angA: Math.atan2(h, c) / DEG, angB: Math.atan2(h, L - c) / DEG };
    };
    PR.register({
      id: "mech.trussJoint3", v: 1, obj: "statics.joints", lesson: "c1b-mech-05", subject: CIV, program: "civil", lvl: 2,
      gen(r) {
        for (let t = 0; t < 160; t++) {
          const L = r.grid(3, 8, 0.5), c = r.grid(1, L - 1, 0.5), h = r.grid(1, 4, 0.5), P = r.grid(4, 40, 2), H = r.chance(0.35) ? r.grid(2, 12, 1) : 0, s = truss({ L, c, h, P, H });
          if (s.angA < 25 || s.angA > 65 || s.angB < 25 || s.angB > 65) continue; // member angles kept between 25° and 65°
          if (Math.min(Math.abs(s.AC), Math.abs(s.BC), Math.abs(s.AB)) < 0.1 * P || !balanced([s.AC, s.BC, s.AB])) continue;
          return { L, c, h, P, H };
        }
        return { L: 4, c: 2, h: 3, P: 10, H: 0 };
      },
      solve(p) { const s = truss(p); return { AC: s.AC * 1e3, BC: s.BC * 1e3, AB: s.AB * 1e3, Ax: s.Ax * 1e3, Ay: s.Ay * 1e3, By: s.By * 1e3 }; },
      fields: () => ["AC", "BC", "AB"].map((m) => ({ k: m, sym: "F_" + m, dim: "force", units: FORCE, unit: "kN", tol: "def", sense: ["T", "C"], label: lab(`Force in member ${m}`, `القوة في العضو ${m}`) })),
      text(p, lang) {
        return tr(lang,
          `A triangular truss ABC has a pin support at A and a roller at B; A and B lie on one horizontal line with AB = ${p.L} m. Joint C is ${p.c} m to the right of A and ${p.h} m above AB. A vertical load P = ${p.P} kN acts downward at C${p.H ? ` and a horizontal load H = ${p.H} kN acts to the right at C` : ""}. Find the force in members AC, BC and AB and state whether each is in tension (T) or compression (C).`,
          `جملون مثلثي ABC بمسند مفصلي عند A ودحروجي عند B؛ النقطتان A و B على خط أفقي واحد و AB = ${p.L} m. العقدة C تقع على بعد ${p.c} m يمين A وترتفع ${p.h} m فوق AB. يؤثر حمل شاقولي P = ${p.P} kN نحو الأسفل عند C${p.H ? ` وحمل أفقي H = ${p.H} kN نحو اليمين عند C` : ""}. أوجد القوة في الأعضاء AC و BC و AB وبيّن هل كلٌّ منها شد (T) أم ضغط (C).`);
      },
      steps(p, lang) {
        const s = truss(p), sep = tr(lang, ", ", "، ");
        return [
          tr(lang, "Assume every member is in tension (pulling away from the joint); a negative result means compression.", "نفترض أن كل الأعضاء في حالة شد (تسحب بعيدًا عن العقدة)؛ الناتج السالب يعني ضغطًا."),
          tr(lang, "Geometry: ", "الهندسة: ") + `AC = √(${p.c}² + ${p.h}²) = ${f(s.LAC)} m${sep}BC = √(${f(p.L - p.c)}² + ${p.h}²) = ${f(s.LBC)} m`,
          `ΣM_A = 0: B_y·${p.L} − ${p.P}·${p.c}${p.H ? ` − ${p.H}·${p.h}` : ""} = 0 → B_y = ${f(s.By)} kN`,
          `ΣFy = 0: A_y = ${p.P} − ${f(s.By)} = ${f(s.Ay)} kN${sep}ΣFx = 0: A_x = ${f(s.Ax)} kN`,
          tr(lang, "Joint A, ", "العقدة A، ") + `ΣFy = 0: A_y + F_AC·(${p.h}/${f(s.LAC)}) = 0 → F_AC = ${f(s.AC)} kN → ${TC(lang, s.AC)}`,
          tr(lang, "Joint A, ", "العقدة A، ") + `ΣFx = 0: A_x + F_AB + F_AC·(${p.c}/${f(s.LAC)}) = 0 → F_AB = ${f(s.AB)} kN → ${TC(lang, s.AB)}`,
          tr(lang, "Joint B, ", "العقدة B، ") + `ΣFy = 0: B_y + F_BC·(${p.h}/${f(s.LBC)}) = 0 → F_BC = ${f(s.BC)} kN → ${TC(lang, s.BC)}`,
          tr(lang, "Check at joint B, ", "تحقق عند العقدة B، ") + `ΣFx = 0: −F_AB + F_BC·(${f(p.c - p.L)}/${f(s.LBC)}) = −${fp(s.AB)} + ${fp((s.BC * (p.c - p.L)) / s.LBC)} = 0 ✓`,
        ];
      },
      svg(p) {
        const k = Math.min(200 / p.L, 90 / p.h), ax = 30, ay = 125, bx = ax + k * p.L, cx = ax + k * p.c, cy = ay - k * p.h;
        return svg(Math.round(bx + 40), 165, line(ax, ay, bx, ay) + line(ax, ay, cx, cy) + line(bx, ay, cx, cy) + pin(ax, ay) + roller(bx, ay)
          + arrow(cx, cy - 34, cx, cy - 3, "var(--redline, #c33)", 2.5) + (p.H ? arrow(cx - 36, cy, cx - 4, cy, "var(--redline, #c33)", 2.5) : "")
          + txt(ax - 12, ay + 4, "A", "end") + txt(bx + 12, ay + 4, "B", "start") + txt(cx + 8, cy + 4, "C", "start") + txt(cx + 6, cy - 26, "P", "start") + (p.H ? txt(cx - 36, cy - 6, "H", "start") : ""));
      },
      kb: { lesson: "c1b-mech-05", p: { L: 4, c: 2, h: 3, P: 10, H: 0 }, expect: { AC: [-6.01, "kN"], BC: [-6.01, "kN"], AB: [3.33, "kN"] } },
    });

    /* ---------- 6. centroid of a composite T-section (c1b-mech-09, also a2-mec-04) ---------- */
    const tsec = (p) => { const A1 = p.bf * p.tf, y1 = p.hw + p.tf / 2, A2 = p.tw * p.hw, y2 = p.hw / 2; return { A1, y1, A2, y2, A: A1 + A2, Ay: A1 * y1 + A2 * y2, yb: (A1 * y1 + A2 * y2) / (A1 + A2) }; };
    PR.register({
      id: "geo.compositeCentroid", v: 1, obj: "statics.centroid", lesson: "c1b-mech-09", lessons: ["c1b-mech-09", "a2-mec-04"], subject: CIV, program: "both", lvl: 1,
      gen(r) { const bf = r.grid(100, 400, 10); return { bf, tf: r.grid(10, 40, 5), tw: r.grid(10, Math.min(40, Math.floor(bf / 15) * 5), 5), hw: r.grid(100, 400, 10) }; },
      solve(p) { const s = tsec(p); return { yb: s.yb * 1e-3, A: s.A * 1e-6 }; },
      fields: () => [{ k: "yb", sym: "ȳ", dim: "length", units: LEN, unit: "mm", tol: "geo", label: lab("Height of the centroid ȳ above the bottom of the web", "ارتفاع المركز ȳ فوق أسفل الجذع") }],
      text(p, lang) {
        return tr(lang,
          `A T-section is made of a flange ${p.bf} mm wide × ${p.tf} mm thick on top of a web ${p.tw} mm thick × ${p.hw} mm high (total height ${p.hw + p.tf} mm). Find the height ȳ of the centroid measured from the bottom of the web.`,
          `مقطع على شكل T يتكون من شفة (Flange) عرضها ${p.bf} mm وسمكها ${p.tf} mm فوق جذع (Web) سمكه ${p.tw} mm وارتفاعه ${p.hw} mm (الارتفاع الكلي ${p.hw + p.tf} mm). أوجد ارتفاع المركز ȳ مقيسًا من أسفل الجذع.`);
      },
      steps(p, lang) {
        const s = tsec(p), sep = tr(lang, ", ", "، ");
        return [
          tr(lang, "Flange: ", "الشفة: ") + `A1 = ${p.bf}·${p.tf} = ${s.A1} mm²${sep}y1 = ${p.hw} + ${p.tf}/2 = ${f(s.y1)} mm`,
          tr(lang, "Web: ", "الجذع: ") + `A2 = ${p.tw}·${p.hw} = ${s.A2} mm²${sep}y2 = ${p.hw}/2 = ${f(s.y2)} mm`,
          `ΣA = ${s.A} mm²${sep}ΣA·y = ${s.A1}·${f(s.y1)} + ${s.A2}·${f(s.y2)} = ${f(s.Ay)} mm³`,
          `ȳ = ΣA·y / ΣA = ${f(s.Ay)} / ${s.A} = ${f(s.yb)} mm` + tr(lang, ` (x̄ = ${p.bf / 2} mm, on the axis of symmetry)`, ` (x̄ = ${p.bf / 2} mm على محور التناظر)`),
        ];
      },
      svg(p) {
        const H = p.hw + p.tf, k = 130 / Math.max(p.bf, H), w = p.bf * k, x0 = 40, y0 = 15, cx = x0 + w / 2, tw = Math.max(p.tw * k, 3);
        return svg(Math.round(w + 90), 175, `<rect x="${n1(x0)}" y="${y0}" width="${n1(w)}" height="${n1(Math.max(p.tf * k, 3))}" fill="var(--cobalt-wash, #dde6f3)" stroke="currentColor"/>`
          + `<rect x="${n1(cx - tw / 2)}" y="${n1(y0 + p.tf * k)}" width="${n1(tw)}" height="${n1(p.hw * k)}" fill="var(--cobalt-wash, #dde6f3)" stroke="currentColor"/>`
          + txt(cx, y0 + H * k + 16, `${p.tw}`) + txt(x0 + w + 6, y0 + (p.tf * k) / 2 + 4, `${p.tf}`, "start") + txt(cx + tw / 2 + 6, y0 + p.tf * k + (p.hw * k) / 2, `${p.hw}`, "start") + txt(cx, y0 - 3, `${p.bf}`));
      },
      kb: [
        { lesson: "c1b-mech-09", p: { bf: 200, tf: 20, tw: 20, hw: 180 }, expect: { yb: [142.6, "mm"] } },
        { lesson: "a2-mec-04", p: { bf: 200, tf: 20, tw: 20, hw: 180 }, expect: { yb: [142.6, "mm"] } },
      ],
    });
  } catch (e) { (S5.COLLEGE_ERRORS = S5.COLLEGE_ERRORS || []).push("20-gens-y1: " + (e && e.message)); console.error(e); }
})();

/* College M3 — the Problem room (docs/COLLEGE_PLAN.md §M3). View `pset`: a seeded problem from the M2 engine,
   one input (inputmode=decimal) + unit picker per field (+ a sense picker where the field has a sense), graded by
   S5.prob.grade (code, never the AI), feedback per structured code, the code-made steps revealed after submit,
   "New numbers", and worked-example fading 0–3 (backward fading: level 0 shows every step, each level hides about a
   third more from the end, level 3 shows none; a correct answer climbs one level, any other result drops one).
   Levels 0–2 (or any step revealed on request) record tier E2; level 3 unaided records E3, which is what mastery counts.
   One `attempt` record per submit (additive type). The fade level is derived from the latest practice attempt of
   the objective, so it survives reloads and backups; the current item ({pid, v, seed, hints, t0}) is a per-device
   convenience in S5.ls 'pset_cur_<obj>' so a reload resumes the same numbers. */
(() => {
  try {
    const P = (S5.pset = S5.pset || {});
    const esc = S5.esc, H = S5.h;
    const lang = () => (S5.i18n && S5.i18n.lang ? S5.i18n.lang() : "ar");
    const tr = (en, ar) => (lang() === "ar" ? ar : en);
    const tx = (o) => (o ? o[lang()] || o.en || "" : "");
    const MAXFADE = 3;
    P.KINDS = { civil: ["civil", "both"], arch: ["arch", "both"] };
    const at = (a) => a.at || a.createdAt || "";
    const correct = (a) => !!a && (a.score || 0) >= 0.999;

    /* ---------- pure helpers (no DOM) ---------- */
    P.gens = (kind) => S5.prob.list((d) => (P.KINDS[kind] || P.KINDS.civil).includes(d.program || "civil"));
    P.objs = (kind) => { const out = []; for (const d of P.gens(kind)) if (!out.includes(d.obj)) out.push(d.obj); return out; };
    P.gensOf = (kind, obj) => P.gens(kind).filter((d) => d.obj === obj);
    // steps hidden before submitting at fade level L (backward fading, proportional to the number of steps)
    P.hidden = (L, n) => (L >= MAXFADE ? n : Math.min(n, Math.ceil((n * Math.max(0, L)) / MAXFADE)));
    P.practice = (obj) => S5.store.list("attempt", (a) => !a.deleted && a.obj === obj && a.mode === "practice" && Number.isInteger(a.fade)).sort((a, b) => at(a).localeCompare(at(b)));
    // the fade level for the next item of an objective: the latest practice attempt's level, +1 when correct, −1 otherwise
    P.nextFade = (obj) => { const xs = P.practice(obj); const a = xs[xs.length - 1]; if (!a) return 0; return Math.max(0, Math.min(MAXFADE, a.fade + (correct(a) ? 1 : -1))); };
    P.tierFor = (fade, hints) => (fade >= MAXFADE && !hints ? "E3" : "E2");
    P.attemptFor = (cur) => { const xs = S5.store.list("attempt", (a) => !a.deleted && a.pid === cur.pid && a.v === cur.v && a.seed === cur.seed && a.mode === "practice").sort((a, b) => at(a).localeCompare(at(b))); return xs[xs.length - 1] || null; };
    const usedSeeds = (pid) => new Set(S5.store.list("attempt", (a) => a.pid === pid).map((a) => a.seed));
    const curKey = (obj) => "pset_cur_" + obj;
    P.fresh = (pid, avoid) => { const def = S5.PROB[pid]; const used = usedSeeds(pid); if (avoid != null) used.add(avoid); return { pid, v: def.v, seed: S5.newSeed(used), hints: 0, t0: Date.now() }; };
    P.loadCur = (obj, pid) => {
      let c = S5.ls.get(curKey(obj), null); const def = c && S5.PROB[c.pid];
      if (!c || !def || def.v !== c.v || def.obj !== obj || (pid && c.pid !== pid)) { c = P.fresh(pid || (def && def.obj === obj ? c.pid : S5.prob.forObj(obj)[0].id)); S5.ls.set(curKey(obj), c); }
      return c;
    };
    P.saveCur = (obj, c) => S5.ls.set(curKey(obj), c);

    /* ---------- feedback by code (bilingual, rendered inside [data-noi18n]) ---------- */
    const CODE = { ok: ["Correct", "صحيح"], rounding: ["Rounding — half credit", "تقريب — نصف الدرجة"], unit: ["Unit slip", "خطأ في الوحدة"], sign: ["Wrong sign or sense", "إشارة أو اتجاه خاطئ"],
      x2: ["Off by a factor of 2", "خطأ بمعامل 2"], "deg-rad": ["Degrees/radians mix-up", "خلط بين الدرجات والراديان"], wrong: ["Not correct", "غير صحيح"], empty: ["No answer", "لا توجد إجابة"] };
    P.codeLabel = (c) => { const x = CODE[c] || CODE.wrong; return tr(x[0], x[1]); };
    P.message = (r, f, lang1) => {
      const tr = (en, ar) => ((lang1 || lang()) === "ar" ? ar : en);
      const c = r.code, d = f.dim, u = r.unit;
      if (c === "ok") return tr("Correct — within tolerance of the code's key.", "صحيح — ضمن السماحية من مفتاح الحل المحسوب بالكود.");
      if (c === "rounding") return tr(`Close, but about ${S5.prob.fmt(r.err * 100, 1)}% off — a rounding slip. Half credit; it never counts toward mastery. Keep 3–4 significant figures until the end.`,
        `قريب، لكن الفرق نحو ${S5.prob.fmt(r.err * 100, 1)}% — خطأ تقريب. نصف الدرجة، ولا يُحتسب للإتقان أبدًا. احتفظ بـ 3–4 أرقام معنوية حتى النهاية.`);
      if (c === "unit") {
        if (r.why === "dim") return tr("Unit slip: that unit measures a different quantity.", "خطأ في الوحدة: هذه الوحدة تقيس كمية أخرى.");
        const n = r.scale, U = S5.units, pick = U[u] ? S5.unitsOf(d).find((w) => Math.abs(Math.log10(U[w].toSI) - (Math.log10(U[u].toSI) - n)) < 1e-9) : null;
        const flip = r.flipped ? tr(" The sign is also reversed.", " والإشارة معكوسة أيضًا.") : "";
        if (pick != null && pick !== "") return tr(`Unit slip: you gave ${pick}, asked ${u} — the number you typed is the answer in ${pick}, but the unit picked is ${u}. Convert it or pick ${pick}.${flip}`,
          `خطأ في الوحدة: أعطيت ${pick} والمطلوب ${u} — الرقم الذي كتبته هو الجواب بوحدة ${pick}، لكن الوحدة المختارة ${u}. حوّله أو اختر ${pick}.${flip}`);
        return tr(`Unit slip: your number is about 10^${n} times the answer — check the unit conversion.${flip}`, `خطأ في الوحدة: رقمك يساوي تقريبًا 10^${n} مرة الجواب — راجع تحويل الوحدات.${flip}`);
      }
      if (c === "sign") {
        if (r.mis) return tr("Wrong direction: your angle points the opposite way — fix the quadrant from the signs of the components.", "اتجاه خاطئ: زاويتك تشير إلى الاتجاه المعاكس — حدّد الربع من إشارتي المركبتين.");
        return f.sense ? tr("Wrong sense: the size is right but the sense is reversed (tension/compression or direction of rotation).", "اتجاه خاطئ: المقدار صحيح لكن النوع معكوس (شد/ضغط أو اتجاه الدوران).")
          : tr("Wrong sign: the size is right but the direction is reversed.", "إشارة خاطئة: المقدار صحيح لكن الاتجاه معكوس.");
      }
      if (c === "x2") return r.factor === 0.5 ? tr("Your answer is half the key — a factor of 2 went missing.", "جوابك نصف القيمة الصحيحة — سقط معامل 2.") : tr("Your answer is twice the key — an extra factor of 2 slipped in.", "جوابك ضعف القيمة الصحيحة — دخل معامل 2 زائد.");
      if (c === "deg-rad") {
        if (r.mis) return tr("Degrees/radians mix-up: your calculator seems to be in radians — switch it to degrees.", "خلط بين الدرجات والراديان: يبدو أن الحاسبة على وضع الراديان — حوّلها إلى الدرجات.");
        return r.as === "rad" ? tr("Degrees/radians mix-up: you typed a value in radians but picked deg.", "خلط بين الدرجات والراديان: كتبت قيمة بالراديان لكنك اخترت deg.") : tr("Degrees/radians mix-up: you typed a value in degrees but picked rad.", "خلط بين الدرجات والراديان: كتبت قيمة بالدرجات لكنك اخترت rad.");
      }
      if (c === "empty") return r.bad ? tr("Could not read that number. Use digits, a decimal point or comma, or a fraction like 7/3.", "تعذّرت قراءة الرقم. استخدم الأرقام أو الفاصلة العشرية أو كسرًا مثل 7/3.") : tr("No answer.", "لا توجد إجابة.");
      return tr("Not correct. Compare your working with the steps below.", "غير صحيح. قارن حلك بالخطوات أدناه.");
    };

    /* ---------- current item ---------- */
    const build = (r) => {
      const kind = P.KINDS[r.kind] ? r.kind : "civil", objs = P.objs(kind);
      if (!objs.length) return { kind, objs };
      let obj = null, pid = null;
      if (r.id && S5.PROB[r.id] && objs.includes(S5.PROB[r.id].obj)) { pid = r.id; obj = S5.PROB[r.id].obj; }
      else if (r.id && objs.includes(r.id)) obj = r.id;
      else { const o = S5.ls.get("pset_obj_" + kind, null); obj = objs.includes(o) ? o : objs[0]; }
      if (pid && !P.gensOf(kind, obj).some((d) => d.id === pid)) pid = null;
      let c = P.loadCur(obj, pid);
      if (!P.gensOf(kind, obj).some((d) => d.id === c.pid)) { c = P.fresh(P.gensOf(kind, obj)[0].id); P.saveCur(obj, c); }
      S5.ls.set("pset_obj_" + kind, obj);
      const def = S5.PROB[c.pid], inst = S5.prob.instance(c.pid, c.seed), done = P.attemptFor(c);
      const fade = done && Number.isInteger(done.fade) ? done.fade : P.nextFade(obj);
      return { kind, objs, obj, def, inst, cur: c, done, fade };
    };

    const css = () => {
      if (document.getElementById("ps-css")) return;
      const st = document.createElement("style"); st.id = "ps-css";
      st.textContent = `.ps-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.ps-chip{border:1px solid var(--rule);border-radius:999px;background:var(--paper);color:var(--ink);padding:5px 10px;font-size:.8rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.ps-chip[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}.ps-chip .st{font-size:.7rem;padding:1px 6px;border-radius:999px;background:var(--rule)}.ps-chip[data-state="secure"] .st,.ps-chip[data-state="mastered"] .st{background:var(--green-wash,#dfeedd)}.ps-chip[data-state="practicing"] .st{background:var(--amber-wash,#f6ecd2)}
.ps-text{font-size:1rem;line-height:1.7;margin:8px 0}.ps-fig{margin:8px 0;color:var(--ink)}.ps-field{border-top:1px solid var(--rule);padding:10px 0;display:grid;gap:6px}.ps-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ps-row input{flex:1 1 140px;min-width:0;max-width:240px;font-size:1.05rem}.ps-row select{max-width:140px}.ps-fb{font-size:.88rem;line-height:1.5}.ps-fb[data-code="ok"]{color:var(--green,#2e7d32)}.ps-fb:not([data-code="ok"]):not(:empty){color:var(--redline,#b3261e)}
.ps-steps{margin:6px 0 0;padding-inline-start:22px;line-height:1.7}.ps-steps li{margin:2px 0}.ps-result{font-weight:700;margin:8px 0}.ps-result[data-ok="true"]{color:var(--green,#2e7d32)}`;
      document.head.appendChild(st);
    };

    const chips = (b) => `<div class="ps-chips" id="ps-chips" role="toolbar">${b.objs.map((o) => { const O = S5.OBJ[o] || { en: o, ar: o }, s = S5.mastery.of(o);
      return `<button class="ps-chip" data-act="pset-obj" data-obj="${esc(o)}" data-kind="${b.kind}" data-state="${s}" aria-pressed="${o === b.obj}"><span data-noi18n dir="auto">${esc(tx(O))}</span><span class="st">${esc(S5.mastery.LABEL[s] || s)}</span></button>`; }).join("")}</div>`;

    const fieldHTML = (f, b, given, res) => {
      const dr = !b.done && P.draft && P.draft.id === b.cur.pid + ":" + b.cur.seed ? P.draft.given[f.k] : null;
      const g = given || dr || [], dis = b.done ? "disabled" : "", unit = g[1] != null && g[1] !== "" ? g[1] : f.unit, val = g[0] != null ? String(g[0]) : "";
      const units = (f.units || []).length > 1 || (f.units || [])[0] ? `<select id="ps-u-${f.k}" data-k="${f.k}" data-noi18n aria-label="Unit" ${dis}>${f.units.map((u) => `<option value="${esc(u)}" ${u === unit ? "selected" : ""}>${esc(u)}</option>`).join("")}</select>` : "";
      const sense = f.sense ? `<select id="ps-s-${f.k}" data-k="${f.k}" data-noi18n aria-label="Sense" ${dis}><option value="">${esc(tr("choose…", "اختر…"))}</option>${f.sense.map((s) => `<option value="${esc(s)}" ${g[2] === s ? "selected" : ""}>${esc(s)} · ${esc(tx(S5.prob.SENSE[s] || { en: s, ar: s }))}</option>`).join("")}</select>` : "";
      const fb = res ? `<span class="pill" data-noi18n>${esc(P.codeLabel(res.code))}</span> <span data-noi18n dir="auto">${esc(P.message(res, f))}</span>` : "";
      return `<div class="ps-field" data-k="${f.k}"><label for="ps-in-${f.k}" data-noi18n dir="auto"><b>${esc(f.sym || f.k)}</b> — ${esc(tx(f.label) || f.k)}</label>
        <div class="ps-row"><input id="ps-in-${f.k}" data-k="${f.k}" inputmode="decimal" autocomplete="off" dir="ltr" value="${esc(val)}" ${dis}>${units}${sense}</div>
        <div class="ps-fb" id="ps-fb-${f.k}" data-code="${res ? res.code : ""}">${fb}</div></div>`;
    };

    const itemHTML = (b) => {
      const { def, inst, cur, done, fade } = b, L = lang(), p = inst.p;
      const steps = def.steps(p, L) || [], n = steps.length, hints = cur.hints || 0;
      const g = done ? S5.prob.grade(def, p, done.given || {}) : null;
      const shown = done ? n : Math.min(n, n - P.hidden(fade, n) + hints), tier = done ? done.tier : P.tierFor(fade, hints);
      const other = L === "ar" ? "en" : "ar", fig = def.svg ? `<div class="ps-fig" data-noi18n>${def.svg(p)}</div>` : "";
      const head = `<div class="row" style="gap:6px;flex-wrap:wrap"><span class="pill cobalt" id="ps-fade" data-fade="${fade}"><span>Help level</span> ${fade} / ${MAXFADE}</span><span class="pill ${tier === "E3" ? "green" : "amber"}" id="ps-tier" data-tier="${tier}">${esc((S5.TIERS[tier] || {}).label || tier)}</span>${hints && !done ? `<span class="pill amber">Step revealed — practice only</span>` : ""}</div>`;
      const result = g ? `<div class="ps-result" id="ps-result" data-ok="${g.ok}" data-score="${g.score}" data-noi18n>${esc(g.ok ? tr("Correct", "صحيح") : tr(`Score ${Math.round(g.score * 100)}% — not yet`, `الدرجة ${Math.round(g.score * 100)}% — ليس بعد`))}</div>` : "";
      const stepList = shown ? `<ol class="ps-steps" id="ps-steps" data-shown="${shown}" data-noi18n dir="auto">${steps.slice(0, shown).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : `<ol class="ps-steps" id="ps-steps" data-shown="0"></ol>`;
      const left = n - shown;
      const stepsSec = `<div style="margin-top:12px"><h3 style="margin:0 0 4px">${done ? "Solution by code" : fade === 0 ? "Worked example" : "Worked example (partly hidden)"}</h3>${stepList}${left > 0 ? `<p class="tiny muted"><span>Steps hidden:</span> ${left}</p>` : ""}</div>`;
      const btns = done ? `${H.btn("New numbers", "pset-new", { obj: b.obj, kind: b.kind }, "primary")}`
        : `${H.btn("Submit", "pset-submit", { obj: b.obj, kind: b.kind }, "primary")}${left > 0 ? H.btn("Show a step", "pset-steps", { obj: b.obj, kind: b.kind }) : ""}${H.btn("New numbers", "pset-new", { obj: b.obj, kind: b.kind })}`;
      return `<section class="sheet" id="ps-item" data-pid="${esc(cur.pid)}" data-seed="${cur.seed}" data-done="${!!done}">${head}
        <div class="ps-text" data-noi18n dir="auto" id="ps-text">${esc(def.text(p, L))}</div>
        <details class="tiny muted" data-noi18n><summary>${L === "ar" ? "English" : "العربية"}</summary><div dir="auto">${esc(def.text(p, other))}</div></details>${fig}
        <div id="ps-fields">${inst.fields.map((f) => fieldHTML(f, b, done && done.given ? done.given[f.k] : null, g ? g.results[f.k] : null)).join("")}</div>
        ${result}<div class="row" style="margin-top:8px">${btns}</div>${stepsSec}</section>`;
    };

    S5.views.pset = (r) => {
      css();
      const b = build(r || {});
      const crumbs = `<div class="crumbs"><button data-act="open" data-v="practice">Practice</button><button data-act="open" data-v="campus">Campus</button></div>`;
      const title = b.kind === "arch" ? "Architecture · Problem room" : "Civil Engineering · Problem room";
      const intro = `<p class="small muted">Every answer key is computed and graded by code; the AI never marks. Help fades as you get answers right: unaided correct answers on fresh numbers are what count toward mastery.</p>`;
      if (S5.setPlace) S5.setPlace("Problem room", { v: "pset", kind: b.kind, ...(b.obj ? { id: b.obj } : {}) });
      if (!b.objs.length) { P.cur = null; return `${crumbs}<div class="page-head"><div class="titles"><span class="eyebrow">${title}</span><h1>Problem room</h1></div></div>${H.empty("No problems yet", "Graded problems for this department arrive in a later update.")}`; }
      P.cur = { kind: b.kind, obj: b.obj, pid: b.cur.pid, v: b.cur.v, seed: b.cur.seed, p: b.inst.p, keys: b.inst.keys, fields: b.inst.fields, fade: b.fade, hints: b.cur.hints || 0, done: !!b.done, tier: b.done ? b.done.tier : P.tierFor(b.fade, b.cur.hints || 0) };
      S5.ui.mount(() => {
        const view = document.getElementById("view");
        const onKey = (e) => { if (e.key === "Enter" && e.target && e.target.id && e.target.id.startsWith("ps-in-")) { e.preventDefault(); const btn = view.querySelector('[data-act="pset-submit"]'); if (btn) btn.click(); } };
        // typed answers survive a re-render of this view (Show a step, language switch): kept in memory per item
        const onInput = (e) => { const t = e.target; if (t && t.id && /^ps-(in|u|s)-/.test(t.id) && P.cur && !P.cur.done) P.draft = { id: P.cur.pid + ":" + P.cur.seed, given: P.read().given }; };
        view.addEventListener("keydown", onKey); view.addEventListener("input", onInput); view.addEventListener("change", onInput);
        return () => { view.removeEventListener("keydown", onKey); view.removeEventListener("input", onInput); view.removeEventListener("change", onInput); };
      });
      const O = S5.OBJ[b.obj] || {};
      return `${crumbs}<div class="page-head"><div class="titles"><span class="eyebrow">${title}</span><h1>Problem room</h1>${intro}</div></div>
        ${chips(b)}<p class="small" data-noi18n dir="auto"><b>${esc(tr("Objective", "الهدف"))}:</b> ${esc(tx(O))}</p>${itemHTML(b)}`;
    };

    /* ---------- actions ---------- */
    P.read = () => {
      const given = {}; let any = false;
      for (const f of (P.cur && P.cur.fields) || []) {
        const i = document.getElementById("ps-in-" + f.k), u = document.getElementById("ps-u-" + f.k), s = document.getElementById("ps-s-" + f.k);
        const v = i ? i.value : ""; if (String(v).trim()) any = true;
        given[f.k] = [v, u ? u.value : f.unit, s ? s.value || null : undefined];
        if (!f.sense) given[f.k].length = 2;
      }
      return { given, any };
    };
    P.submit = async () => {
      const c = P.cur; if (!c || c.done || c.busy) return null; // busy: a double tap must not save two attempts
      const { given, any } = P.read(); if (!any) { S5.ui.toast("Type an answer first"); return null; }
      if (c.fields.some((f) => f.sense && String(given[f.k][0]).trim() && !given[f.k][2])) { S5.ui.toast("Choose the sense (tension/compression or turning direction) first"); return null; }
      c.busy = true;
      const def = S5.PROB[c.pid], inst = S5.prob.instance(c.pid, c.seed), g = S5.prob.grade(def, inst.p, given);
      const cur = S5.ls.get(curKey(c.obj), null) || {}, hints = cur.hints || 0, t0 = cur.t0 || Date.now();
      const rec = await S5.store.create("attempt", S5.prob.record(inst, g, { tier: P.tierFor(c.fade, hints), mode: "practice", fade: c.fade, ms: Math.max(0, Date.now() - t0), hints, kind: c.kind }));
      S5.mastery.clear();
      S5.ui.render();
      return rec;
    };
    S5.act["pset-submit"] = () => P.submit();
    S5.act["pset-new"] = (el) => {
      const c = P.cur; if (!c) return;
      const gens = P.gensOf(c.kind, c.obj), i = gens.findIndex((d) => d.id === c.pid), next = gens[(i + 1) % gens.length] || gens[0];
      P.saveCur(c.obj, P.fresh(next.id, c.seed));
      S5.ui.go({ v: "pset", kind: c.kind, id: c.obj }, true);
    };
    S5.act["pset-steps"] = () => {
      const c = P.cur; if (!c || c.done) return;
      const cur = S5.ls.get(curKey(c.obj), null); if (!cur) return;
      cur.hints = (cur.hints || 0) + 1; P.saveCur(c.obj, cur); S5.ui.render();
    };
    S5.act["pset-obj"] = (el) => { const kind = el.dataset.kind || (P.cur && P.cur.kind) || "civil"; S5.ls.set("pset_obj_" + kind, el.dataset.obj); S5.ui.go({ v: "pset", kind, id: el.dataset.obj }, true); };

    /* ---------- 'Graded practice' on a mapped library lesson (tutor.js lessonHTML calls this when present) ---------- */
    P.lessonRoute = (t, prog) => {
      if (!t || !S5.prob) return null; const gens = S5.prob.forLesson(t.id); if (!gens.length) return null;
      const want = prog === "arch" || prog === "civil" ? prog : t.program === "arch" ? "arch" : "civil";
      const g = gens.find((d) => P.KINDS[want].includes(d.program || "civil")) || gens[0];
      const kind = P.KINDS[want].includes(g.program || "civil") ? want : g.program === "arch" ? "arch" : "civil";
      return { v: "pset", kind, id: g.obj };
    };
    P.lessonBtn = (t, prog) => { const r = P.lessonRoute(t, prog); return r ? H.btn("Graded practice", "open", { v: r.v, kind: r.kind, id: r.id }) : ""; };

    // the entry card on the Practice page (view-practice.js calls this when present)
    P.cardHTML = () => `<section class="sheet" id="ps-card" style="margin-bottom:16px"><span class="eyebrow">Problem sets</span><h3 style="margin:2px 0">Problem room</h3><p class="small muted">Fresh numbers every time, graded exactly by code.</p>
      <div class="row">${H.btn("Civil problems", "open", { v: "pset", kind: "civil" }, "primary")}${H.btn("Architecture problems", "open", { v: "pset", kind: "arch" })}</div></section>`;

    /* ---------- registration (no edits to shared files) ---------- */
    S5.CAMPUS_EXTRA = S5.CAMPUS_EXTRA || [];
    S5.CAMPUS_EXTRA.push(["civil", ["Problem room", { v: "pset", kind: "civil" }]], ["arch", ["Problem room", { v: "pset", kind: "arch" }]]);
    S5.LIVE_EXTRA = S5.LIVE_EXTRA || []; S5.LIVE_EXTRA.push("pset");
    S5.ROOT_EXTRA = Object.assign(S5.ROOT_EXTRA || {}, { pset: "practice" });
  } catch (e) { (S5.COLLEGE_ERRORS = S5.COLLEGE_ERRORS || []).push("30-view-pset: " + (e && e.message)); console.error(e); }
})();

// ---- college/70-jury.js ----
/* College M8 — the Jury room: a studio pin-up with a rubric (docs/COLLEGE_PLAN.md §M8).
   Flow, like a real first-year review: pin up a board (photo or ink page, downscaled to ≤1280 px, JPEG 0.85) and
   state the intent → score yourself first (E0) → an AI juror reads the board against the rubric (E1, advice only)
   → type in the professor's or jury's scores verbatim (EP) → compare the three in a calibration table.
   Code, never the AI, decides what counts: the juror's reply is validated (unknown criteria dropped, levels
   clamped to 1–4) and every weighted total is computed here. Nothing in this file writes `attempt` records,
   tutorProg or studioProg, so no jury score can ever change mastery. Rubrics are static content in code
   (not seeded records); a pin-up is one `jury` record (additive type, no migration). */
(() => {
  const J = (S5.jury = S5.jury || {});
  const esc = S5.esc;
  J.BUDGET = 6; // AI juror requests per day (per device)
  J.MAXPX = 1280; J.QUALITY = 0.85;
  J.PURPOSE = "Jury";
  /* evidence tiers used by the jury (the plan's E0/E1/EP); S5.TIERS from the engine is used when present */
  J.TIER = { self: "E0", ai: "E1", prof: "EP" };
  J.LEVELS = [
    { n: 1, en: "Beginning", ar: "مبتدئ" },
    { n: 2, en: "Developing", ar: "قيد التطوّر" },
    { n: 3, en: "Proficient", ar: "متمكّن" },
    { n: 4, en: "Exemplary", ar: "متميّز" },
  ];
  const L = (en, ar) => ({ en, ar });
  const crit = (id, w, en, ar, lv) => ({ id, w, en, ar, lv: lv.map(([e, a]) => L(e, a)) });

  /* ---------- three Year-1 architecture rubrics: written for this app, vocabulary aligned with a first-year
     design studio (Harvard GSD 1101-level topics), never copied. Weights add up to 100. ---------- */
  S5.RUBRICS = S5.RUBRICS || {};
  Object.assign(S5.RUBRICS, {
    comp: {
      id: "comp", v: 1, en: "Composition of primary forms", ar: "التكوين بالأشكال الأولية",
      brief: L("Compose three to five primary solids (cube, prism, cylinder, cone or pyramid, sphere) into one unified composition. Pin up a photo of the model or the drawings (plan, elevation and one view) and state the ordering idea in one or two sentences.",
        "كوّن من ثلاثة إلى خمسة مجسّمات أولية (مكعب، منشور، أسطوانة، مخروط أو هرم، كرة) تكويناً واحداً متماسكاً. علّق صورة المجسّم أو الرسومات (مسقط وواجهة ومنظور واحد) واكتب فكرة النظام في جملة أو جملتين."),
      criteria: [
        crit("order", 20, "Ordering idea and hierarchy", "فكرة النظام والتدرّج الهرمي", [
          ["No clear ordering idea; the forms read as separate objects of equal importance.", "لا توجد فكرة نظام واضحة؛ تُقرأ الأشكال كقطع منفصلة متساوية الأهمية."],
          ["An ordering idea is hinted at (an axis, a grid or symmetry) but breaks in places; the dominant form is unclear.", "تظهر فكرة نظام بشكل خافت (محور أو شبكة أو تناظر) لكنها تنكسر في مواضع، والشكل المهيمن غير واضح."],
          ["A clear ordering principle (axis, datum, rhythm or symmetry) with one dominant form and readable subordinate forms.", "مبدأ نظام واضح (محور أو خط مرجعي أو إيقاع أو تناظر) مع شكل مهيمن واحد وأشكال تابعة مقروءة."],
          ["The ordering principle governs every decision; the hierarchy reads at once from any view and the exceptions are deliberate.", "مبدأ النظام يحكم كل قرار؛ يُقرأ التدرّج الهرمي فوراً من أي زاوية، والاستثناءات مقصودة."]]),
        crit("relate", 20, "Relationships between forms", "العلاقات بين الأشكال", [
          ["Forms are only placed next to each other; the joints are accidental.", "الأشكال موضوعة بجانب بعضها فقط، والوصلات بينها عشوائية."],
          ["One kind of relationship is used (for example stacking) without studying how the forms meet.", "استُخدم نوع واحد من العلاقات (مثل التكديس) دون دراسة كيف تلتقي الأشكال."],
          ["Several relationships (touching, overlapping, interlocking, subtraction) are used on purpose and each joint reads clearly.", "استُخدمت عدة علاقات (تماس، تراكب، تداخل، طرح) عن قصد، وكل وصلة مقروءة بوضوح."],
          ["The way the forms meet carries the idea: each joint shows which form leads and which one yields.", "طريقة التقاء الأشكال تحمل الفكرة: كل وصلة تبيّن أي شكل يقود وأيّها يتراجع."]]),
        crit("propor", 15, "Proportion and scale", "التناسب والمقياس", [
          ["Sizes look arbitrary; there is no relation between the dimensions of the forms.", "الأحجام تبدو اعتباطية، ولا علاقة بين أبعاد الأشكال."],
          ["Some size relations are intended but they are inconsistent between plan and elevation.", "بعض علاقات الأحجام مقصودة لكنها غير متّسقة بين المسقط والواجهة."],
          ["Dimensions follow a deliberate ratio or module, and the forms hold together as one family.", "الأبعاد تتبع نسبة أو وحدة قياس مقصودة، والأشكال تتماسك كعائلة واحدة."],
          ["A proportional system (a module, a ratio such as 1:2, or the golden section) is explicit, measured and shown on the drawings.", "نظام تناسبي (وحدة قياس أو نسبة مثل 1:2 أو النسبة الذهبية) صريح ومقاس ومبيّن على الرسومات."]]),
        crit("void", 15, "Solid and void (figure and ground)", "الكتلة والفراغ (الشكل والأرضية)", [
          ["Only the solids were designed; the spaces between them are leftovers.", "صُمّمت الكتل فقط، والفراغات بينها بقايا غير مقصودة."],
          ["Some voids are noticed but not shaped; the ground plane is ignored.", "بعض الفراغات ملحوظة لكنها غير مشكَّلة، ومستوى الأرضية مُهمَل."],
          ["The voids between the forms are shaped as positive spaces, and the base or ground plane is part of the composition.", "الفراغات بين الأشكال مشكَّلة كفراغات إيجابية، والقاعدة أو مستوى الأرضية جزء من التكوين."],
          ["Solid and void hold each other in balanced tension; a figure-ground reading of the plan confirms the idea.", "الكتلة والفراغ في توازن مشدود، وقراءة الشكل والأرضية في المسقط تؤكّد الفكرة."]]),
        crit("intent", 15, "Legibility of the intent", "وضوح الفكرة المعلنة", [
          ["The board does not show what the intent statement claims.", "اللوحة لا تُظهر ما يقوله بيان الفكرة."],
          ["The intent becomes visible only after it is explained.", "الفكرة لا تظهر إلا بعد شرحها."],
          ["A viewer can find the stated intent on the board without help.", "يستطيع المشاهد أن يجد الفكرة المعلنة على اللوحة دون مساعدة."],
          ["The intent is the first thing the board says; the views and diagrams were chosen to prove it.", "الفكرة أول ما تقوله اللوحة، والمناظر والمخططات اختيرت لإثباتها."]]),
        crit("craft", 15, "Craft and representation", "الإتقان والإظهار", [
          ["Rough edges, unclean joints or smudged lines distract from the composition.", "حواف خشنة أو وصلات غير نظيفة أو خطوط ملطّخة تشتّت الانتباه عن التكوين."],
          ["Mostly clean, but the line weights or the cuts are uneven.", "نظيف غالباً، لكن سماكات الخطوط أو القصّ غير متساوية."],
          ["Clean model or drawings with a clear line-weight hierarchy; the views are aligned and labelled.", "مجسّم أو رسومات نظيفة بتدرّج واضح في سماكات الخطوط، والمناظر متحاذية ومعنونة."],
          ["Precise, consistent craft throughout; the presentation itself reinforces the ordering idea.", "إتقان دقيق ومتّسق في كل شيء، والإظهار نفسه يعزّز فكرة النظام."]]),
      ],
    },
    bubble: {
      id: "bubble", v: 1, en: "Bubble diagram and zoning", ar: "المخطط الفقاعي والتنطيق",
      brief: L("For a small programme (for example a courtyard house or a small studio building), draw a bubble (adjacency) diagram, then translate it into a zoning diagram on the site that shows the entry, the orientation and the circulation.",
        "لبرنامج صغير (مثل بيت بفناء أو مبنى مرسم صغير) ارسم مخططاً فقاعياً (مخطط تجاورات)، ثم حوّله إلى مخطط تنطيق على الموقع يبيّن المدخل والتوجيه والحركة."),
      criteria: [
        crit("prog", 15, "Programme and relative size", "البرنامج والأحجام النسبية", [
          ["Spaces are missing, or all the bubbles are the same size.", "فضاءات ناقصة، أو الفقاعات كلها بحجم واحد."],
          ["All the main spaces appear, but the bubble sizes do not reflect their areas.", "تظهر الفضاءات الرئيسية كلها، لكن أحجام الفقاعات لا تعكس مساحاتها."],
          ["A complete programme; bubble sizes are roughly proportional to the area schedule.", "برنامج كامل، وأحجام الفقاعات متناسبة تقريباً مع جدول المساحات."],
