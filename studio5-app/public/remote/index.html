};

/* ---------- inbox & notifications ---------- */
S5.inboxItems = () => {
  const caps = S5.store.list("capture", (c) => !c.resolved);
  const orphanTasks = S5.store.list("task", (t) => t.status === "open" && !t.subjectId && !t.projectId && !t.personal);
  const orphanFiles = S5.store.list("file", (f) => !f.subjectId && !f.projectId && !f.library);
  return [...caps.map((r) => ({ r, why: "capture" })), ...orphanTasks.map((r) => ({ r, why: "task without subject" })), ...orphanFiles.map((r) => ({ r, why: "file not filed" }))];
};
S5.notifications = () => {
  const T = S5.todayISO(); const out = []; const safe = S5.settings.get("safeMode");
  const add = (p, text, act, data = {}) => out.push({ p, text, act, data });
  for (const t of S5.store.list("task", (t) => t.status !== "done" && t.status !== "dropped" && t.due)) {
    const n = S5.daysBetween(T, t.due);
    if (n < 0) add(t.priority === "critical" || t.priority === "high" ? 0 : 1, `Overdue: ${t.title}`, "edit", { type: "task", id: t.id });
    else if (n === 0) add(1, `Due today: ${t.title}`, "edit", { type: "task", id: t.id });
    else if (n <= 7 && !safe) add(2, `Due ${S5.relDay(t.due)}: ${t.title}`, "edit", { type: "task", id: t.id });
  }
  for (const p of S5.store.list("project", (p) => p.deadline && !["frozen", "evaluated"].includes(p.phase))) {
    const n = S5.daysBetween(T, p.deadline); const risk = S5.projectRisk(p);
    if (n <= 2 && n >= 0) add(0, `${p.name} is due ${S5.relDay(p.deadline)} — run the submission gate`, "open", { v: "project", id: p.id, tab: "gate" });
    else if (risk.level === "high") add(1, `${p.name}: ${risk.reason}`, "open", { v: "project", id: p.id });
  }
  for (const a of S5.store.list("assessment", (a) => a.date && a.score == null)) {
    const n = S5.daysBetween(T, a.date);
    if (n >= 0 && n <= 7) add(n <= 2 ? 0 : 1, `${a.kind} (${S5.store.get(a.subjectId)?.name || ""}) ${S5.relDay(a.date)}${a.confirmed ? "" : " — weight not confirmed"}`, "open", { v: "subject", id: a.subjectId, tab: "exams" });
    if (n < 0 && n > -14 && !safe) add(2, `Enter the result for ${a.kind} and run a quick debrief`, "edit", { type: "assessment", id: a.id });
  }
  const unclosed = S5.store.list("lecture", (l) => l.status !== "closed" && l.date && l.date <= T && S5.store.list("capture", (c) => c.lectureId === l.id && !c.resolved).length);
  if (unclosed.length) add(1, `${unclosed.length} lecture(s) waiting for closeout`, "open", { v: "lecture", id: unclosed[0].id, tab: "closeout" });
  for (const p of S5.store.list("problem", (p) => p.retryAt && p.retryAt <= T && p.status !== "solved" && p.status !== "timed")) add(2, `Retry problem: ${p.question.slice(0, 60)}`, "open", { v: "subject", id: p.subjectId, tab: "problems" });
  const gaps = S5.store.list("gap", (g) => (g.attempts || []).filter((a) => a.result === "still unclear").length >= 2 && g.stage < 1);
  for (const g of gaps) add(1, `Explanation failed twice: “${g.text.slice(0, 50)}” — change method or ask the professor`, "rescue", { id: g.id });
  const lb = S5.store.meta.lastBackupAt;
  if (!lb || S5.daysBetween(lb.slice(0, 10), T) > S5.settings.get("backupEveryDays")) add(1, lb ? `Last full backup was ${S5.relDay(lb.slice(0, 10))}` : "No full backup yet — export one", "go", { v: "system" });
  if (S5.health.level() === "bad") add(0, "System health needs attention", "go", { v: "system" });
  if (S5.sync.state === "error") add(3, "Cloud sync interrupted — your changes are safe on this device", "go", { v: "system" });
  return out.filter((n) => !safe || n.p <= 1).sort((a, b) => a.p - b.p);
};

/* ---------- project risk & time intelligence (used by Today and Projects) ---------- */
S5.projectRisk = (p) => {
  const T = S5.todayISO(); if (!p.deadline) return { level: "low", reason: "No deadline set", score: 0 };
  const days = S5.daysBetween(T, p.internalDeadline || p.deadline);
  const delivs = S5.store.where("deliverable", "projectId", p.id);
  const remainingMin = delivs.filter((d) => !["ready", "frozen"].includes(d.status)).reduce((a, d) => a + Math.max(0, (d.estMin || 120) - (d.actMin || 0)), 0) + S5.store.list("task", (t) => t.projectId === p.id && t.status !== "done" && t.status !== "dropped").reduce((a, t) => a + (t.estimateMin || 60), 0);
  const openFb = S5.store.list("feedback", (f) => f.projectId === p.id && ["open", "task"].includes(f.status)).length;
  const unclearFb = S5.store.list("feedback", (f) => f.projectId === p.id && !f.understood && f.status === "open").length;
  const perDay = S5.settings.get("energyMin") * 0.45; // share of a day realistically available for one project
  const capacity = Math.max(0, days) * perDay;
  const ratio = capacity ? remainingMin / capacity : remainingMin ? 9 : 0;
  let level = "low", reason = "On track";
  if (days < 0) { level = "high"; reason = "Past your internal deadline"; }
  else if (ratio > 1) { level = "high"; reason = `Needs ~${S5.fmtMin(remainingMin)}, about ${S5.fmtMin(capacity)} realistically available`; }
  else if (ratio > 0.7 || unclearFb) { level = "medium"; reason = unclearFb ? `${unclearFb} feedback item(s) not understood yet` : "Tight: most of the remaining time is already needed"; }
  return { level, reason, score: ratio + unclearFb * 0.3 + (days < 3 ? 0.5 : 0), remainingMin, capacity, openFb, days };
};
S5.estimateRange = (estMin, kind) => {
  // learn from history: actual/estimate ratio of finished tasks & deliverables
  const done = [...S5.store.list("task", (t) => t.status === "done" && t.estimateMin && t.actualMin), ...S5.store.list("deliverable", (d) => d.estMin && d.actMin && ["ready", "frozen"].includes(d.status))];
  const ratios = done.map((d) => (d.actualMin || d.actMin) / (d.estimateMin || d.estMin)).sort((a, b) => a - b);
  if (ratios.length < 3) return { lo: Math.round(estMin * 0.9), hi: Math.round(estMin * 1.6), conf: "low", why: "Little history yet — using a default buffer of +60%" };
  const q = (p) => ratios[Math.min(ratios.length - 1, Math.floor(p * ratios.length))];
  return { lo: Math.round(estMin * q(0.25)), hi: Math.round(estMin * q(0.8)), conf: ratios.length > 10 ? "medium" : "low", why: `Based on ${ratios.length} finished items: you usually take ${S5.round(q(0.5), 2)}× your estimate` };
};

/* ---------- unified search ---------- */
S5.SEARCH_FIELDS = ["title", "name", "ar", "text", "question", "verbatim", "interpretation", "summary", "body", "idea", "note", "reason", "attempt", "correct", "cause", "topics", "brief", "notes", "properties", "uses", "findings", "citation", "answerVerbatim", "author", "evidence", "quote", "goal", "kind"];
S5.search = async (q) => {
  q = (q || "").trim().toLowerCase(); if (q.length < 2) return [];
  const terms = q.split(/\s+/); const out = [];
  for (const r of S5.store.recs.values()) {
    if (r.deleted || ["link", "inkpage", "drillDef", "year", "semester"].includes(r.type)) continue;
    const hay = S5.SEARCH_FIELDS.map((f) => (typeof r[f] === "string" ? r[f] : "")).join("   ").toLowerCase();
    if (terms.every((t) => hay.includes(t))) { const i = hay.indexOf(terms[0]); out.push({ r, snip: hay.slice(Math.max(0, i - 50), i + 90) }); }
  }
  // inside PDFs (device-local text index)
  for (const f of S5.store.list("file", (f) => f.kind === "pdf")) {
    const pages = await S5.idb.get("meta", "pdftext_" + f.id); if (!pages) continue;
    pages.forEach((t, i) => { const l = t.toLowerCase(); if (terms.every((x) => l.includes(x))) { const j = l.indexOf(terms[0]); out.push({ r: f, page: i + 1, snip: t.slice(Math.max(0, j - 50), j + 90) }); } });
  }

};
S5.openRecord = (r, page) => {
  const go = (x) => S5.ui.go(x);
  switch (r.type) {
    case "subject": return go({ v: "subject", id: r.id });
    case "lecture": return go({ v: "lecture", id: r.id });
    case "project": return go({ v: "project", id: r.id });
    case "file": return go({ v: "file", id: r.id, page });
    case "notebook": return go({ v: "notebook", id: r.id });
    case "research": return go({ v: "research", id: r.id });
    case "gap": return S5.rescue(r.id);
    case "capture": return go({ v: "inbox" });
    default:
      if (r.projectId && ["requirement", "assumption", "reference", "siteRecord", "space", "relation", "alternative", "decision", "feedback", "version", "deliverable", "evaluation"].includes(r.type)) return go({ v: "project", id: r.projectId, tab: { requirement: "brief", assumption: "brief", reference: "references", siteRecord: "site", space: "program", relation: "program", alternative: "alternatives", decision: "alternatives", feedback: "feedback", version: "versions", deliverable: "deliverables", evaluation: "evaluation" }[r.type] });

S5.typeLabel = (t) => (S5.SCHEMA[t]?.label) || { capture: "Capture", inkpage: "Ink page", drill: "Drawing attempt", link: "Relation" }[t] || t;

S5.TOOL_DEFS = {

S5.renderTool = (key, saved) => {

  const inputs = def.inputs.map(([k, label, , kind]) => kind === "textarea" ? `<label class="field wide"><span>${label}</span><textarea data-tool-in="${k}" rows="6" dir="auto" style="font-family:var(--f-mono);font-size:.82rem">${S5.esc(vals[k])}</textarea></label>` : `<label class="field"><span>${label}</span><input data-tool-in="${k}" ${kind === "date" ? 'type="date"' : ""} value="${S5.esc(vals[k])}" dir="auto"></label>`).join("");
  let out = ""; try { out = def.run(vals); } catch (e) { out = warn("Check the inputs: " + S5.esc(e.message)); }
  return `<div class="form-grid" data-tool="${key}" dir="ltr">${inputs}</div><div class="tool-out" style="margin-top:14px">${out}</div><p class="tiny muted" style="margin-top:8px">Learning tool. Results support understanding and checking homework; they are not approval for design or construction.</p>`;
};
S5.bindTool = (root, key) => {
  const grid = root.querySelector(`[data-tool="${key}"]`); if (!grid) return;
  const read = () => Object.fromEntries([...grid.querySelectorAll("[data-tool-in]")].map((e) => [e.dataset.toolIn, e.value]));
  const upd = S5.debounce(() => { let out; try { out = S5.TOOL_DEFS[key].run(read()); } catch (e) { out = warn("Check the inputs: " + S5.esc(e.message)); } root.querySelector(".tool-out").innerHTML = out; }, 250);
  grid.addEventListener("input", upd);

};

S5.minsBetween = (a, b) => { const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number); return h2 * 60 + m2 - (h1 * 60 + m1); };

/* ---------- focus screen ---------- */
S5.views.focus = (r) => {
  const s = S5.store.get(r.id); if (!s) return H.empty("Session not found", "");
  S5.setPlace(`Focus: ${s.reason || "session"}`, r);
  const run = S5.focusRun && S5.focusRun.id === s.id ? S5.focusRun : null;
  S5.ui.mount(() => {
    const clock = document.getElementById("focus-clock"); let wake = null;
    try { navigator.wakeLock?.request("screen").then((w) => (wake = w)).catch(() => {}); } catch {}
    const tick = () => { const f = S5.focusRun; const el = f && f.id === s.id ? f.acc + (f.running ? Date.now() - f.t0 : 0) : (s.actualMin || 0) * 60000; const m = Math.floor(el / 60000), sec = Math.floor((el % 60000) / 1000); if (clock) clock.textContent = `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`; const bar = document.getElementById("focus-bar"); if (bar) bar.style.width = Math.min(100, (el / 60000 / (s.plannedMin || 45)) * 100) + "%"; };
    tick(); const iv = setInterval(tick, 500);
    return () => { clearInterval(iv); try { wake && wake.release(); } catch {} };
  });
  return `<div class="crumbs"><button data-act="back">← Back</button></div>
  <div class="focus-screen">
    <span class="eyebrow">${H.subj(s.subjectId) || "Study session"} · planned ${S5.fmtMin(s.plannedMin)}</span>
    <h2 dir="auto" style="max-width:40ch">${S5.esc(s.reason || "")}</h2>
    <div class="clock" id="focus-clock">00:00</div>
    <div style="width:min(420px,90%)"><div class="meter"><i id="focus-bar" style="width:0"></i></div></div>
    <div class="row" style="justify-content:center">${run && run.running ? H.btn("Pause", "focus-pause", { id: s.id }) : H.btn(run ? "Resume" : "Start", "focus-start", { id: s.id }, "primary")}${H.btn("Finish session", "focus-finish", { id: s.id })}</div>
    <dl class="kv" style="text-align:start;max-width:520px"><dt>Output</dt><dd dir="auto">${S5.esc(s.output || "—")}</dd><dt>Done when</dt><dd dir="auto">${S5.esc(s.criterion || "—")}</dd></dl>
    <p class="tiny muted">Non-critical alerts are hidden while you focus. The screen stays awake when your device allows it.</p>
  </div>`;
};
S5.act["focus-start"] = (el) => { const f = S5.focusRun && S5.focusRun.id === el.dataset.id ? S5.focusRun : { id: el.dataset.id, acc: 0 }; f.t0 = Date.now(); f.running = true; S5.focusRun = f; S5.ui.render(); };
S5.act["focus-pause"] = () => { const f = S5.focusRun; if (f) { f.acc += Date.now() - f.t0; f.running = false; } S5.ui.render(); };
S5.act["focus-finish"] = (el) => {
  const s = S5.store.get(el.dataset.id); const f = S5.focusRun && S5.focusRun.id === s.id ? S5.focusRun : null;
  const ms = f ? f.acc + (f.running ? Date.now() - f.t0 : 0) : 0; const mins = Math.max(1, Math.round(ms / 60000));
  const m = S5.ui.modal("Finish session", `<div class="form-grid"><label class="field"><span>Actual minutes</span><input id="fin-min" type="number" value="${mins}"></label><label class="field"><span>Criterion met?</span><select id="fin-met"><option value="yes">Yes — ${S5.esc(s.criterion || "done")}</option><option value="no">No</option></select></label><label class="field wide"><span>What got in the way (blocker)</span><input id="fin-block" dir="auto" placeholder="Optional — helps future estimates"></label></div>`, { footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="fin-ok">Save</button>` });

S5.act["new-session"] = (el) => S5.ui.edit("session", { date: S5.todayISO(), plannedMin: 45, subjectId: el.dataset.subject || "" });
S5.act.focus = (el) => S5.ui.go({ v: "focus", id: el.dataset.id });
S5.act["task-done"] = async (el, e) => { e.stopPropagation(); const t = S5.store.get(el.dataset.id); const m = S5.ui.modal("Mark done", `<label class="field"><span>Actual time (min) — improves future estimates</span><input id="td-min" type="number" value="${t.estimateMin || ""}"></label>`, { footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="td-ok">Done</button>` }); m.el.querySelector("#td-ok").onclick = async () => { await S5.store.update(t.id, { status: "done", doneAt: S5.now(), actualMin: +m.el.querySelector("#td-min").value || null }); m.close(); S5.ui.toast("Done ✓"); }; };

S5.act["day-review"] = () => {

  const sess = S5.store.list("session", (s) => s.date === T); const plan = sess.reduce((a, s) => a + (s.plannedMin || 0), 0), act = sess.filter((s) => s.done).reduce((a, s) => a + (s.actualMin || 0), 0);
  const left = S5.store.list("task", (t) => t.status === "open" && t.due && t.due <= T);

    ${left.length ? `<div><h4>Still open (due today or earlier)</h4><div class="list">${left.map((t) => H.item({ lead: "amber", t: S5.esc(t.title), right: H.btn("Move to tomorrow", "task-tomorrow", { id: t.id }, "sm") })).join("")}</div></div>` : ""}
    <label class="field"><span>What worked / what got in the way</span><textarea id="dr-note" dir="auto">${S5.esc(prev?.note || "")}</textarea></label>
    <label class="field"><span>First step tomorrow</span><input id="dr-first" dir="auto" value="${S5.esc(prev?.firstStep || "")}"></label>`, { footer: `<button class="btn" data-close>Close</button><button class="btn primary" id="dr-save">Save review</button>` });
  m.el.querySelector("#dr-save").onclick = async () => { const data = { date: T, note: m.el.querySelector("#dr-note").value, firstStep: m.el.querySelector("#dr-first").value, planned: plan, actual: act, tasksDone: doneT.length }; prev ? await S5.store.update(prev.id, data) : await S5.store.create("dayReview", data); if (data.firstStep) await S5.store.create("task", { title: data.firstStep, due: S5.addDays(T, 1), priority: "high", status: "open", origin: "dayReview", personal: true }); m.close(); S5.ui.toast("Review saved"); };

/* ---------- grade state ---------- */
S5.gradeState = (subjectId, target) => {
  const as = S5.store.list("assessment", (a) => a.subjectId === subjectId);
  let graded = 0, earned = 0, remaining = 0, unconfirmed = 0, remMin = 0, remMax = 0;
  for (const a of as) {
    const w = S5.num(a.weight, (S5.num(a.weightMin) + S5.num(a.weightMax)) / 2);
    if (!a.confirmed) unconfirmed += w;
    if (a.score != null && a.maxScore) { graded += w; earned += (w * a.score) / a.maxScore; }
    else { remaining += w; remMin += a.confirmed ? w : S5.num(a.weightMin, w); remMax += a.confirmed ? w : S5.num(a.weightMax, w); }
  }
  const pct = graded ? (earned / graded) * 100 : 0;
  const needed = target != null && remaining ? ((target - earned) / remaining) * 100 : null;
  return { as, graded, earned, remaining, unconfirmed, pct, needed, remMin, remMax, total: graded + remaining };
};

    ${H.section("Exam scope & mastery", topics.length ? `<div class="list">${topics.map((t) => H.item({ lead: t.scope === "in" ? "cobalt" : t.scope === "out" ? "" : "amber", t: S5.esc(t.name) + H.demo(t), s: `${{ in: "in scope", out: "excluded", maybe: "probably", confirm: "needs confirmation" }[t.scope] || ""} · ${S5.MASTERY[t.mastery || 0]}`, right: H.ladder(t.mastery || 0, 6), act: "edit", data: { type: "topic", id: t.id } })).join("")}</div>

    ${H.section("Exam plan", (() => { const ex = g.as.filter((a) => a.date && a.date >= T && a.score == null).sort((a, b) => a.date.localeCompare(b.date))[0]; if (!ex) return H.empty("No upcoming assessment.", ""); const days = S5.daysBetween(T, ex.date); const weak = topics.filter((t) => t.scope !== "out" && (t.mastery || 0) < 5); const need = weak.reduce((a, t) => a + (5 - (t.mastery || 0)) * 40, 0); return `<p><b>${S5.esc(ex.kind)}</b> ${S5.relDay(ex.date)} · ${weak.length} topic(s) below “solve under time”.</p><p class="small muted">Rough need: ${S5.fmtMin(need * 0.8)}–${S5.fmtMin(need * 1.4)} of practice (≈40 min per mastery step per topic; refined as you log sessions). That is about ${S5.fmtMin((need / Math.max(1, days - 1)))} per day, keeping the last day light.</p><div class="row" style="margin-top:8px">${H.btn("Create reverse plan", "exam-plan", { subject: s.id, id: ex.id }, "sm primary")}${H.btn("Exam day sheet", "exam-day", { id: ex.id }, "sm")}</div>`; })())}
    ${H.section("Mock exams", `${mocks.length ? `<div class="list">${mocks.map((m) => H.item({ lead: m.finished ? "green" : "cobalt", t: S5.esc(m.title), s: `${(m.questions || []).length} questions · ${m.minutes} min${m.finished ? ` · score ${m.score ?? "—"} · confidence gap ${m.calib ?? "—"}` : ""}`, act: "open", data: { v: "mock", id: m.id } })).join("")}</div>` : H.empty("No mock exams yet.", "Timed, no hints, then compare confidence with results.")}`, H.btn("+ Mock exam", "new-mock", { subject: s.id }, "sm"))}

S5.targetText = (g, target) => { if (!g.remaining) return g.graded ? `All graded: final ≈ ${S5.round(g.pct, 1)}%.` : ""; const need = ((target - g.earned) / g.remaining) * 100; if (need > 100) return `<span style="color:var(--redline)">${target}% is no longer reachable; best possible ≈ ${S5.round(g.earned + g.remaining, 1)}%.</span>`; if (need <= 0) return `<span style="color:var(--green)">Target already secured.</span>`; return `To reach ${target}%, average <b>${S5.round(need, 1)}%</b> on the remaining ${g.remaining}%${g.unconfirmed ? ` (range ${S5.round(((target - g.earned) / Math.max(1, g.remMax)) * 100, 0)}–${S5.round(((target - g.earned) / Math.max(1, g.remMin)) * 100, 0)}% while weights are unconfirmed)` : ""}.`; };

S5.act["exam-plan"] = async (el) => {

  const weak = S5.store.list("topic", (t) => t.subjectId === s.id && t.scope !== "out" && (t.mastery || 0) < 5).sort((a, b) => (a.mastery || 0) - (b.mastery || 0));

  const slots = []; let d = 0; const cap = S5.settings.get("dailySessionCap");

  const m = S5.ui.modal("Reverse exam plan", `<p class="small">Creates ${slots.length} sessions over ${Math.max(1, days - 1)} day(s), at most ${Math.min(per, cap)} per day, weakest topics first. The day before the exam stays light (review only).</p>`, { footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="ep-ok">Create sessions</button>` });

S5.views.mock = (r) => {
  const mk = S5.store.get(r.id); if (!mk) return H.empty("Not found", "");
  const run = S5.mockRun && S5.mockRun.id === mk.id ? S5.mockRun : null;
  if (!mk.started) return `<div class="crumbs"><button data-act="back">← Back</button></div><div class="focus-screen"><span class="eyebrow">${H.subj(mk.subjectId)} · ${mk.minutes} minutes · ${mk.questions.length} questions</span><h1>${S5.esc(mk.title)}</h1><p class="muted" style="max-width:50ch">Exam conditions: no hints, no alerts. For each question, write your answer on paper or in a notebook, then mark your confidence. The answers are revealed only at the end.</p>${H.btn("Start the clock", "mock-start", { id: mk.id }, "primary")}</div>`;
  if (!mk.finished) {
    const q = run ? run.i : 0; const it = mk.questions[q];
    S5.ui.mount(() => { const iv = setInterval(() => { const el = document.getElementById("mk-clock"); if (!el) return; const left = mk.minutes * 60000 - (Date.now() - new Date(mk.started).getTime()); el.textContent = left < 0 ? "Time's up" : `${Math.floor(left / 60000)}:${String(Math.floor((left % 60000) / 1000)).padStart(2, "0")}`; if (left < 0) el.style.color = "var(--redline)"; }, 500); return () => clearInterval(iv); });
    return `<div class="row between"><span class="eyebrow">Question ${q + 1} of ${mk.questions.length}</span><span class="clock" id="mk-clock" style="font-size:2rem"></span></div>
      <section class="sheet" style="margin:14px 0"><p dir="auto" style="font-size:1.15rem">${S5.esc(it.q)}</p></section>
      <label class="field"><span>Your answer (or "on paper")</span><textarea id="mk-ans" dir="auto" rows="5">${S5.esc(mk.answers?.[q]?.a || "")}</textarea></label>
      <div class="row" style="margin-top:10px"><span class="small">Confidence:</span><div class="seg">${[1, 2, 3, 4, 5].map((c) => `<button data-act="mock-conf" data-v="${c}" aria-pressed="${mk.answers?.[q]?.c === c}">${c}</button>`).join("")}</div><span class="grow"></span>${q > 0 ? H.btn("Previous", "mock-nav", { d: -1 }) : ""}${q < mk.questions.length - 1 ? H.btn("Next", "mock-nav", { d: 1 }, "primary") : H.btn("Finish exam", "mock-finish", {}, "primary")}</div>`;
  }
  const rows = mk.questions.map((x, i) => ({ ...x, ...(mk.answers?.[i] || {}) }));
  return `<div class="crumbs"><button data-act="back">← Back</button></div><div class="page-head"><div class="titles"><span class="eyebrow">Mock exam · analysis</span><h1>${S5.esc(mk.title)}</h1></div></div>
    <p class="small muted">Mark each answer right, partly or wrong. Studio5 compares your confidence with the result to show where self-assessment is off.</p>
    <div class="list">${rows.map((x, i) => `<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div style="min-width:0"><div class="t" dir="auto">${i + 1}. ${S5.esc(x.q)}</div><div class="s">Your answer: ${S5.esc(x.a || "—")} · confidence ${x.c || "—"} · ${x.ms ? S5.fmtMin(x.ms / 60000) : "—"}</div>${x.answer ? `<details class="disclose"><summary>Model answer</summary><p class="small" dir="auto">${S5.esc(x.answer)}</p></details>` : ""}</div><div class="seg">${[["right", "✓"], ["partly", "½"], ["wrong", "✗"]].map(([k, n]) => `<button data-act="mock-mark" data-i="${i}" data-v="${k}" aria-pressed="${x.mark === k}">${n}</button>`).join("")}</div></div>`).join("")}</div>
    <section class="sheet" style="margin-top:14px">${(() => { const marked = rows.filter((x) => x.mark); if (!marked.length) return "<p class='small'>Mark answers to see the analysis.</p>"; const sc = marked.reduce((a, x) => a + (x.mark === "right" ? 1 : x.mark === "partly" ? 0.5 : 0), 0) / marked.length; const conf = marked.reduce((a, x) => a + (x.c || 3), 0) / marked.length / 5; const over = marked.filter((x) => (x.c || 0) >= 4 && x.mark === "wrong"); return `<div class="grid cols-3"><div class="stat"><span class="v">${Math.round(sc * 100)}%</span><span class="l">score</span></div><div class="stat"><span class="v">${Math.round(conf * 100)}%</span><span class="l">average confidence</span></div><div class="stat"><span class="v">${over.length}</span><span class="l">confident but wrong</span></div></div>${over.length ? `<p class="small" style="margin-top:8px;color:var(--redline)">Confident-but-wrong answers are the most dangerous: add each to the error notebook.</p>${H.btn("Add them to the error notebook", "mock-errors", { id: mk.id }, "sm")}` : ""}`; })()}</section>`;
};

  const caps = S5.store.list("capture", (c) => c.lectureId === lec.id).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
  const files = S5.store.list("file", (f) => f.subjectId === lec.subjectId && f.kind === "pdf");
  let nb = lec.notebookId && S5.store.get(lec.notebookId);
  const capList = caps.length ? `<div class="list">${caps.map((c) => H.item({ lead: c.kind === "gap" ? "red" : c.kind === "verbatim" ? "red" : c.kind === "deadline" ? "amber" : c.resolved ? "green" : "cobalt", t: c.kind === "verbatim" ? `<span class="verbatim">${S5.esc(c.text)}</span>` : S5.esc(c.text), s: `${S5.CAPTURE_KINDS.find((k) => k[0] === c.kind)?.[1] || c.kind}${c.page ? " · p." + c.page : ""}${c.resolved ? " · → " + (c.resolvedAs || "task") : ""} · ${new Date(c.createdAt).toTimeString().slice(0, 5)}` })).join("")}</div>` : H.empty("Nothing captured yet.", "Use the quick bar below: one tap per kind, type, Enter.");
  let body;
  if (tab === "capture") {
    const pdf = lec.fileId && S5.store.get(lec.fileId);
    S5.ui.mount(() => {
      const cleanups = [];
      const pdfHost = document.getElementById("lec-pdf");
      if (pdf && pdfHost) { const v = new S5.PdfView(pdfHost, pdf, { startPage: lec.lastPage || 1, onPage: (p) => { S5.lecPage = p; }, onCapture: (p) => S5.openCapture({ lectureId: lec.id, subjectId: lec.subjectId, page: p, fileId: pdf.id, kind: "note" }) }); cleanups.push(() => { v.destroy(); if (S5.lecPage) S5.store.update(lec.id, { lastPage: S5.lecPage }); }); }
      const nbHost = document.getElementById("lec-nb");
      if (nbHost && nb) { const page = S5.notebookPage(nb, nb.cur || 0); const ink = new S5.Ink(nbHost, { doc: page }); cleanups.push(() => ink.destroy()); }
      const qb = document.getElementById("qcap");
      if (qb) qb.addEventListener("keydown", async (e) => { if (e.key === "Enter" && !e.shiftKey && qb.value.trim()) { e.preventDefault(); const kind = document.querySelector("[data-qkind][aria-pressed=true]")?.dataset.qkind || "note"; await S5.store.create("capture", { kind, text: qb.value.trim(), subjectId: lec.subjectId, lectureId: lec.id, page: S5.lecPage || null, fileId: lec.fileId || "", resolved: false }); qb.value = ""; S5.ui.toast("Captured"); const l = document.getElementById("cap-list"); const fresh = S5.store.list("capture", (c) => c.lectureId === lec.id); if (l) l.innerHTML = `<div class="list">${fresh.slice(-6).reverse().map((c) => H.item({ lead: c.kind === "gap" || c.kind === "verbatim" ? "red" : "cobalt", t: S5.esc(c.text), s: c.kind + (c.page ? " · p." + c.page : "") })).join("")}</div>`; } });
      return () => cleanups.forEach((f) => f());
    });
    body = `<div class="workspace lec ${pdf || nb ? "" : "one"}">
      <div class="pane"><div class="row between"><span class="eyebrow">Lecture PDF</span><div class="row">${files.length ? `<select data-act-change="lec-pdf" data-id="${lec.id}" style="max-width:220px"><option value="">— choose —</option>${files.map((f) => `<option value="${f.id}" ${f.id === lec.fileId ? "selected" : ""}>${S5.esc(f.name)}</option>`).join("")}</select>` : ""}${H.btn("Add PDF", "upload", { subject: lec.subjectId, lecture: lec.id }, "sm")}</div></div><div id="lec-pdf" style="min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)">${pdf ? "" : H.empty("No PDF attached.", "Attach the lecture slides to capture against pages.")}</div></div>
      <div class="pane"><div class="row between"><span class="eyebrow">Notebook</span>${nb ? H.btn("Open full notebook", "open", { v: "notebook", id: nb.id }, "sm ghost") : H.btn("Start a notebook page", "lec-notebook", { id: lec.id }, "sm")}</div><div id="lec-nb" class="ink-wrap" style="${nb ? "" : "display:none"}"></div>${nb ? "" : `<div class="sheet flat">${capList}</div>`}</div>
    </div>
    <section class="sheet" style="margin-top:10px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5">
      <div class="row" style="margin-bottom:8px"><div class="seg">${S5.CAPTURE_KINDS.filter((k) => k[0] !== "photo").map(([k, n], i) => `<button data-act="qkind" data-qkind="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>${H.btn("Photo", "capture", { subject: lec.subjectId, kind: "photo" }, "sm")}</div>
      <input id="qcap" dir="auto" placeholder="Type and press Enter — the current PDF page is attached" style="width:100%;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper)">
      <div id="cap-list" style="margin-top:6px;max-height:120px;overflow:auto">${caps.length ? `<div class="list">${caps.slice(-6).reverse().map((c) => H.item({ lead: c.kind === "gap" || c.kind === "verbatim" ? "red" : "cobalt", t: S5.esc(c.text), s: c.kind + (c.page ? " · p." + c.page : "") })).join("")}</div>` : ""}</div>
    </section>`;
  } else {
    const open = caps.filter((c) => !c.resolved);
    body = `<div class="split"><div class="stack">${H.section(`Captures to process <span class="muted small">${open.length} left</span>`, open.length ? `<div class="list">${open.map((c) => `<div class="item" style="grid-template-columns:minmax(0,1fr)"><div><div class="t" dir="auto">${c.kind === "verbatim" ? `<span class="verbatim">${S5.esc(c.text)}</span>` : S5.esc(c.text)}</div><div class="s">${S5.CAPTURE_KINDS.find((k) => k[0] === c.kind)?.[1] || c.kind}${c.page ? " · p." + c.page : ""}</div><div class="row" style="margin-top:6px">${[["task", "→ Task"], ["gap", "→ Rescue gap"], ["question", "→ Ask professor"], ["memory", "→ Remember"], ["note", "→ Note"], ["keep", "Keep as is"]].map(([k, n]) => `<button class="btn sm ${(c.kind === "gap" && k === "gap") || (c.kind === "question" && k === "question") || (c.kind === "deadline" && k === "task") ? "primary" : ""}" data-act="resolve" data-id="${c.id}" data-v="${k}">${n}</button>`).join("")}</div></div></div>`).join("")}</div>` : H.empty("All captures processed.", "Write the summary and close the lecture."))}</div>
      <div class="stack">${H.section("Closeout", `<label class="field"><span>Lecture title / topic</span><input id="co-title" dir="auto" value="${S5.esc(lec.title || "")}"></label>
        <label class="field" style="margin-top:8px"><span>Short summary (3–5 lines)</span><textarea id="co-sum" dir="auto" rows="5">${S5.esc(lec.summary || "")}</textarea></label>
        <label class="field" style="margin-top:8px"><span>How well did you understand it?</span><select id="co-und">${["Clear", "Mostly clear", "Partly", "Lost"].map((x) => `<option ${lec.understanding === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
        <div id="co-ai"></div>
        <div class="row" style="margin-top:10px">${S5.ai.on() ? H.btn("Draft summary with AI", "co-ai", { id: lec.id }, "sm") : ""}<span class="grow"></span>${H.btn(lec.status === "closed" ? "Save" : "Close lecture", "co-close", { id: lec.id }, "primary")}</div>
        <p class="tiny muted" style="margin-top:8px">Aim for 5–10 minutes right after the lecture. The summary is your own; an AI draft is marked and only uses your captures.</p>`)}</div></div>`;
  }
  return `<div class="crumbs"><button data-act="open" data-v="study">Study</button> / <button data-act="open" data-v="subject" data-id="${s?.id}">${S5.esc(s?.name || "")}</button></div>
    <div class="page-head"><div class="titles"><span class="eyebrow">${S5.fmtDate(lec.date)} · ${caps.length} captures</span><h2 dir="auto">${S5.esc(lec.title || "Lecture")}</h2></div>${H.tabs([["capture", "Capture"], ["closeout", "Closeout", caps.filter((c) => !c.resolved).length]], tab, "open", { v: "lecture", id: lec.id })}</div>${body}`;
};
S5.act.qkind = (el) => { el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === el)); document.getElementById("qcap")?.focus(); };
S5.act.resolve = async (el) => { const c = S5.store.get(el.dataset.id); if (el.dataset.v === "keep") await S5.store.update(c.id, { resolved: true, resolvedAs: "kept" }); else { const rec = await S5.resolveCapture(c, el.dataset.v); if (el.dataset.v === "gap") S5.ui.toast("Added to Understanding gaps"); if (el.dataset.v === "task") S5.ui.edit("task", rec); } };
S5.act["co-ai"] = async (el) => { const lec = S5.store.get(el.dataset.id); const caps = S5.store.list("capture", (c) => c.lectureId === lec.id); if (!caps.length) return S5.ui.toast("No captures to summarise"); el.disabled = true; el.textContent = "Drafting…"; try { const d = await S5.ai.closeoutDraft(lec, caps); document.getElementById("co-ai").innerHTML = `<div class="ai-out" style="margin-top:8px">${H.ai()}<p dir="auto">${S5.esc(d.summary)}</p>${(d.open || []).length ? `<p class="small"><b>Open:</b> ${d.open.map(S5.esc).join(" · ")}</p>` : ""}<button class="btn sm" data-act="co-use">Use as starting point</button></div>`; S5.coDraft = d.summary; } catch (e) { S5.ui.toast(e.message, true); } el.disabled = false; el.textContent = "Draft summary with AI"; };
S5.act["co-use"] = () => { const t = document.getElementById("co-sum"); if (t) t.value = S5.coDraft || ""; };
S5.act["co-close"] = async (el) => { await S5.store.update(el.dataset.id, { title: document.getElementById("co-title").value, summary: document.getElementById("co-sum").value, understanding: document.getElementById("co-und").value, status: "closed", closedAt: S5.now() }); const u = document.getElementById("co-und").value; S5.ui.toast("Lecture closed"); if (u === "Partly" || u === "Lost") S5.ui.toast("Tip: add a gap for what was unclear — it's easier to rescue today."); };
S5.act["lec-notebook"] = async (el) => { const lec = S5.store.get(el.dataset.id); const nb = await S5.store.create("notebook", { title: `${S5.store.get(lec.subjectId)?.name || "Lecture"} · ${S5.fmtDate(lec.date)}`, subjectId: lec.subjectId, lectureId: lec.id, template: "ruled", pages: [] }); await S5.store.update(lec.id, { notebookId: nb.id }); await S5.link(lec.id, "CONTAINS", nb.id); S5.ui.render(); };

/* ---------- Understanding Rescue ---------- */
S5.act["new-gap"] = (el) => S5.ui.edit("gap", { subjectId: el.dataset.subject || (S5.ui.route.v === "subject" ? S5.ui.route.id : ""), stage: 0, attempts: [], gapType: "concept" });
S5.act.rescue = (el) => S5.rescue(el.dataset.id);
S5.rescue = (id) => {
  const g = S5.store.get(id); if (!g) return;
  const fails = (g.attempts || []).filter((a) => a.result === "still unclear").length;
  const used = new Set((g.attempts || []).map((a) => a.method));
  const methods = Object.keys(S5.ai.METHODS).map((k) => `<button class="btn sm ${used.has(k) ? "" : ""}" data-m="${k}" ${used.has(k) && fails >= 2 ? "disabled" : ""}>${{ simple: "Simple", visual: "Visual", practical: "Practical", technical: "Technical", architectural: "Architectural", fromStart: "From the start" }[k]}${used.has(k) ? " ✓" : ""}</button>`).join("");
  const m = S5.ui.modal("Understanding rescue", `
    <div><span class="eyebrow">${H.subj(g.subjectId)} · ${S5.esc({ term: "Unclear term", concept: "Core concept", step: "Missing step", formula: "Formula / drawing", tooFast: "Too fast", prereq: "Missing prerequisite", relation: "Relation between ideas" }[g.gapType] || "Diagnose first")}</span><h3 dir="auto" style="margin-top:4px">${S5.esc(g.text)}</h3>${g.context ? `<p class="small muted" dir="auto">${S5.esc(g.context)}${g.page ? " · p." + g.page : ""}</p>` : ""}</div>
    <div><div class="row between"><span class="small">${S5.LADDER[g.stage || 0]}</span><span class="tiny muted">${S5.LADDER.length - 1 - (g.stage || 0)} steps to “can explain it”</span></div>${H.ladder(g.stage || 0, 5)}</div>
    ${fails >= 2 ? `<div class="sheet alert flat"><p class="small"><b>The explanation failed ${fails} times.</b> Don't repeat it: try a method you haven't used, split the idea, go back to the prerequisite, open the exact source page, or ask the professor.</p><div class="row" style="margin-top:8px"><button class="btn sm" id="rq-prof">Prepare a question for the professor</button></div></div>` : ""}
    <div><h4 style="margin-bottom:6px">Explain it a different way</h4><div class="row">${methods}</div>${S5.ai.on() ? "" : `<p class="tiny muted" style="margin-top:6px">AI is not available here. Use the method as a self-study prompt: write the explanation yourself in that style, then answer a check question.</p>`}</div>
    <div id="rq-out"></div>
    <div><h4 style="margin-bottom:6px">After this attempt</h4><div class="row"><select id="rq-res"><option value="still unclear">Still unclear</option><option value="understood">Understood the explanation</option><option value="applied with help">Applied with help</option><option value="applied alone">Applied alone</option><option value="applied under time">Applied under time</option><option value="can explain">Can explain it</option></select><input id="rq-note" dir="auto" placeholder="In my own words…" style="flex:1;min-width:160px;padding:8px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--paper)"><button class="btn primary" id="rq-save">Record</button></div></div>
    ${(g.attempts || []).length ? `<details class="disclose"><summary>History (${g.attempts.length})</summary><div class="list">${g.attempts.map((a) => H.item({ t: `${S5.esc(a.method)} → ${S5.esc(a.result)}`, s: `${S5.fmtDateTime(a.at)}${a.note ? " · " + S5.esc(a.note) : ""}` })).join("")}</div></details>` : ""}`, { wide: true, footer: `<button class="btn" data-act="edit" data-type="gap" data-id="${g.id}">Edit gap</button><button class="btn" data-close>Close</button>` });
  let method = null, checkQ = "";
  m.el.querySelectorAll("[data-m]").forEach((b) => (b.onclick = async () => {
    method = b.dataset.m; const out = m.el.querySelector("#rq-out");
    if (!S5.ai.on()) { out.innerHTML = `<div class="ai-out"><b>Self-explanation (${S5.esc(method)}):</b> ${S5.esc(S5.ai.METHODS[method])}<br><br>Write it in the box below in your own words, then rate yourself honestly.</div>`; return; }
    out.innerHTML = `<div class="ai-out">${H.ai()}<p dir="auto" id="rq-stream">Thinking…</p></div>`;
    try { const text = await S5.ai.explainGap(g, method, ({ text }) => { const p = m.el.querySelector("#rq-stream"); if (p) p.textContent = text; }); m.el.querySelector("#rq-stream").textContent = text; checkQ = (text.split("\n").filter((l) => l.includes("?") || l.includes("؟")).pop() || "").trim(); if (checkQ) out.insertAdjacentHTML("beforeend", `<div class="row" style="margin-top:8px"><input id="rq-ans" dir="auto" placeholder="Answer the check question alone" style="flex:1;min-width:160px;padding:8px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--paper)"><button class="btn sm" id="rq-check">Check my answer</button></div><div id="rq-verdict"></div>`); const ck = m.el.querySelector("#rq-check"); if (ck) ck.onclick = async () => { ck.disabled = true; try { const v = await S5.ai.checkAnswer(g, checkQ, m.el.querySelector("#rq-ans").value); m.el.querySelector("#rq-verdict").innerHTML = `<p class="small" style="margin-top:6px;color:${v.verdict === "correct" ? "var(--green)" : v.verdict === "partly" ? "var(--amber)" : "var(--redline)"}"><b>${S5.esc(v.verdict)}</b> — ${S5.esc(v.why)} <br>Next: ${S5.esc(v.nextStep)}</p>`; m.el.querySelector("#rq-res").value = v.verdict === "correct" ? "applied alone" : v.verdict === "partly" ? "understood" : "still unclear"; } catch (e) { S5.ui.toast(e.message, true); } ck.disabled = false; }; }
    catch (e) { out.innerHTML = `<p class="small" style="color:var(--redline)">${S5.esc(e.message)}</p>`; }
  }));
  m.el.querySelector("#rq-save").onclick = async () => {
    const res = m.el.querySelector("#rq-res").value; const stage = { "still unclear": g.stage || 0, understood: 1, "applied with help": 2, "applied alone": 3, "applied under time": 4, "can explain": 5 }[res];
    const attempts = [...(g.attempts || []), { at: S5.now(), method: method || "self", result: res, note: m.el.querySelector("#rq-note").value }];
    await S5.store.update(g.id, { attempts, stage: Math.max(g.stage || 0, stage) }); m.close(); S5.ui.toast(res === "still unclear" ? "Recorded — try a different method next" : "Progress recorded");
    if (stage >= 3) { const sk = S5.store.list("skill", (k) => k.active)[0]; if (sk) { /* evidence is attached manually from Skills */ } }
  };
  const rp = m.el.querySelector("#rq-prof"); if (rp) rp.onclick = async () => { let text = `About “${g.text}”: I understood up to … but not …`; if (S5.ai.on()) { rp.disabled = true; rp.textContent = "Drafting…"; try { text = await S5.ai.professorQuestion(g); } catch {} } const q = await S5.store.create("question", { subjectId: g.subjectId, text, status: "draft", gapId: g.id }); await S5.link(q.id, "SEEKS_CLARIFICATION_FROM", g.id); m.close(); S5.openQuestion(q.id); };
};
/* professor question cycle */
S5.act.question = (el) => S5.openQuestion(el.dataset.id);
S5.openQuestion = (id) => {
  const q = S5.store.get(id); const stages = ["draft", "asked", "answered", "applied", "verified"]; const i = stages.indexOf(q.status || "draft");
  const m = S5.ui.modal("Question for the professor", `<div class="row">${stages.map((s, k) => H.pill(["Drafted", "Asked", "Answered", "Applied", "Verified"][k], k <= i ? "cobalt" : "")).join(" → ")}</div>
    <label class="field"><span>Precise question</span><textarea id="pq-t" dir="auto">${S5.esc(q.text)}</textarea></label>
    <label class="field"><span>Professor's exact words</span><textarea id="pq-v" dir="auto" placeholder="Write it verbatim, quotes and all">${S5.esc(q.answerVerbatim || "")}</textarea></label>
    <label class="field"><span>My interpretation (kept separate)</span><textarea id="pq-i" dir="auto">${S5.esc(q.interpretation || "")}</textarea></label>
    <label class="field"><span>What kind of answer is it?</span><select id="pq-s">${S5.SCHEMA.question.fields.find((f) => f.k === "scope").options.map(([k, n]) => `<option value="${k}" ${q.scope === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>`,
    { footer: `<button class="btn" data-close>Close</button><button class="btn" id="pq-save">Save</button>${i < 4 ? `<button class="btn primary" id="pq-next">Mark ${["asked", "answered", "applied", "verified"][i]}</button>` : ""}` });
  const save = async (next) => { const data = { text: m.el.querySelector("#pq-t").value, answerVerbatim: m.el.querySelector("#pq-v").value, interpretation: m.el.querySelector("#pq-i").value, scope: m.el.querySelector("#pq-s").value }; if (next) data.status = stages[i + 1]; await S5.store.update(q.id, data); if (data.status === "answered" && data.scope === "preference") await S5.store.create("memory", { kind: "professor", subjectId: q.subjectId, text: data.answerVerbatim, context: "Professor preference", stage: 1 }); m.close(); S5.ui.toast("Saved"); };
  m.el.querySelector("#pq-save").onclick = () => save(false); const n = m.el.querySelector("#pq-next"); if (n) n.onclick = () => save(true);
};

// ---- view-projects.js ----
/* Projects — the full architectural project path, from brief to freeze and post-evaluation. */
S5.views.projects = (r) => {
  const show = r.tab || "open";
  const all = S5.store.list("project").map((p) => ({ p, r: S5.projectRisk(p) }));
  const open = all.filter((x) => !["frozen", "evaluated"].includes(x.p.phase)).sort((a, b) => b.r.score - a.r.score);
  const done = all.filter((x) => ["frozen", "evaluated"].includes(x.p.phase));
  const card = ({ p, r: rk }) => { const d = S5.store.where("deliverable", "projectId", p.id); const ready = d.filter((x) => ["ready", "frozen"].includes(x.status)).length; const phaseIdx = S5.PHASES.findIndex((x) => x[0] === p.phase); return `<button class="sheet ${rk.level === "high" ? "alert" : ""}" data-act="open" data-v="project" data-id="${p.id}" style="text-align:start;cursor:pointer;display:grid;gap:8px"><div class="row between"><span class="eyebrow">${(H.subj(p.subjectId) || S5.esc(p.kind || "Project"))}</span>${H.due(p.deadline)}</div><h3 dir="auto">${S5.esc(p.name)}${H.demo(p)}</h3><span class="small muted">${S5.esc(S5.PHASES[phaseIdx]?.[1] || "")}</span>${H.ladder(phaseIdx + 1, S5.PHASES.length)}<div class="chips">${H.pill(rk.level + " risk", rk.level === "high" ? "red" : rk.level === "medium" ? "amber" : "green")}${d.length ? H.pill(`${ready}/${d.length} deliverables`) : ""}${rk.openFb ? H.pill(rk.openFb + " open feedback", "red") : ""}${p.weight ? H.pill(p.weight + "%") : ""}</div>${p.nextAction ? `<p class="small" dir="auto"><b>Next:</b> ${S5.esc(p.nextAction)}</p>` : ""}</button>`; };
  return `<div class="page-head"><div class="titles"><span class="eyebrow">Sorted by risk, deadline and weight</span><h1>Projects</h1></div><div class="row">${H.btn("+ New project", "new-project", {}, "primary")}</div></div>
    ${H.tabs([["open", "Active", open.length], ["done", "Submitted & evaluated", done.length], ["portfolio", "Portfolio", S5.store.count("portfolio")]], show, "open", { v: "projects" })}
    ${show === "open" ? (open.length ? `<div class="grid cols-3">${open.map(card).join("")}</div>` : H.empty("No active projects.", "A project holds the brief, site, program, alternatives, professor feedback, versions and deliverables in one place.", H.btn("Create your first project", "new-project", {}, "primary sm"))) : ""}
    ${show === "done" ? (done.length ? `<div class="grid cols-3">${done.map(card).join("")}</div>` : H.empty("Nothing submitted yet.", "")) : ""}
    ${show === "portfolio" ? S5.portfolioView() : ""}`;

// ---- studio.js ----
/* The Studio (المرسم) — a virtual drawing room under Practice.
   A chalkboard where the teacher demonstrates each step, your paper on the desk, a tool tray, and a ladder of
   lessons from "can't hold the pen" upward. Every task is checked on the device (free, unlimited): straightness,
   angle, accuracy to points, evenness, pressure, circularity, proportion. Later levels unlock tools and
   "draw this" commands. Spec: Drawing Coach (15.2 Lite / 15.3 Advanced) on the Shared Ink Engine. */
S5.studio = {};
S5.STUDIO_W = 1000; S5.STUDIO_H = 700;

/* ---------- geometry of strokes (doc units; stroke points are stored ×10 with pressure ×100) ---------- */
S5.sg = {
  pts(s) { const o = []; for (let i = 0; i < s.p.length; i += 3) o.push([s.p[i] / 10, s.p[i + 1] / 10, s.p[i + 2] / 100]); return o; },
  pens(strokes) { return strokes.filter((s) => s.t === "pen" && s.p.length >= 6); },
  len(P) { let l = 0; for (let i = 1; i < P.length; i++) l += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); return l; },
  line(s) { // endpoints, chord, straightness (1 - max deviation / chord), angle 0..180 (0 = horizontal)
    const P = this.pts(s), a = P[0], b = P[P.length - 1], chord = Math.hypot(b[0] - a[0], b[1] - a[1]); let dev = 0;
    for (const p of P) dev = Math.max(dev, S5.segDist(p[0], p[1], a[0], a[1], b[0], b[1]));
    let ang = (Math.atan2(-(b[1] - a[1]), b[0] - a[0]) * 180) / Math.PI; if (ang < 0) ang += 180; if (ang >= 180) ang -= 180;
    return { a, b, chord, len: this.len(P), straight: chord ? 1 - dev / chord : 0, ang, mid: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], pr: P.reduce((m, p) => m + p[2], 0) / P.length };
  },
  angDiff(a, b) { const d = Math.abs(a - b) % 180; return Math.min(d, 180 - d); },
  circle(s) {
    const P = this.pts(s); const cx = P.reduce((m, p) => m + p[0], 0) / P.length, cy = P.reduce((m, p) => m + p[1], 0) / P.length;
    const r = P.map((p) => Math.hypot(p[0] - cx, p[1] - cy)); const mr = r.reduce((a, b) => a + b, 0) / r.length; const sd = Math.sqrt(r.reduce((a, b) => a + (b - mr) ** 2, 0) / r.length);
    const gap = Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]);
    return { cx, cy, r: mr, round: mr ? 1 - sd / mr : 0, closed: mr ? gap / (2 * Math.PI * mr) : 1, len: this.len(P) };
  },
  bbox(list) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const s of list) for (const p of this.pts(s)) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); } return [x0, y0, x1, y1]; },
  clusters(strokes, gap = 18) { // strokes whose boxes touch form one drawn shape
    const items = strokes.map((s) => ({ s: [s], b: this.bbox([s]) })); let merged = true;
    while (merged) { merged = false; for (let i = 0; i < items.length && !merged; i++) for (let j = i + 1; j < items.length; j++) { const A = items[i].b, B = items[j].b; if (A[0] - gap <= B[2] && B[0] - gap <= A[2] && A[1] - gap <= B[3] && B[1] - gap <= A[3]) { items[i].s.push(...items[j].s); items[i].b = [Math.min(A[0], B[0]), Math.min(A[1], B[1]), Math.max(A[2], B[2]), Math.max(A[3], B[3])]; items.splice(j, 1); merged = true; break; } } }
    return items;
  },
  rectness(c) { // share of drawn points lying near the cluster's bounding box edges
    const [x0, y0, x1, y1] = c.b, w = x1 - x0, h = y1 - y0, tol = Math.max(8, 0.1 * Math.min(w, h)); let n = 0, near = 0;
    for (const s of c.s) for (const p of this.pts(s)) { n++; if (Math.min(Math.abs(p[0] - x0), Math.abs(p[0] - x1), Math.abs(p[1] - y0), Math.abs(p[1] - y1)) <= tol) near++; }
    return n ? near / n : 0;
  },
};
/* guide marks drawn faintly on the paper (as ink "ghost" strokes) */
S5.guideDot = (x, y, r = 5) => { const p = []; for (let k = 0; k <= 12; k++) { const t = (k / 12) * Math.PI * 2; p.push(Math.round((x + r * Math.cos(t)) * 10), Math.round((y + r * Math.sin(t)) * 10), 60); } return { t: "pen", c: "#1f4fa8", w: 3, p }; };
S5.guideRect = (x, y, w, h) => ({ t: "pen", c: "#1f4fa8", w: 1.5, p: [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]].flatMap(([a, b]) => [a * 10, b * 10, 50]) });

/* ---------- the checkers: return { ok, score 0..1, notes[] } with concrete Arabic feedback ---------- */
S5.studioCheck = (lesson, strokes) => {
  const G = S5.sg, c = lesson.check, pens = G.pens(strokes), notes = []; const deg = (x) => Math.round(x * 10) / 10;
  if (!pens.length) return { ok: false, score: 0, notes: ["ارسم على الورقة أول."] };
  if (c.type === "free") {
    const long = pens.filter((s) => G.len(G.pts(s)) >= c.minLen).length;
    if (long < c.n) notes.push(`رسمت ${long} خط طويل من ${c.n}. خليها أطول (حركة من الكتف).`);
    return { ok: long >= c.n, score: Math.min(1, long / c.n), notes };
  }
  if (c.type === "lines" || c.type === "diagonals") {
    const L = pens.map((s) => G.line(s)).filter((l) => l.chord >= c.minLen * 0.5);
    const target = c.type === "lines" ? [c.angle] : [45, 135];
    const good = L.filter((l) => l.chord >= c.minLen && l.straight >= c.straight && Math.min(...target.map((t) => G.angDiff(l.ang, t))) <= c.tol);
    const avgOff = L.length ? L.reduce((m, l) => m + Math.min(...target.map((t) => G.angDiff(l.ang, t))), 0) / L.length : 0;
    const avgSt = L.length ? L.reduce((m, l) => m + l.straight, 0) / L.length : 0;
    if (L.length < c.n) notes.push(`رسمت ${L.length} من ${c.n} خطوط.`);
    if (avgOff > c.tol) notes.push(`خطوطك مايلة بالمعدل ${deg(avgOff)}° عن المطلوب (المسموح ${c.tol}°). صحّح وضع الورقة أو اتجاه ذراعك.`);
    if (avgSt < c.straight) notes.push(`الاستقامة ${Math.round(avgSt * 100)}% (المطلوب ${Math.round(c.straight * 100)}%). ارسم أسرع وبحركة وحدة — البطء يخلي الخط يرجف.`);
    if (L.some((l) => l.chord < c.minLen)) notes.push("بعض الخطوط قصيرة — خليها تمتد على عرض الورقة تقريباً.");
    if (c.type === "diagonals") { const r = good.filter((l) => G.angDiff(l.ang, 45) <= c.tol).length, lft = good.filter((l) => G.angDiff(l.ang, 135) <= c.tol).length; if (r < c.n || lft < c.n) notes.push(`المائل لليمين: ${r}/${c.n} · المائل لليسار: ${lft}/${c.n}.`); const ok = r >= c.n && lft >= c.n; return { ok, score: Math.min(1, (r + lft) / (2 * c.n)), notes }; }
    return { ok: good.length >= c.n, score: Math.min(1, good.length / c.n), notes };
  }
  if (c.type === "connect") {
    const L = pens.map((s) => G.line(s)); let hit = 0, worst = 0;
    for (const [x1, y1, x2, y2] of c.pairs) {
      let best = 1e9, bl = null; for (const l of L) { const e = Math.min(Math.max(Math.hypot(l.a[0] - x1, l.a[1] - y1), Math.hypot(l.b[0] - x2, l.b[1] - y2)), Math.max(Math.hypot(l.a[0] - x2, l.a[1] - y2), Math.hypot(l.b[0] - x1, l.b[1] - y1))); if (e < best) { best = e; bl = l; } }
      if (bl && best <= c.tol && bl.straight >= c.straight) hit++; worst = Math.max(worst, Math.min(best, 999));
    }
    if (hit < c.pairs.length) notes.push(`وصلت ${hit} من ${c.pairs.length} بدقة. أكبر ابتعاد عن النقطة ${Math.round(worst)} وحدة (المسموح ${c.tol}). انظر للنقطة الهدف مو للقلم.`);
    return { ok: hit === c.pairs.length, score: hit / c.pairs.length, notes };
  }
  if (c.type === "parallel") {
    const L = pens.map((s) => G.line(s)).filter((l) => l.chord >= c.minLen);
    if (L.length < c.n) { notes.push(`رسمت ${L.length} من ${c.n} خطوط طويلة.`); return { ok: false, score: L.length / c.n * 0.5, notes }; }
    const m = L.reduce((a, l) => a + l.ang, 0) / L.length; const spread = Math.sqrt(L.reduce((a, l) => a + G.angDiff(l.ang, m) ** 2, 0) / L.length);
    const th = (m * Math.PI) / 180, nx = Math.sin(th), ny = Math.cos(th); // offset along the normal
    const off = L.map((l) => l.mid[0] * nx + l.mid[1] * ny).sort((a, b) => a - b); const gaps = off.slice(1).map((v, i) => v - off[i]); const gm = gaps.reduce((a, b) => a + b, 0) / gaps.length; const cv = gm ? Math.sqrt(gaps.reduce((a, g) => a + (g - gm) ** 2, 0) / gaps.length) / gm : 1;
    if (spread > c.spread) notes.push(`الخطوط مو متوازية تماماً: الفرق بالاتجاه ${deg(spread)}° (المسموح ${c.spread}°).`);
    if (cv > c.cv) notes.push(`المسافات بين الخطوط مو متساوية (تذبذب ${Math.round(cv * 100)}%، المسموح ${Math.round(c.cv * 100)}%).`);
    const ok = spread <= c.spread && cv <= c.cv; return { ok, score: ok ? 1 : Math.max(0, 1 - Math.max(spread / (c.spread * 3), cv / (c.cv * 3))), notes };
  }
  if (c.type === "pressure") {
    const L = pens.map((s) => G.line(s)); if (L.length < c.light + c.dark) { notes.push(`ارسم ${c.light} خطوط خفيفة ثم ${c.dark} غامقة.`); return { ok: false, score: 0, notes }; }
    const flat = L.every((l) => Math.abs(l.pr - 0.5) < 0.02);
    if (flat) { notes.push("جهازك ما دز ضغط القلم (أو رسمت بالإصبع). جرّب بالـ M-Pencil — هسه أعدّيه لك على أساس عدد الخطوط."); return { ok: true, score: 0.7, notes, noPressure: true }; }
    const light = L.slice(0, c.light).reduce((a, l) => a + l.pr, 0) / c.light, dark = L.slice(c.light, c.light + c.dark).reduce((a, l) => a + l.pr, 0) / c.dark;
    const ok = dark - light >= 0.15; if (!ok) notes.push(`الفرق بالضغط قليل: الخفيف ${Math.round(light * 100)}% والغامق ${Math.round(dark * 100)}%. خفّف أكثر بالأولى واضغط أكثر بالأخيرة.`);
    return { ok, score: ok ? 1 : Math.max(0, (dark - light) / 0.15), notes };
  }
  if (c.type === "circles") {
    const C = pens.map((s) => G.circle(s)).filter((x) => x.r >= c.minR * 0.6); const good = C.filter((x) => x.round >= c.round && x.closed <= c.closed && x.r >= c.minR);
    if (C.length < c.n) notes.push(`رسمت ${C.length} من ${c.n} دوائر.`);
    const avgR = C.length ? C.reduce((a, x) => a + x.round, 0) / C.length : 0; if (C.length && avgR < c.round) notes.push(`الاستدارة ${Math.round(avgR * 100)}% (المطلوب ${Math.round(c.round * 100)}%). الدائرة طالعة بيضوية — ارسمها أسرع ومن الكتف.`);
    if (C.some((x) => x.closed > c.closed)) notes.push("بعض الدوائر ما مسكّرة — خلي النهاية ترجع للبداية.");
    return { ok: good.length >= c.n, score: Math.min(1, good.length / c.n), notes };
  }
  if (c.type === "shapes") {
    const K = G.clusters(pens).filter((k) => k.b[2] - k.b[0] > 60 && k.b[3] - k.b[1] > 40); let sq = 0, rc = 0;
    for (const k of K) { const w = k.b[2] - k.b[0], h = k.b[3] - k.b[1], r = Math.max(w, h) / Math.min(w, h), rect = G.rectness(k); if (rect < c.rect) continue; if (Math.abs(r - 1) <= c.tol) sq++; else if (Math.abs(r - 2) <= c.tol * 2) rc++; }
    if (sq < c.squares) notes.push(`مربعات صحيحة: ${sq}/${c.squares} — الأضلاع لازم تكون متساوية (الفرق أقل من ${Math.round(c.tol * 100)}%).`);
    if (rc < c.rects2) notes.push(`مستطيلات 2:1 صحيحة: ${rc}/${c.rects2} — الطول ضعف العرض.`);
    if (K.some((k) => G.rectness(k) < c.rect)) notes.push("بعض الأشكال أضلاعها مو مستقيمة أو الزوايا مدوّرة.");
    return { ok: sq >= c.squares && rc >= c.rects2, score: Math.min(1, (Math.min(sq, c.squares) + Math.min(rc, c.rects2)) / (c.squares + c.rects2)), notes };
  }
  if (c.type === "values") {
    const L = pens.map((s) => G.line(s)); const cnt = c.boxes.map(([x, y, w, h]) => L.filter((l) => l.mid[0] > x && l.mid[0] < x + w && l.mid[1] > y && l.mid[1] < y + h).length);
    const inc = cnt.every((n, i) => i === 0 || n > cnt[i - 1]); const ok = inc && cnt[0] >= 2 && cnt[3] >= cnt[0] * 2.5;
    if (!ok) notes.push(`عدد الخطوط بكل مربع: ${cnt.join(" ← ")}. لازم يزيد بوضوح من الأول للأخير (الأخير ضعفين ونص الأول على الأقل).`);
    return { ok, score: ok ? 1 : cnt.filter((n, i) => i === 0 || n > cnt[i - 1]).length / 4, notes };
  }
  return { ok: false, score: 0, notes: ["?"] };
};

/* ---------- progress ---------- */
S5.studioProg = {
  all() { return S5.store.meta.studioProg || {}; },
  async save(id, res) {
    const all = { ...this.all() }; const p = all[id] || { tries: 0, best: 0 }; p.tries++; p.best = Math.max(p.best, res.score); p.passed = p.passed || res.ok; p.at = S5.now(); all[id] = p;
    const errs = { ...(all._errs || {}) }; for (const t of S5.studioTags(res.notes)) errs[t] = (errs[t] || 0) + 1; all._errs = errs; // recurring mistakes across all lessons
    await S5.store.setMeta("studioProg", all);
  },
  habits() { const e = this.all()._errs || {}; return Object.entries(e).sort((a, b) => b[1] - a[1]).slice(0, 4); },
  unlocked(i) { return i === 0 || !!(this.all()[S5.STUDIO_LESSONS[i - 1].id] || {}).passed; },
  level1Done() { return S5.STUDIO_LESSONS.every((l) => (this.all()[l.id] || {}).passed); },
};

S5.STUDIO_TAGS = [["tilt", /مايلة|اتجاه/, "lines drift off the target angle"], ["wobble", /الاستقامة|يرجف/, "wobbly, slow lines"], ["short", /قصيرة|طويل/, "lines too short"], ["aim", /ابتعاد|النقطة/, "misses target points"], ["spacing", /متساوية/, "uneven spacing"], ["parallel", /متوازية/, "lines not parallel"], ["pressure", /الضغط/, "little pressure control"], ["oval", /الاستدارة|بيضوية/, "circles come out oval"], ["open", /مسكّرة/, "shapes left open"], ["proportion", /مربعات|مستطيلات|متساوية \(|الطول ضعف/, "proportions off"], ["values", /عدد الخطوط بكل مربع/, "value steps not distinct"]];
S5.studioTags = (notes) => [...new Set((notes || []).flatMap((n) => S5.STUDIO_TAGS.filter(([, re]) => re.test(n)).map(([k]) => k)))];

/* ---------- the teacher understands: he looks at your drawing, knows the exact measurements and your habits ---------- */
S5.studioTeacher = async (mode, question) => {
  const { L, ink, last } = S5.studio; const out = document.getElementById("st-ai"); if (!out || S5.studio.busy) return;
  if (!S5.ai.on()) { out.innerHTML = `<p class="small muted">${S5.esc(S5.ai.state === "none" ? "The teacher's AI isn't available here — the measurements above still guide you." : "AI is turned off in Settings.")}</p>`; return; }
  S5.studio.busy = true; out.innerHTML = `<p class="small muted">…</p>`;
  const habits = S5.studioProg.habits().map(([k, n]) => `${(S5.STUDIO_TAGS.find((t) => t[0] === k) || [])[2] || k} (×${n})`).join("; ");
  const hasInk = ink && ink.strokes.length;

      let cs = px.slice(0, 6).map((p, i) => px[Math.floor((i / 6) * px.length)]); for (let it = 0; it < 8; it++) { const sums = cs.map(() => [0, 0, 0, 0]); for (const p of px) { let bi = 0, bd = 1e9; cs.forEach((c, i) => { const dd = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2; if (dd < bd) { bd = dd; bi = i; } }); const s = sums[bi]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++; } cs = sums.map((s, i) => (s[3] ? [s[0] / s[3], s[1] / s[3], s[2] / s[3], s[3]] : cs[i])); }

};

/* ---------- files ---------- */
S5.views.file = (r) => {
  const f = S5.store.get(r.id); if (!f) return H.empty("File not found", "");
  S5.setPlace(`${f.name}${r.page ? " p." + r.page : ""}`, { v: "file", id: f.id, page: r.page });
  const annots = S5.store.count("inkpage", (p) => p.fileId === f.id && (p.strokes || []).length);
  S5.ui.mount(() => {
    const host = document.getElementById("file-host"); if (!host) return;
    if (f.kind === "pdf") { const v = new S5.PdfView(host, f, { startPage: r.page || f.lastPage || 1, onPage: (p) => (S5.filePage = p), onCapture: (p) => S5.openCapture({ subjectId: f.subjectId, projectId: f.projectId, page: p, fileId: f.id }) }); return () => { v.destroy(); if (S5.filePage) S5.store.update(f.id, { lastPage: S5.filePage }); }; }
    if (f.kind === "image") { S5.blobs.url(f.blobKey, f.assetId).then((u) => { host.innerHTML = u ? `<img src="${u}" alt="${S5.esc(f.name)}" style="max-width:100%;border-radius:6px;border:1px solid var(--rule)">` : H.empty("Image bytes are not on this device.", ""); }); }
    else if (f.kind === "video") { S5.blobs.url(f.blobKey, f.assetId).then((u) => { host.innerHTML = u ? `<video src="${u}" controls style="max-width:100%"></video>` : H.empty("Not on this device.", ""); }); }
    else host.innerHTML = H.empty("No preview for this file type.", "The original is stored; export it from a backup.");
  });
  return `<div class="crumbs"><button data-act="back">← Back</button></div>
    <div class="page-head"><div class="titles"><span class="eyebrow">${f.kind.toUpperCase()} · ${S5.fmtBytes(f.size)} · original unchanged · sha256 ${f.hash.slice(0, 12)}${annots ? ` · ${annots} annotated page(s)` : ""}</span><h2 dir="auto">${S5.esc(f.name)}</h2></div>
    <div class="row">${f.kind === "image" ? H.btn("Mark up a copy", "img-markup", { id: f.id }, "sm") : ""}${H.btn("File it", "edit", { type: "file", id: f.id }, "sm")}${H.btn("Capture", "capture", { subject: f.subjectId || "", project: f.projectId || "" }, "sm")}</div></div>
    <div id="file-host" class="${f.kind === "pdf" ? "pane" : ""}" style="${f.kind === "pdf" ? "height:calc(100dvh - 200px);min-height:420px" : ""}"></div>`;
};
S5.act["img-markup"] = async (el) => { const f = S5.store.get(el.dataset.id); let nb = S5.store.list("notebook", (n) => n.refFileId === f.id)[0]; if (!nb) nb = await S5.store.create("notebook", { title: `Markup — ${f.name}`, subjectId: f.subjectId || "", projectId: f.projectId || "", template: "blank", refFileId: f.id, pages: [] }); S5.ui.go({ v: "notebook", id: nb.id }); };
S5.act.upload = async (el) => {
  const files = await S5.ui.pickFile("application/pdf,image/*,video/*", true); if (!files.length) return;
  let last;
  for (const f of files) { if (f.size > 200 * 1048576) { S5.ui.toast(`${f.name} is larger than 200 MB — keep it in your Windows workspace instead.`, true); continue; } last = await S5.intakeFile(f, { subjectId: el.dataset.subject || "", projectId: el.dataset.project || "", library: !!el.dataset.library }); }
  if (last && el.dataset.lecture) { await S5.store.update(el.dataset.lecture, { fileId: last.id }); S5.ui.render(); }
  S5.ui.toast(files.length > 1 ? `${files.length} files added` : "File added");
};

/* ---------- notebooks ---------- */
S5.notebookPage = (nb, idx) => {
  let ids = [...(nb.pages || [])];
  const existing = ids[idx] && S5.store.raw(ids[idx]);
  if (existing) return existing;
  const pg = { id: S5.uid("ink"), type: "inkpage", notebookId: nb.id, title: `${nb.title} · p.${idx + 1}`, strokes: [], layers: [{ n: "Layer 1", v: true }], template: nb.template || "blank", width: 1000, height: 1414, createdAt: S5.now(), subjectId: nb.subjectId || "", projectId: nb.projectId || "", rev: 0 };
  S5.store.put(pg, { silent: true }); ids[idx] = pg.id; nb.pages = ids; S5.store.update(nb.id, { pages: ids });
  return pg;
};
S5.act["new-notebook"] = (el) => S5.ui.edit("notebook", { subjectId: el.dataset.subject || "", projectId: el.dataset.project || "", template: "ruled", pages: [] }, { onSave: (nb) => S5.ui.go({ v: "notebook", id: nb.id }) });
S5.views.notebook = (r) => {
  const nb = S5.store.get(r.id); if (!nb) return H.empty("Notebook not found", "");
  const idx = S5.clamp(r.page ?? nb.cur ?? 0, 0, Math.max(0, (nb.pages || []).length));
  const page = S5.notebookPage(nb, idx); const n = Math.max(1, (nb.pages || []).length);
  S5.setPlace(`${nb.title} p.${idx + 1}`, { v: "notebook", id: nb.id, page: idx });
  if (nb.cur !== idx) S5.store.update(nb.id, { cur: idx });
  S5.ui.mount(() => {
    let ink; const host = document.getElementById("nb-ink");
    const start = (refUrl) => { ink = new S5.Ink(host, { doc: page, refUrl, refAlpha: 0.9 }); };
    if (nb.refFileId) { const f = S5.store.get(nb.refFileId); S5.blobs.url(f?.blobKey, f?.assetId).then((u) => start(u || null)); } else start(null);
    return () => ink && ink.destroy();
  });
  return `<div class="crumbs"><button data-act="back">← Back</button>${nb.subjectId ? ` / <button data-act="open" data-v="subject" data-id="${nb.subjectId}">${H.subj(nb.subjectId)}</button>` : ""}${nb.projectId ? ` / <button data-act="open" data-v="project" data-id="${nb.projectId}">${S5.esc(S5.store.get(nb.projectId)?.name || "")}</button>` : ""}</div>
    <div class="row between" style="margin:8px 0"><h3 dir="auto">${S5.esc(nb.title)}</h3><div class="row">${H.btn("‹", "open", { v: "notebook", id: nb.id, page: Math.max(0, idx - 1) }, "sm")}<span class="mono small">p. ${idx + 1} / ${n}</span>${H.btn("›", "open", { v: "notebook", id: nb.id, page: Math.min(n - 1, idx + 1) }, "sm")}${H.btn("+ Page", "open", { v: "notebook", id: nb.id, page: n }, "sm")}${H.btn("Edit", "edit", { type: "notebook", id: nb.id }, "sm ghost")}</div></div>
    <div id="nb-ink" class="ink-wrap" style="height:calc(100dvh - 190px);min-height:440px"></div>`;
};
S5.views["notebook-page"] = (r) => {
  const pg = S5.store.get(r.id); if (!pg) return H.empty("Page not found", "");
  S5.ui.mount(() => { const ink = new S5.Ink(document.getElementById("pg-ink"), { doc: pg }); return () => ink.destroy(); });
  return `<div class="crumbs"><button data-act="back">← Back</button></div><h3 style="margin:8px 0" dir="auto">${S5.esc(pg.title || "Ink page")}</h3><div id="pg-ink" class="ink-wrap" style="height:calc(100dvh - 190px);min-height:440px"></div>`;
};

// ---- remote.js ----
/* Laptop remote — the phone side of Studio5 Remote Work Orchestration.
   Talks to the Studio5 Companion on your laptop through your own relay (same site, /api).
   End-to-end encrypted: ECDH P-256 → HKDF-SHA256 → AES-GCM, with timestamps + nonces against replay.
   The pairing secret stays on this device (not synced, not in backups). */
S5.remote = {
  ws: null, state: "off", laptopOnline: false, info: null, status: null, pending: new Map(), seq: 0, key: null, seen: new Map(), retry: 1000, available: null,
  get pair() { return S5.store.meta.remote || null; },
  log(action, ok, note) { const l = [{ at: S5.now(), action, ok, note: note || "" }, ...(S5.store.meta.remoteLog || [])].slice(0, 300); S5.store.meta.remoteLog = l; S5.idb.put("meta", "remoteLog", l).catch(() => {}); },
  async checkAvailable() {
    if (this.available != null) return this.available;
    if (!S5.standalone || !/^https?:$/.test(location.protocol)) return (this.available = false);
    try { const r = await fetch("/api/health", { cache: "no-store" }); this.available = r.ok && (await r.json()).service === "studio5-relay"; } catch { this.available = false; }
    return this.available;
  },
  /* crypto */
  b64(buf) { return S5.b64FromBuf(buf instanceof ArrayBuffer ? buf : buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength)); },
  unb64(s) { return new Uint8Array(S5.bufFromB64(s)); },
  async deriveKey(privJwk, peerPub, device) {

    const peer = await s.importKey("raw", this.unb64(peerPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
    const bits = await s.deriveBits({ name: "ECDH", public: peer }, priv, 256);
    const hk = await s.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
    return s.deriveKey({ name: "HKDF", hash: "SHA-256", salt: new TextEncoder().encode(device), info: new TextEncoder().encode("studio5-remote-v1") }, hk, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  },
  async checkCode(aPub, bPub) { const a = this.unb64(aPub), b = this.unb64(bPub); const all = new Uint8Array(a.length + b.length); all.set(a); all.set(b, a.length); const h = new Uint8Array(await crypto.subtle.digest("SHA-256", all)); const n = ((h[0] << 16) | (h[1] << 8) | h[2]) % 1000000; return String(n).padStart(6, "0").replace(/(\d\d)(\d\d)(\d\d)/, "$1 $2 $3"); },
  async seal(body, queue) { const iv = crypto.getRandomValues(new Uint8Array(12)); const n = [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, "0")).join(""); const pt = new TextEncoder().encode(JSON.stringify({ ts: Date.now(), n, from: "phone", body })); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, this.key, pt); return { t: "msg", iv: this.b64(iv), ct: this.b64(ct), queue: !!queue }; },
  async open(env) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: this.unb64(env.iv) }, this.key, this.unb64(env.ct)); const m = JSON.parse(new TextDecoder().decode(pt)); if (m.from !== "laptop") throw new Error("direction"); if (Math.abs(Date.now() - m.ts) > 120000) throw new Error("stale"); if (this.seen.has(m.n)) throw new Error("replay"); this.seen.set(m.n, 1); if (this.seen.size > 2000) this.seen.clear(); return m.body; },
  /* pairing */
  async claim(code) {
    const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    const pub = this.b64(await crypto.subtle.exportKey("raw", kp.publicKey)); const priv = await crypto.subtle.exportKey("jwk", kp.privateKey);
    const r = await fetch("/api/pair/claim", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: String(code).replace(/\D/g, ""), pub }) }).then((x) => x.json());
    if (r.error) throw new Error(r.error);
    const check = await this.checkCode(r.laptopPub, pub);
    await S5.store.setMeta("remote", { device: r.device, token: r.token, name: r.name, laptopPub: r.laptopPub, pub, priv, check, pairedAt: S5.now(), confirmed: false });
    this.key = null; this.connect();
    return check;
  },
  /* link another phone/iPad to this pairing with a one-time code (the pairing secret travels encrypted) */
  async linkKey(code) { const s = crypto.subtle, c = code.toUpperCase().replace(/[^A-Z0-9]/g, ""); const base = await s.importKey("raw", new TextEncoder().encode(c), "PBKDF2", false, ["deriveKey"]); const key = await s.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("studio5-link-v1"), iterations: 200000 }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); const id = [...new Uint8Array(await s.digest("SHA-256", new TextEncoder().encode("studio5-link-id:" + c)))].map((b) => b.toString(16).padStart(2, "0")).join(""); return { key, id }; },
  async makeLink() {
    const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint8Array(10)); const code = [...r].map((b) => A[b % A.length]).join("");
    const { key, id } = await this.linkKey(code); const iv = crypto.getRandomValues(new Uint8Array(12));
    const payload = {};
    if (this.pair) { const { device, token, name, laptopPub, pub, priv, check } = this.pair; Object.assign(payload, { device, token, name, laptopPub, pub, priv, check }); }
    if (S5.store.meta.tutorKey) { try { const k = await fetch("/api/tutor/addkey", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: S5.store.meta.tutorKey }) }).then((x) => x.json()); if (k.key) payload.tutorKey = k.key; } catch {} }
    if (!payload.device && !payload.tutorKey) throw new Error("Nothing to link from this device yet");
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(payload)));
    const r2 = await fetch("/api/pair/link-put", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, blob: this.b64(iv) + "." + this.b64(ct) }) }).then((x) => x.json());
    if (r2.error) throw new Error(r2.error); return code.slice(0, 5) + "-" + code.slice(5);
  },
  async takeLink(code) {
    const { key, id } = await this.linkKey(code);
    const r = await fetch("/api/pair/link-take", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id }) }).then((x) => x.json());
    if (r.error) throw new Error(r.error);
    const [iv, ct] = r.blob.split("."); let p;
    try { p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: this.unb64(iv) }, key, this.unb64(ct)))); } catch { throw new Error("Wrong link code"); }
    if (p.tutorKey) await S5.store.setMeta("tutorKey", p.tutorKey);
    if (p.device) { const { tutorKey, ...pair } = p; await S5.store.setMeta("remote", { ...pair, pairedAt: S5.now(), confirmed: true, linked: true }); this.key = null; try { this.ws && this.ws.close(); } catch {} this.ws = null; this.connect(); S5.audit("remote", "This device was linked to " + p.name); }
  },
  async unpair() { try { this.ws && this.ws.close(); } catch {} this.ws = null; this.key = null; this.state = "off"; await S5.store.setMeta("remote", null); S5.audit("remote", "Laptop unpaired on this phone"); },
  async connect() {
    const p = this.pair; if (!p || !(await this.checkAvailable())) return;
    if (this.ws && this.ws.readyState <= 1) return;
    this.key = this.key || (await this.deriveKey(p.priv, p.laptopPub, p.device));
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = (this.ws = new WebSocket(`${proto}//${location.host}/api/ws?device=${p.device}&role=phone&token=${p.token}`));
    this.state = "connecting"; this.emit();
    ws.onopen = () => { this.state = "online"; this.retry = 1000; this.emit(); this.hello(); };
    ws.onmessage = async (ev) => {
      let env; try { env = JSON.parse(ev.data); } catch { return; }
      if (env.t === "presence") { const was = this.laptopOnline; this.laptopOnline = env.laptop; this.emit(); if (env.laptop && !was) this.hello(); return; }
      if (env.t === "queued") { S5.ui.toast("Laptop is offline — queued, it runs when the laptop connects"); return; }
      if (env.t !== "msg") return;
      let body; try { body = await this.open(env); } catch (e) { this.lastReject = e.message; if (!this._rejToast) { this._rejToast = 1; S5.ui.toast(e.message === "stale" ? "Laptop reply rejected: the phone and laptop clocks differ by more than 2 minutes — set both to automatic time" : "Laptop reply rejected (" + e.message + ") — re-pair if this continues"); setTimeout(() => (this._rejToast = 0), 10000); } return; }

      if (body.stream === "screen") { S5.rmFrame(body); return; }
      if (body.rtc) { if (body.sid && body.sid !== S5.rtc.sid) return; S5.rtcSignal(body.rtc).catch((e) => console.warn(e)); return; }
      const w = this.pending.get(body.re); if (!w) return;
      if (body.partial) { w.onPartial && w.onPartial(body.data); return; }
      this.pending.delete(body.re); clearTimeout(w.timer);
      body.ok ? w.res(body.data) : w.rej(new Error(body.error || "failed"));
    };
    ws.onclose = () => { this.state = "offline"; this.laptopOnline = false; this.emit(); if (this.pair) setTimeout(() => this.connect(), this.retry); this.retry = Math.min(this.retry * 2, 20000); };
  },
  async hello() { try { this.info = await this.send("hello", {}, { quiet: true, timeout: 8000 }); if (this.pair && !this.pair.confirmed) await S5.store.setMeta("remote", { ...this.pair, confirmed: true }); this.status = await this.send("sys.status", {}, { quiet: true }).catch(() => null); this.emit(); } catch {} },
  send(action, args = {}, { onPartial, timeout = 20000, quiet, queue } = {}) {
    return new Promise(async (res, rej) => {
      if (!this.ws || this.ws.readyState !== 1 || !this.key) return rej(new Error("Not connected to the relay"));
      if (!this.laptopOnline && !queue) return rej(new Error("The laptop is offline. Start Studio5 Companion on it."));
      const id = "c" + ++this.seq + "_" + Date.now().toString(36);
      const timer = setTimeout(() => { if (this.pending.has(id)) { this.pending.delete(id); rej(new Error("No answer from the laptop" + (this.lastReject ? " (last reply rejected: " + this.lastReject + ")" : " — if you clicked inside the Companion window, press Esc there"))); } }, timeout);
      this.pending.set(id, { res: (d) => { if (!quiet) this.log(action, true); res(d); }, rej: (e) => { if (!quiet) this.log(action, false, e.message); rej(e); }, onPartial, timer });

    });
  },
  /* fire-and-forget: no reply, no waiting (pointer moves, clicks, acks) */
  fire(action, args = {}) { // queued so presses, moves and releases keep their order
    this._fq = (this._fq || Promise.resolve()).then(async () => { if (!this.ws || this.ws.readyState !== 1 || !this.key || !this.laptopOnline) return; try { this.ws.send(JSON.stringify(await this.seal({ id: "f" + ++this.seq, action, args, nr: 1 }))); } catch {} });
  },
  emit: S5.debounce(() => { if (S5.ui.route.v === "remote") S5.remote.refreshStatus(); S5.ui.renderChrome && S5.ui.renderChrome(); }, 60),
  refreshStatus() { const el = document.getElementById("rm-status"); if (el) el.innerHTML = S5.remoteStatusHTML(); },
  /* file transfer */
  async fetchFile(path, onProgress) {
    const parts = []; let meta = null;
    await this.send("file.get", { path }, { timeout: 300000, onPartial: (d) => { parts[d.i] = d.chunk; meta = d; onProgress && onProgress(d.i + 1, d.total); } });
    const bytes = parts.map((p) => this.unb64(p)); return new File(bytes, meta?.name || path.split(/[\\/]/).pop(), { type: S5.mimeOf(meta?.name || path) });
  },
  async putFile(file, onProgress) {
    const buf = new Uint8Array(await file.arrayBuffer()); const size = 300000; const total = Math.ceil(buf.length / size) || 1; const uid = S5.uid("up"); let last;
    for (let i = 0; i < total; i++) { last = await this.send("file.put", { uid, name: file.name, i, total, chunk: this.b64(buf.slice(i * size, (i + 1) * size)) }, { timeout: 60000, quiet: i < total - 1 }); onProgress && onProgress(i + 1, total); }
    return last;
  },
};
S5.mimeOf = (n) => ({ pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", mp4: "video/mp4", txt: "text/plain", csv: "text/csv", json: "application/json" }[(n.split(".").pop() || "").toLowerCase()] || "application/octet-stream");
S5.remoteStatusHTML = () => {
  const r = S5.remote, p = r.pair, st = r.status;
