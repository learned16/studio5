  } else if (tab === "understanding") {
    const gaps = S5.store.list("gap", (g) => g.subjectId === s.id); const qs = S5.store.list("question", (q) => q.subjectId === s.id);
    body = `<div class="grid cols-2">${H.section("Understanding gaps", gaps.length ? `<div class="list">${gaps.map((g) => H.item({ lead: g.stage >= 3 ? "green" : "red", t: S5.esc(g.text), s: `${S5.LADDER[g.stage || 0]} · ${(g.attempts || []).length} attempt(s)`, right: H.ladder(g.stage || 0, 5), act: "rescue", data: { id: g.id } })).join("")}</div>` : H.empty("No gaps — or not captured yet.", "Mark “didn't understand” during a lecture; it lands here."), H.btn("+ Gap", "new-gap", { subject: s.id }, "sm primary"))}
      ${H.section("Professor question cycle", qs.length ? `<div class="list">${qs.map((q) => H.item({ lead: q.status === "verified" ? "green" : "cobalt", t: S5.esc(q.text), s: `Stage: ${q.status}${q.answerVerbatim ? " · answered" : ""}`, act: "question", data: { id: q.id } })).join("")}</div>` : H.empty("No questions yet.", ""), H.btn("+ Question", "new", { type: "question", defaults: JSON.stringify({ subjectId: s.id, status: "draft" }) }, "sm"))}</div>`;
  } else if (tab === "exams") {
    body = S5.examsTab(s, r);
  } else if (tab === "problems") {
    const ps = S5.store.list("problem", (p) => p.subjectId === s.id);
    const byType = {}; ps.filter((p) => p.errorType).forEach((p) => (byType[p.errorType] = (byType[p.errorType] || 0) + 1)); const mx = Math.max(1, ...Object.values(byType));
    body = `<div class="grid cols-2" style="margin-bottom:14px">${H.section("Error pattern", Object.keys(byType).length ? `<div class="bar-chart">${Object.entries(byType).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="bar-row"><span class="small">${S5.esc({ knowledge: "Knowledge", application: "Application", execution: "Execution", exam: "Exam conditions" }[k] || k)}</span>${H.meter((n / mx) * 100, "red")}<span class="mono small">${n}</span></div>`).join("")}</div><p class="tiny muted" style="margin-top:8px">Treat the cause, not the chapter: knowledge → re-learn the idea; application → worked examples; execution → slow checks; exam → timed practice.</p>` : H.empty("No errors recorded yet.", ""))}
      ${H.section("Help ladder", `<p class="small">When stuck, reveal help one step at a time: <b>Hint → which step → the principle → part of the solution → full solution</b>. Record the level you needed; it shows how independent you are.</p>`)}</div>
      ${list("problem", null, (p) => H.item({ lead: { solved: "green", timed: "green", solvedHelp: "cobalt", retry: "amber", new: "" }[p.status] || "", t: S5.esc(p.question) + H.demo(p), s: [p.source, p.errorType ? "error: " + p.errorType : "", p.cause].filter(Boolean).map(S5.esc).join(" · "), right: p.retryAt ? H.due(p.retryAt) : "", act: "edit", data: { type: "problem", id: p.id } }), "No problems logged.", "+ Problem", { status: "new" })}`;
  } else if (tab === "professor") {
    const fb = S5.store.list("feedback", (f) => f.subjectId === s.id && !f.projectId); const mem = S5.store.list("memory", (m) => m.subjectId === s.id || (m.context || "").includes(s.name));
    body = `<div class="grid cols-2">${H.section(`Professor: ${S5.esc(s.professor || "not set")}`, `<p class="small muted">Feedback and rules from this professor. Kept separate: scientific rule, official requirement, personal preference, project note, uncertain. Patterns are probabilities, not guarantees.</p>${fb.length ? `<div class="list">${fb.map((f) => H.item({ lead: f.scope === "requirement" ? "red" : f.scope === "preference" ? "amber" : "cobalt", t: `<span class="verbatim" dir="auto">${S5.esc(f.verbatim)}</span>`, s: `${S5.esc(f.scope || "unclassified")}${f.interpretation ? " · " + S5.esc(f.interpretation) : ""}`, act: "edit", data: { type: "feedback", id: f.id } })).join("")}</div>` : ""}`, H.btn("+ Feedback", "new", { type: "feedback", defaults: JSON.stringify({ subjectId: s.id, status: "open" }) }, "sm"))}
      ${H.section("Experience memory", mem.length ? `<div class="list">${mem.map((m) => H.item({ t: S5.esc(m.text), s: `${S5.esc(m.kind)} · ${S5.MEM_STAGES[m.stage || 0]}`, right: H.ladder((m.stage || 0) + 1, 5), act: "edit", data: { type: "memory", id: m.id } })).join("")}</div>` : H.empty("Nothing remembered yet.", ""), H.btn("+ Memory", "new", { type: "memory", defaults: JSON.stringify({ subjectId: s.id, stage: 0 }) }, "sm"))}</div>`;
  } else if (tab === "about") {
    body = `<div class="grid cols-2">${H.section("Subject profile", `<dl class="kv"><dt>Arabic name</dt><dd class="ar" dir="rtl">${S5.esc(s.ar)}</dd><dt>Year / semester</dt><dd>${s.year} / ${s.semester}</dd><dt>ECTS</dt><dd>${s.ects}</dd><dt>Profile</dt><dd>${S5.esc(S5.PROFILES[s.profile]?.label)}</dd><dt>Capability packs</dt><dd>${packs.map((p) => H.pill(p)).join(" ")}</dd><dt>Professor</dt><dd>${S5.esc(s.professor || "—")}</dd><dt>Source</dt><dd>${S5.esc(s.source || "manual")}</dd></dl>`, H.btn("Edit", "edit", { type: "subject", id: s.id }, "sm"))}
      ${H.section("Linked work", `<div class="list">${S5.store.list("project", (p) => p.subjectId === s.id).map((p) => H.item({ lead: "cobalt", t: S5.esc(p.name), right: H.due(p.deadline), act: "open", data: { v: "project", id: p.id } })).join("") || H.empty("No projects linked.", "")}</div>`)}</div>`;
  }
  return `<div class="crumbs"><button data-act="open" data-v="study">Study</button> / <span>${s.program === "civil" ? "Civil · stage " + s.year : "Semester " + s.semester}</span></div>
    <div class="page-head"><div class="titles"><span class="eyebrow">${s.program === "civil" ? "Civil Engineering · stage " + s.year + (s.code ? " · " + S5.esc(s.code) : "") : "Architecture · semester " + s.semester} · ${s.ects ?? "?"} ${S5.unitLabel(s)} · ${S5.esc(S5.PROFILES[s.profile]?.label || "")}${s.provisional ? " · provisional" : ""}${S5.yearActive(s.year) ? "" : " · year not active"}</span><h1>${S5.esc(s.name)}</h1><span class="ar muted" dir="rtl">${S5.esc(s.ar)}</span></div>
    <div class="row">${H.btn("Capture", "capture", { subject: s.id })}${H.btn("Plan session", "new-session", { subject: s.id })}</div></div>
    ${H.tabs(tabs, tab, "open", { v: "subject", id: s.id })}${body}`;
};

/* ---------- assessments & exams ---------- */
S5.examsTab = (s, r) => {
  const target = S5.num(S5.ls.get("target_" + s.id, 85));
  const g = S5.gradeState(s.id, target);
  const topics = S5.store.list("topic", (t) => t.subjectId === s.id);
  const mocks = S5.store.list("mock", (m) => m.subjectId === s.id);
  const T = S5.todayISO();
  return `<div class="grid cols-2">
    ${H.section("Assessment map", g.as.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Assessment</th><th>Date</th><th class="num">Weight</th><th class="num">Score</th></tr></thead><tbody>${g.as.sort((a, b) => (a.date || "").localeCompare(b.date || "")).map((a) => `<tr data-act="edit" data-type="assessment" data-id="${a.id}" style="cursor:pointer"><td>${S5.esc(a.kind)}${H.demo(a)}<div class="tiny muted">${S5.esc(a.weightSource || "source not recorded")}</div></td><td>${a.date ? H.due(a.date) : ""}</td><td class="num mono">${a.confirmed ? a.weight + "%" : `<span style="color:var(--amber)">${a.weightMin ?? "?"}–${a.weightMax ?? "?"}%</span>`}</td><td class="num mono">${a.score != null ? `${a.score}/${a.maxScore}` : "—"}</td></tr>`).join("")}</tbody></table></div>
      <div class="grid cols-3" style="margin-top:12px"><div class="stat"><span class="v">${g.graded ? S5.round(g.pct, 1) + "%" : "—"}</span><span class="l">current (${g.graded}% graded)</span></div><div class="stat"><span class="v">${S5.round(g.earned, 1)}</span><span class="l">points earned of ${S5.round(g.total, 0)}</span></div><div class="stat"><span class="v">${g.remaining}%</span><span class="l">weight still open</span></div></div>
      <div class="row" style="margin-top:12px"><label class="field" style="width:130px"><span>My target %</span><input type="number" id="tgt" value="${target}" data-subject="${s.id}"></label><p class="small grow" id="tgt-out">${S5.targetText(g, target)}</p></div>
      ${g.unconfirmed ? `<p class="small" style="color:var(--amber)">${g.unconfirmed}% of the weight is unconfirmed — results are a range until you confirm it.</p>` : ""}` : H.empty("No assessments yet.", "Add quizzes, exams and projects with their weights and where the weight came from."), H.btn("+ Assessment", "new", { type: "assessment", defaults: JSON.stringify({ subjectId: s.id, maxScore: 100 }) }, "sm primary"))}
    ${H.section("Exam scope & mastery", topics.length ? `<div class="list">${topics.map((t) => H.item({ lead: t.scope === "in" ? "cobalt" : t.scope === "out" ? "" : "amber", t: S5.esc(t.name) + H.demo(t), s: `${{ in: "in scope", out: "excluded", maybe: "probably", confirm: "needs confirmation" }[t.scope] || ""} · ${S5.MASTERY[t.mastery || 0]}`, right: H.ladder(t.mastery || 0, 6), act: "edit", data: { type: "topic", id: t.id } })).join("")}</div>
      <p class="small" style="margin-top:10px">Coverage: <b>${S5.round((topics.filter((t) => (t.mastery || 0) >= 4).length / Math.max(1, topics.filter((t) => t.scope !== "out").length)) * 100, 0)}%</b> of in-scope topics solved alone.</p>` : H.empty("No topics yet.", "List the exam topics, then rate your mastery honestly."), `${H.btn("+ Topic", "new", { type: "topic", defaults: JSON.stringify({ subjectId: s.id, scope: "in", mastery: 0 }) }, "sm")}${topics.length ? H.btn("Diagnostic", "diagnostic", { subject: s.id }, "sm") : ""}`)}
    ${H.section("Exam plan", (() => { const ex = g.as.filter((a) => a.date && a.date >= T && a.score == null).sort((a, b) => a.date.localeCompare(b.date))[0]; if (!ex) return H.empty("No upcoming assessment.", ""); const days = S5.daysBetween(T, ex.date); const weak = topics.filter((t) => t.scope !== "out" && (t.mastery || 0) < 5); const need = weak.reduce((a, t) => a + (5 - (t.mastery || 0)) * 40, 0); return `<p><b>${S5.esc(ex.kind)}</b> ${S5.relDay(ex.date)} · ${weak.length} topic(s) below “solve under time”.</p><p class="small muted">Rough need: ${S5.fmtMin(need * 0.8)}–${S5.fmtMin(need * 1.4)} of practice (≈40 min per mastery step per topic; refined as you log sessions). That is about ${S5.fmtMin((need / Math.max(1, days - 1)))} per day, keeping the last day light.</p><div class="row" style="margin-top:8px">${H.btn("Create reverse plan", "exam-plan", { subject: s.id, id: ex.id }, "sm primary")}${H.btn("Exam day sheet", "exam-day", { id: ex.id }, "sm")}</div>`; })())}
    ${H.section("Mock exams", `${mocks.length ? `<div class="list">${mocks.map((m) => H.item({ lead: m.finished ? "green" : "cobalt", t: S5.esc(m.title), s: `${(m.questions || []).length} questions · ${m.minutes} min${m.finished ? ` · score ${m.score ?? "—"} · confidence gap ${m.calib ?? "—"}` : ""}`, act: "open", data: { v: "mock", id: m.id } })).join("")}</div>` : H.empty("No mock exams yet.", "Timed, no hints, then compare confidence with results.")}`, H.btn("+ Mock exam", "new-mock", { subject: s.id }, "sm"))}
  </div>`;
};
S5.targetText = (g, target) => { if (!g.remaining) return g.graded ? `All graded: final ≈ ${S5.round(g.pct, 1)}%.` : ""; const need = ((target - g.earned) / g.remaining) * 100; if (need > 100) return `<span style="color:var(--redline)">${target}% is no longer reachable; best possible ≈ ${S5.round(g.earned + g.remaining, 1)}%.</span>`; if (need <= 0) return `<span style="color:var(--green)">Target already secured.</span>`; return `To reach ${target}%, average <b>${S5.round(need, 1)}%</b> on the remaining ${g.remaining}%${g.unconfirmed ? ` (range ${S5.round(((target - g.earned) / Math.max(1, g.remMax)) * 100, 0)}–${S5.round(((target - g.earned) / Math.max(1, g.remMin)) * 100, 0)}% while weights are unconfirmed)` : ""}.`; };
document.addEventListener("input", (e) => { if (e.target.id === "tgt") { const sId = e.target.dataset.subject; S5.ls.set("target_" + sId, +e.target.value); const g = S5.gradeState(sId, +e.target.value); const o = document.getElementById("tgt-out"); if (o) o.innerHTML = S5.targetText(g, +e.target.value); } });
S5.act["exam-plan"] = async (el) => {
  const s = S5.store.get(el.dataset.subject), ex = S5.store.get(el.dataset.id); const T = S5.todayISO(); const days = S5.daysBetween(T, ex.date);
  const weak = S5.store.list("topic", (t) => t.subjectId === s.id && t.scope !== "out" && (t.mastery || 0) < 5).sort((a, b) => (a.mastery || 0) - (b.mastery || 0));
  if (!weak.length || days < 1) return S5.ui.toast(days < 1 ? "The exam is today — use the exam day sheet." : "Add topics with mastery below 5 first.");
  const slots = []; let d = 0; const cap = S5.settings.get("dailySessionCap");
  for (const t of weak) for (let k = t.mastery || 0; k < 5; k++) slots.push({ t, k });
  const per = Math.max(1, Math.ceil(slots.length / Math.max(1, days - 1)));
  const m = S5.ui.modal("Reverse exam plan", `<p class="small">Creates ${slots.length} sessions over ${Math.max(1, days - 1)} day(s), at most ${Math.min(per, cap)} per day, weakest topics first. The day before the exam stays light (review only).</p>`, { footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="ep-ok">Create sessions</button>` });
  m.el.querySelector("#ep-ok").onclick = async () => { let i = 0; for (const sl of slots) { const day = S5.addDays(T, Math.min(days - 2, Math.floor(i / Math.min(per, cap)))); await S5.store.create("session", { subjectId: s.id, date: day < T ? T : day, reason: `${sl.t.name}: ${S5.MASTERY[sl.k]} → ${S5.MASTERY[sl.k + 1]}`, plannedMin: 40, output: "Solved problems on " + sl.t.name, criterion: S5.MASTERY[sl.k + 1], examId: ex.id }); i++; } await S5.store.create("session", { subjectId: s.id, date: S5.addDays(ex.date, -1), reason: "Light review: personal error list + formulas", plannedMin: 45, output: "One-page summary", criterion: "Calm, no new topics", examId: ex.id }); m.close(); S5.ui.toast(`${slots.length + 1} sessions planned`); };
};
S5.act["exam-day"] = (el) => {
  const ex = S5.store.get(el.dataset.id); const s = S5.store.get(ex.subjectId);
  const errs = S5.store.list("problem", (p) => p.subjectId === s.id && p.errorType).slice(-6); const fb = S5.store.list("feedback", (f) => f.subjectId === s.id && f.scope === "requirement");
  const verb = S5.store.list("capture", (c) => c.subjectId === s.id && c.kind === "verbatim");
  const m = S5.ui.modal(`Exam day — ${ex.kind}`, `<dl class="kv"><dt>Subject</dt><dd>${S5.esc(s.name)}</dd><dt>When / where</dt><dd>${S5.fmtDate(ex.date)} ${S5.esc(ex.place || "")}</dd><dt>Allowed</dt><dd>${S5.esc(ex.allowed || "not recorded — ask")}</dd><dt>Scope</dt><dd dir="auto">${S5.esc(ex.topics || "")}</dd></dl>
    <h4>Your personal mistakes to avoid</h4><ul>${errs.map((p) => `<li dir="auto">${S5.esc(p.cause || p.question)}</li>`).join("") || "<li>No errors logged.</li>"}</ul>
    ${verb.length || fb.length ? `<h4>What the professor said</h4>${[...verb.map((v) => v.text), ...fb.map((f) => f.verbatim)].slice(0, 5).map((t) => `<p class="verbatim" dir="auto">${S5.esc(t)}</p>`).join("")}` : ""}
    <p class="small muted">No new topics today. After the exam, record a 2-minute debrief before you forget.</p>`, { footer: `<button class="btn primary" id="debrief">Quick debrief</button>` });
  m.el.querySelector("#debrief").onclick = () => { m.close(); const d = S5.ui.modal("Quick debrief", `<label class="field"><span>What was asked that you didn't expect?</span><textarea id="db1" dir="auto"></textarea></label><label class="field"><span>Where did time go?</span><input id="db2" dir="auto"></label><label class="field"><span>Expected score (out of ${ex.maxScore || 100})</span><input id="db3" type="number"></label>`, { footer: `<button class="btn primary" id="db-ok">Save</button>` }); d.el.querySelector("#db-ok").onclick = async () => { await S5.store.update(ex.id, { debrief: d.el.querySelector("#db1").value, debriefTime: d.el.querySelector("#db2").value, expected: +d.el.querySelector("#db3").value || null }); await S5.store.create("memory", { kind: "result", subjectId: s.id, text: `${ex.kind}: unexpected — ${d.el.querySelector("#db1").value}`, stage: 0 }); d.close(); S5.ui.toast("Debrief saved"); }; };
};
S5.act.diagnostic = async (el) => {
  const s = S5.store.get(el.dataset.subject); const topics = S5.store.list("topic", (t) => t.subjectId === s.id && t.scope !== "out");
  const m = S5.ui.modal("Diagnostic", `<p class="small">Rate each topic honestly. ${S5.ai.on() ? "Or let AI write one distinguishing question per topic first." : ""}</p><div id="diag-ai"></div><div class="list">${topics.map((t) => `<div class="item"><span class="lead"></span><div><div class="t">${S5.esc(t.name)}</div></div><select data-topic="${t.id}">${S5.MASTERY.map((x, i) => `<option value="${i}" ${i === (t.mastery || 0) ? "selected" : ""}>${x}</option>`).join("")}</select></div>`).join("")}</div>`, { wide: true, footer: `${S5.ai.on() ? '<button class="btn" id="diag-gen">AI questions</button>' : ""}<button class="btn primary" id="diag-ok">Save ratings</button>` });
  m.el.querySelector("#diag-ok").onclick = async () => { for (const sel of m.el.querySelectorAll("[data-topic]")) await S5.store.update(sel.dataset.topic, { mastery: +sel.value, diagAt: S5.now() }); m.close(); S5.ui.toast("Mastery updated"); };
  const gen = m.el.querySelector("#diag-gen"); if (gen) gen.onclick = async () => { gen.disabled = true; gen.textContent = "Asking…"; try { const qs = await S5.ai.diagnostic(s, topics); m.el.querySelector("#diag-ai").innerHTML = `${H.ai()}<div class="list">${(Array.isArray(qs) ? qs : []).map((q) => H.item({ t: S5.esc(q.topic) + ": " + S5.esc(q.question), s: "Good answer: " + S5.esc(q.whatGoodLooksLike) })).join("")}</div>`; } catch (e) { S5.ui.toast(e.message, true); } gen.remove(); };
};

/* ---------- mock exam ---------- */
S5.act["new-mock"] = (el) => {

      <p class="tiny muted" style="margin-top:10px">Drawing Coach Lite measures what can be measured (line straightness, angle consistency, convergence to a vanishing point, feathering, speed) and asks you to self-check the rest. Advanced critique comes later in the five-year plan.</p>`;
  } else if (tab === "tools") {

S5.views.drill = (r) => {
  const d = S5.store.get(r.id); if (!d) return H.empty("Drill not found", "");
  const atts = S5.store.list("drill", (a) => a.drillId === d.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const prev = atts[0] && S5.store.get(atts[0].inkId);
  S5.setPlace(`Drawing Coach: ${d.name}`, r);
  if (!S5.drillPage || S5.drillPage.drillId !== d.id) S5.drillPage = { id: S5.uid("ink"), type: "inkpage", drillId: d.id, title: d.name, strokes: [], layers: [{ n: "Attempt", v: true }], template: d.guide === "grid" ? "grid" : "blank", width: 1000, height: 1414, createdAt: S5.now(), t0: Date.now() };
  S5.ui.mount(() => {
    const ink = new S5.Ink(document.getElementById("drill-ink"), { doc: S5.drillPage, guide: d.guide === "grid" ? null : d.guide, ghost: prev ? prev.strokes : null, onChange: (st) => { S5.drillPage.strokes = st; const m = S5.inkAnalyze(st); const el = document.getElementById("drill-metrics"); if (el) el.innerHTML = S5.metricsHTML(m, d); } });
    S5.drillInk = ink;
    const iv = setInterval(() => { const el = document.getElementById("drill-clock"); if (!el) return; const s = Math.floor((Date.now() - S5.drillPage.t0) / 1000); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} / ${d.minutes}:00`; if (s > d.minutes * 60) el.style.color = "var(--amber)"; }, 1000);
    return () => { clearInterval(iv); ink.destroy(); };
  });
  return `<div class="crumbs"><button data-act="open" data-v="practice">Practice</button> / <span>${S5.esc(d.track)}</span></div>
    <div class="page-head"><div class="titles"><span class="eyebrow">${S5.esc(d.track)} · level ${d.level} · ${d.minutes} min</span><h2>${S5.esc(d.name)}</h2><p class="small" dir="auto">${S5.esc(d.goal)}</p></div><div class="row"><span class="mono" id="drill-clock">0:00</span>${H.btn("Finish attempt", "drill-finish", { id: d.id }, "primary")}</div></div>
    <div class="workspace" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">

      ${H.section("Sources used", srcIds.size ? `<ol class="small" style="padding-left:18px">${[...srcIds].map((id) => S5.store.get(id)).filter(Boolean).map((s) => `<li dir="auto">${S5.esc(s.citation || S5.cite(s))}</li>`).join("")}</ol>` : H.empty("Link sources through claims.", ""))}

/* ---------- files ---------- */
S5.views.file = (r) => {
  const f = S5.store.get(r.id); if (!f) return H.empty("File not found", "");
  S5.setPlace(`${f.name}${r.page ? " p." + r.page : ""}`, { v: "file", id: f.id, page: r.page });
  const annots = S5.store.count("inkpage", (p) => p.fileId === f.id && (p.strokes || []).length);
  S5.ui.mount(() => {
    const host = document.getElementById("file-host"); if (!host) return;
    if (f.kind === "pdf") { const v = new S5.PdfView(host, f, { startPage: r.page || f.lastPage || 1, onPage: (p) => (S5.filePage = p), onCapture: (p) => S5.openCapture({ subjectId: f.subjectId, projectId: f.projectId, page: p, fileId: f.id }) }); return () => { v.destroy(); if (S5.filePage) S5.store.update(f.id, { lastPage: S5.filePage }); }; }
    if (f.kind === "image") { S5.blobs.url(f.blobKey, f.assetId).then((u) => { host.innerHTML = u ? `<img src="${u}" alt="${S5.esc(f.name)}" style="max-width:100%;border-radius:6px;border:1px solid var(--rule)">` : H.empty("Image bytes are not on this device.", ""); }); }
    else if (f.kind === "video") { S5.blobs.url(f.blobKey, f.assetId).then((u) => { host.innerHTML = u ? `<video src="${u}" controls style="max-width:100%"></video>` : H.empty("Not on this device.", ""); }); }
    else host.innerHTML = H.empty("No preview for this file type.", "The original is stored; export it from a backup.");
  });
  return `<div class="crumbs"><button data-act="back">← Back</button></div>
    <div class="page-head"><div class="titles"><span class="eyebrow">${f.kind.toUpperCase()} · ${S5.fmtBytes(f.size)} · original unchanged · sha256 ${f.hash.slice(0, 12)}${annots ? ` · ${annots} annotated page(s)` : ""}</span><h2 dir="auto">${S5.esc(f.name)}</h2></div>
    <div class="row">${f.kind === "image" ? H.btn("Mark up a copy", "img-markup", { id: f.id }, "sm") : ""}${H.btn("File it", "edit", { type: "file", id: f.id }, "sm")}${H.btn("Capture", "capture", { subject: f.subjectId || "", project: f.projectId || "" }, "sm")}</div></div>
    <div id="file-host" class="${f.kind === "pdf" ? "pane" : ""}" style="${f.kind === "pdf" ? "height:calc(100dvh - 200px);min-height:420px" : ""}"></div>`;
};
S5.act["img-markup"] = async (el) => { const f = S5.store.get(el.dataset.id); let nb = S5.store.list("notebook", (n) => n.refFileId === f.id)[0]; if (!nb) nb = await S5.store.create("notebook", { title: `Markup — ${f.name}`, subjectId: f.subjectId || "", projectId: f.projectId || "", template: "blank", refFileId: f.id, pages: [] }); S5.ui.go({ v: "notebook", id: nb.id }); };
S5.act.upload = async (el) => {
  const files = await S5.ui.pickFile("application/pdf,image/*,video/*", true); if (!files.length) return;
  let last;
  for (const f of files) { if (f.size > 200 * 1048576) { S5.ui.toast(`${f.name} is larger than 200 MB — keep it in your Windows workspace instead.`, true); continue; } last = await S5.intakeFile(f, { subjectId: el.dataset.subject || "", projectId: el.dataset.project || "", library: !!el.dataset.library }); }
  if (last && el.dataset.lecture) { await S5.store.update(el.dataset.lecture, { fileId: last.id }); S5.ui.render(); }
  S5.ui.toast(files.length > 1 ? `${files.length} files added` : "File added");
};

/* ---------- notebooks ---------- */
S5.notebookPage = (nb, idx) => {
  let ids = [...(nb.pages || [])];
  const existing = ids[idx] && S5.store.raw(ids[idx]);
  if (existing) return existing;
  const pg = { id: S5.uid("ink"), type: "inkpage", notebookId: nb.id, title: `${nb.title} · p.${idx + 1}`, strokes: [], layers: [{ n: "Layer 1", v: true }], template: nb.template || "blank", width: 1000, height: 1414, createdAt: S5.now(), subjectId: nb.subjectId || "", projectId: nb.projectId || "", rev: 0 };
  S5.store.put(pg, { silent: true }); ids[idx] = pg.id; nb.pages = ids; S5.store.update(nb.id, { pages: ids });
  return pg;
};
S5.act["new-notebook"] = (el) => S5.ui.edit("notebook", { subjectId: el.dataset.subject || "", projectId: el.dataset.project || "", template: "ruled", pages: [] }, { onSave: (nb) => S5.ui.go({ v: "notebook", id: nb.id }) });
S5.views.notebook = (r) => {
  const nb = S5.store.get(r.id); if (!nb) return H.empty("Notebook not found", "");
  const idx = S5.clamp(r.page ?? nb.cur ?? 0, 0, Math.max(0, (nb.pages || []).length));
  const page = S5.notebookPage(nb, idx); const n = Math.max(1, (nb.pages || []).length);
  S5.setPlace(`${nb.title} p.${idx + 1}`, { v: "notebook", id: nb.id, page: idx });
  if (nb.cur !== idx) S5.store.update(nb.id, { cur: idx });
  S5.ui.mount(() => {
    let ink; const host = document.getElementById("nb-ink");
    const start = (refUrl) => { ink = new S5.Ink(host, { doc: page, refUrl, refAlpha: 0.9 }); };
    if (nb.refFileId) { const f = S5.store.get(nb.refFileId); S5.blobs.url(f?.blobKey, f?.assetId).then((u) => start(u || null)); } else start(null);
    return () => ink && ink.destroy();
  });
  return `<div class="crumbs"><button data-act="back">← Back</button>${nb.subjectId ? ` / <button data-act="open" data-v="subject" data-id="${nb.subjectId}">${H.subj(nb.subjectId)}</button>` : ""}${nb.projectId ? ` / <button data-act="open" data-v="project" data-id="${nb.projectId}">${S5.esc(S5.store.get(nb.projectId)?.name || "")}</button>` : ""}</div>
    <div class="row between" style="margin:8px 0"><h3 dir="auto">${S5.esc(nb.title)}</h3><div class="row">${H.btn("‹", "open", { v: "notebook", id: nb.id, page: Math.max(0, idx - 1) }, "sm")}<span class="mono small">p. ${idx + 1} / ${n}</span>${H.btn("›", "open", { v: "notebook", id: nb.id, page: Math.min(n - 1, idx + 1) }, "sm")}${H.btn("+ Page", "open", { v: "notebook", id: nb.id, page: n }, "sm")}${H.btn("Edit", "edit", { type: "notebook", id: nb.id }, "sm ghost")}</div></div>
    <div id="nb-ink" class="ink-wrap" style="height:calc(100dvh - 190px);min-height:440px"></div>`;
};
S5.views["notebook-page"] = (r) => {
  const pg = S5.store.get(r.id); if (!pg) return H.empty("Page not found", "");
  S5.ui.mount(() => { const ink = new S5.Ink(document.getElementById("pg-ink"), { doc: pg }); return () => ink.destroy(); });
  return `<div class="crumbs"><button data-act="back">← Back</button></div><h3 style="margin:8px 0" dir="auto">${S5.esc(pg.title || "Ink page")}</h3><div id="pg-ink" class="ink-wrap" style="height:calc(100dvh - 190px);min-height:440px"></div>`;
};

S5.healthHTML = () => S5.health.report().map((i) => H.item({ lead: i.level === "ok" ? "green" : i.level === "warn" ? "amber" : "red", t: S5.esc(i.k), s: S5.esc(i.v) })).join("");
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.setting) { const k = t.dataset.setting; const v = t.type === "checkbox" ? t.checked : t.type === "number" ? +t.value : k === "weekStart" ? +t.value : t.value; await S5.settings.set(k, v); if (k === "theme") S5.applyTheme(); S5.ui.toast("Saved"); }
  if (t.dataset.flag) { const f = { ...(S5.settings.get("flags") || {}) }; if (t.value === "") delete f[t.dataset.flag]; else f[t.dataset.flag] = t.value === "on"; await S5.settings.set("flags", f); }
});
S5.applyTheme = () => { const th = S5.settings.get("theme"); if (th === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", th); };
S5.act["safe-on"] = async () => { await S5.settings.set("safeMode", true); await S5.settings.set("backupEveryDays", 1); await S5.store.snapshot("Safe Mode turned on"); S5.ui.toast("Safe Mode on"); };
S5.act["safe-off"] = async () => { await S5.settings.set("safeMode", false); await S5.settings.set("backupEveryDays", 7); S5.ui.toast("Safe Mode off"); };
S5.act["backup-export"] = async (el) => {
  const out = document.getElementById("bk-out"); out.innerHTML = `<p class="small muted" style="margin-top:8px">Building backup…</p>`;
  try { const pkg = await S5.backup.build({ includeFiles: !el.dataset.nofiles }); const json = JSON.stringify(pkg); const name = `studio5-backup-${S5.todayISO()}${el.dataset.nofiles ? "-nofiles" : ""}.json`;
    const ok = await S5.ui.saveFile(name, new Blob([json], { type: "application/json" }));
    if (ok) { await S5.store.setMeta("lastBackupAt", S5.now()); S5.audit("backup", `Exported ${pkg.counts.records} records, ${pkg.counts.files} files (${S5.fmtBytes(json.length)})`); }
    out.innerHTML = `<p class="small" style="margin-top:8px">${ok ? "✓ Saved" : "Not saved"} · ${pkg.counts.records} records · ${pkg.counts.files} files · ${S5.fmtBytes(json.length)} · checksum <span class="mono">${pkg.checksum.slice(0, 16)}</span></p>`;

// ---- remote.js ----
/* Laptop remote — the phone side of Studio5 Remote Work Orchestration.
   Talks to the Studio5 Companion on your laptop through your own relay (same site, /api).
   End-to-end encrypted: ECDH P-256 → HKDF-SHA256 → AES-GCM, with timestamps + nonces against replay.
   The pairing secret stays on this device (not synced, not in backups). */
S5.remote = {
  ws: null, state: "off", laptopOnline: false, info: null, status: null, pending: new Map(), seq: 0, key: null, seen: new Map(), retry: 1000, available: null,
  get pair() { return S5.store.meta.remote || null; },
  log(action, ok, note) { const l = [{ at: S5.now(), action, ok, note: note || "" }, ...(S5.store.meta.remoteLog || [])].slice(0, 300); S5.store.meta.remoteLog = l; S5.idb.put("meta", "remoteLog", l).catch(() => {}); },
  async checkAvailable() {
    if (this.available != null) return this.available;
    if (!S5.standalone || !/^https?:$/.test(location.protocol)) return (this.available = false);
    try { const r = await fetch("/api/health", { cache: "no-store" }); this.available = r.ok && (await r.json()).service === "studio5-relay"; } catch { this.available = false; }
    return this.available;
  },
  /* crypto */
  b64(buf) { return S5.b64FromBuf(buf instanceof ArrayBuffer ? buf : buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength)); },
  unb64(s) { return new Uint8Array(S5.bufFromB64(s)); },
  async deriveKey(privJwk, peerPub, device) {
    const s = crypto.subtle;
    const priv = await s.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
    const peer = await s.importKey("raw", this.unb64(peerPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
    const bits = await s.deriveBits({ name: "ECDH", public: peer }, priv, 256);
    const hk = await s.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
    return s.deriveKey({ name: "HKDF", hash: "SHA-256", salt: new TextEncoder().encode(device), info: new TextEncoder().encode("studio5-remote-v1") }, hk, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  },
  async checkCode(aPub, bPub) { const a = this.unb64(aPub), b = this.unb64(bPub); const all = new Uint8Array(a.length + b.length); all.set(a); all.set(b, a.length); const h = new Uint8Array(await crypto.subtle.digest("SHA-256", all)); const n = ((h[0] << 16) | (h[1] << 8) | h[2]) % 1000000; return String(n).padStart(6, "0").replace(/(\d\d)(\d\d)(\d\d)/, "$1 $2 $3"); },
  async seal(body, queue) { const iv = crypto.getRandomValues(new Uint8Array(12)); const n = [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, "0")).join(""); const pt = new TextEncoder().encode(JSON.stringify({ ts: Date.now(), n, from: "phone", body })); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, this.key, pt); return { t: "msg", iv: this.b64(iv), ct: this.b64(ct), queue: !!queue }; },
  async open(env) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: this.unb64(env.iv) }, this.key, this.unb64(env.ct)); const m = JSON.parse(new TextDecoder().decode(pt)); if (m.from !== "laptop") throw new Error("direction"); if (Math.abs(Date.now() - m.ts) > 120000) throw new Error("stale"); if (this.seen.has(m.n)) throw new Error("replay"); this.seen.set(m.n, 1); if (this.seen.size > 2000) this.seen.clear(); return m.body; },
  /* pairing */
  async claim(code) {
    const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    const pub = this.b64(await crypto.subtle.exportKey("raw", kp.publicKey)); const priv = await crypto.subtle.exportKey("jwk", kp.privateKey);
    const r = await fetch("/api/pair/claim", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: String(code).replace(/\D/g, ""), pub }) }).then((x) => x.json());
    if (r.error) throw new Error(r.error);
    const check = await this.checkCode(r.laptopPub, pub);
    await S5.store.setMeta("remote", { device: r.device, token: r.token, name: r.name, laptopPub: r.laptopPub, pub, priv, check, pairedAt: S5.now(), confirmed: false });
    this.key = null; this.connect();
    return check;
  },
  async unpair() { try { this.ws && this.ws.close(); } catch {} this.ws = null; this.key = null; this.state = "off"; await S5.store.setMeta("remote", null); S5.audit("remote", "Laptop unpaired on this phone"); },
  async connect() {
    const p = this.pair; if (!p || !(await this.checkAvailable())) return;
    if (this.ws && this.ws.readyState <= 1) return;
    this.key = this.key || (await this.deriveKey(p.priv, p.laptopPub, p.device));
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = (this.ws = new WebSocket(`${proto}//${location.host}/api/ws?device=${p.device}&role=phone&token=${p.token}`));
    this.state = "connecting"; this.emit();
    ws.onopen = () => { this.state = "online"; this.retry = 1000; this.emit(); this.hello(); };
    ws.onmessage = async (ev) => {
      let env; try { env = JSON.parse(ev.data); } catch { return; }
      if (env.t === "presence") { const was = this.laptopOnline; this.laptopOnline = env.laptop; this.emit(); if (env.laptop && !was) this.hello(); return; }
      if (env.t === "queued") { S5.ui.toast("Laptop is offline — queued, it runs when the laptop connects"); return; }
      if (env.t !== "msg") return;
      let body; try { body = await this.open(env); } catch { return; }
      if (body.hello && this.pair && !this.pair.confirmed) { await S5.store.setMeta("remote", { ...this.pair, confirmed: true }); S5.ui.toast("Laptop accepted the pairing"); this.hello(); this.emit(); return; }
      const w = this.pending.get(body.re); if (!w) return;
      if (body.partial) { w.onPartial && w.onPartial(body.data); return; }
      this.pending.delete(body.re); clearTimeout(w.timer);
      body.ok ? w.res(body.data) : w.rej(new Error(body.error || "failed"));
    };
    ws.onclose = () => { this.state = "offline"; this.laptopOnline = false; this.emit(); if (this.pair) setTimeout(() => this.connect(), this.retry); this.retry = Math.min(this.retry * 2, 20000); };
  },
  async hello() { try { this.info = await this.send("hello", {}, { quiet: true, timeout: 8000 }); if (this.pair && !this.pair.confirmed) await S5.store.setMeta("remote", { ...this.pair, confirmed: true }); this.status = await this.send("sys.status", {}, { quiet: true }).catch(() => null); this.emit(); } catch {} },
  send(action, args = {}, { onPartial, timeout = 20000, quiet, queue } = {}) {
    return new Promise(async (res, rej) => {
      if (!this.ws || this.ws.readyState !== 1 || !this.key) return rej(new Error("Not connected to the relay"));
      if (!this.laptopOnline && !queue) return rej(new Error("The laptop is offline. Start Studio5 Companion on it."));
      const id = "c" + ++this.seq + "_" + Date.now().toString(36);
      const timer = setTimeout(() => { if (this.pending.has(id)) { this.pending.delete(id); rej(new Error("No answer from the laptop")); } }, timeout);
      this.pending.set(id, { res: (d) => { if (!quiet) this.log(action, true); res(d); }, rej: (e) => { if (!quiet) this.log(action, false, e.message); rej(e); }, onPartial, timer });
      try { this.ws.send(JSON.stringify(await this.seal({ id, action, args }, queue))); } catch (e) { this.pending.delete(id); clearTimeout(timer); rej(e); }
    });
  },
  fire(action, args) { this.send(action, args, { quiet: true, timeout: 5000 }).catch(() => {}); },
  emit: S5.debounce(() => { if (S5.ui.route.v === "remote") S5.remote.refreshStatus(); S5.ui.renderChrome && S5.ui.renderChrome(); }, 60),
  refreshStatus() { const el = document.getElementById("rm-status"); if (el) el.innerHTML = S5.remoteStatusHTML(); },
  /* file transfer */
  async fetchFile(path, onProgress) {
    const parts = []; let meta = null;
    await this.send("file.get", { path }, { timeout: 300000, onPartial: (d) => { parts[d.i] = d.chunk; meta = d; onProgress && onProgress(d.i + 1, d.total); } });
    const bytes = parts.map((p) => this.unb64(p)); return new File(bytes, meta?.name || path.split(/[\\/]/).pop(), { type: S5.mimeOf(meta?.name || path) });
  },
  async putFile(file, onProgress) {
    const buf = new Uint8Array(await file.arrayBuffer()); const size = 300000; const total = Math.ceil(buf.length / size) || 1; const uid = S5.uid("up"); let last;
    for (let i = 0; i < total; i++) { last = await this.send("file.put", { uid, name: file.name, i, total, chunk: this.b64(buf.slice(i * size, (i + 1) * size)) }, { timeout: 60000, quiet: i < total - 1 }); onProgress && onProgress(i + 1, total); }
    return last;
  },
};
S5.mimeOf = (n) => ({ pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", mp4: "video/mp4", txt: "text/plain", csv: "text/csv", json: "application/json" }[(n.split(".").pop() || "").toLowerCase()] || "application/octet-stream");
S5.remoteStatusHTML = () => {
  const r = S5.remote, p = r.pair, st = r.status;
  if (!p) return "";

S5.bindTouchpad = (el) => {
  if (!el) return; const R = S5.remote; const pts = new Map(); let acc = { x: 0, y: 0 }, sc = 0, t0 = 0, moved = 0, maxP = 0, dragging = false, lastTap = 0, lp = null, flushT = null;
  const speed = () => +(document.getElementById("rm-speed")?.value || 2.5);
  const flush = () => { flushT = null; if (Math.abs(acc.x) >= 1 || Math.abs(acc.y) >= 1) { R.fire("mouse.move", { dx: acc.x, dy: acc.y }); acc = { x: 0, y: 0 }; } if (Math.abs(sc) >= 1) { R.fire("mouse.scroll", { dy: -Math.round(sc) * 3 }); sc = 0; } };
  const q = () => { if (!flushT) flushT = setTimeout(flush, 30); };
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); maxP = Math.max(maxP, pts.size); if (pts.size === 1) { t0 = Date.now(); moved = 0; lp = setTimeout(() => { if (moved < 8) { dragging = true; R.fire("mouse.down"); el.style.outline = "2px solid var(--cobalt)"; } }, 550); } });
  el.addEventListener("pointermove", (e) => {
    const p = pts.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if (pts.size >= 2) { sc += dy / 8; q(); return; }
    const v = Math.hypot(dx, dy); const k = speed() * (1 + Math.min(v, 40) / 14); acc.x += dx * k; acc.y += dy * k; q();
  });
  const end = (e) => {
    pts.delete(e.pointerId); clearTimeout(lp); if (pts.size) return;
    const dt = Date.now() - t0;
    if (dragging) { dragging = false; R.fire("mouse.up"); el.style.outline = ""; }
    else if (moved < 10 && dt < 250) { if (maxP >= 2) R.fire("mouse.click", { button: "right" }); else { const now = Date.now(); if (now - lastTap < 300) R.fire("mouse.click", { button: "left", double: true }); else setTimeout(() => { if (Date.now() - lastTap >= 290) R.fire("mouse.click", { button: "left" }); }, 300); lastTap = now; } }
    maxP = 0; flush();
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  document.getElementById("rm-speed")?.addEventListener("input", (e) => S5.ls.set("rmSpeed", +e.target.value));
};
S5.rmShot = async () => {
  const img = document.getElementById("rm-screen"); if (!img) return;
  try { const d = await S5.remote.send("screen.shot", { width: Math.min(1600, Math.round(window.innerWidth * (window.devicePixelRatio || 1))), quality: S5.rmLive ? 45 : 65 }, { quiet: true, timeout: 20000 }); img.src = "data:image/jpeg;base64," + d.jpeg; img.dataset.sw = d.sw; img.dataset.sh = d.sh; const i = document.getElementById("rm-shot-info"); if (i) i.textContent = `${d.sw}×${d.sh} · ${new Date().toTimeString().slice(0, 8)}`; }
  catch (e) { S5.ui.toast(e.message, true); S5.rmLive = false; }
  if (!img.dataset.bound) { img.dataset.bound = 1; img.addEventListener("click", (e) => { if (!document.getElementById("rm-tapclick")?.checked) return; const r = img.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width) * +img.dataset.sw, y = ((e.clientY - r.top) / r.height) * +img.dataset.sh; S5.remote.send("mouse.to", { x, y }, { quiet: true }).then(() => S5.remote.send("mouse.click", { button: "left" }, { quiet: true })).then(() => setTimeout(S5.rmShot, 400)).catch((er) => S5.ui.toast(er.message, true)); }); }

};

S5.runJob = async (id) => {
  const j = S5.store.get(id); const upd = (patch) => S5.store.update(id, patch);
  const m = S5.ui.modal(`Job: ${j.title}`, `<div id="job-steps" class="list"></div>`, { footer: `<button class="btn" data-close>Close</button>` });
  const box = m.el.querySelector("#job-steps"); const add = (t, lead = "cobalt") => box.insertAdjacentHTML("beforeend", H.item({ lead, t }));
  try {
    await upd({ state: "queued" }); add("Sent to the laptop");
    const res = await S5.remote.send("job.run", { job: { id: j.id, kind: j.kind || "open", app: j.app, fileRef: j.fileRef, ext: j.ext } }, { timeout: 180000, onPartial: (d) => { if (d.checks) d.checks.forEach(([n, ok]) => add((ok ? "✓ " : "✗ ") + S5.esc(n), ok ? "green" : "red")); else add(S5.esc(d.state) + (d.reason ? " — " + S5.esc(d.reason) : ""), d.state === "failed" ? "red" : "cobalt"); upd({ state: d.state }); } });
    if (res.artifact) { add("Bringing the result to your Library…"); const f = await S5.remote.fetchFile(res.artifact); const rec = await S5.intakeFile(f, { projectId: j.projectId || "", library: !j.projectId, source: "laptop job" }); if (j.versionId) await S5.link(rec.id, "GENERATED_FROM", j.versionId); await upd({ state: "done", result: rec.name, resultFileId: rec.id }); add("✓ " + S5.esc(rec.name) + " saved", "green"); }
    else { await upd({ state: "done" }); add("✓ Done", "green"); }
  } catch (e) { await upd({ state: "failed", result: e.message }); add("✗ " + S5.esc(e.message), "red"); }
};

// ---- i18n.js ----
/* Bilingual interface (English / العربية). The interface is written in English and translated in place:
   every text node and placeholder/title is looked up in the dictionary (numbers are matched as #).
   User content is never touched: anything inside [dir="auto"], .verbatim, .ai-out, inputs or [data-noi18n]. */
S5.I18N_AR = typeof S5_I18N_PENDING !== "undefined" ? S5_I18N_PENDING : {};
S5.i18n = {
  dict: null,
  lang() { const l = S5.settings.get("lang"); return l === "en" || l === "ar" ? l : (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "ar"; },
  build() {
    if (this.dict) return this.dict;
    const d = Object.assign({}, S5.I18N_AR || {});
    for (const c of S5.CURRICULUM) d[c[3]] = c[2];
    for (const c of S5.CIVIL || []) d[c[3]] = c[2];
    for (const y of S5.YEARS) d[y.name] = y.ar;
    for (const y of S5.YEARS_CIVIL || []) d[y.name] = y.ar;
    for (const p of Object.values(S5.PROGRAMS || {})) d[p.name] = p.ar;
    for (const [k, v] of Object.entries(S5.PROFILES)) if (!d[v.label]) d[v.label] = v.label;
    for (const [k, v] of Object.entries({ ...d })) if (/\d/.test(k)) d[k.replace(/\d+(?:[.,]\d+)?/g, "#")] = v;
    return (this.dict = d);
  },
  PREFIX: [["Formula: ", "المعادلة: "], ["Next: ", "التالي: "], ["why: ", "السبب: "], ["affects: ", "يؤثر على: "], ["error: ", "الخطأ: "], ["packs: ", "الحزم: "], ["Tools that switch on with this year: ", "أدوات هذه السنة: "], ["Next time focus on: ", "المرة القادمة ركّز على: "], ["Now in timetable: ", "الآن بالجدول: "], ["from ", "من "], ["est. ", "تقدير "], ["actual ", "فعلي "], ["Stage: ", "المرحلة: "], ["Opening ", "فتح "], ["Added to Library: ", "أضيف للمكتبة: "], ["Saved ", "حُفظ "], ["Edit ", "تعديل "], ["New ", "جديد: "], ["Year ", "السنة "], ["Stage ", "المرحلة "], ["Semester ", "الفصل "], ["Due ", "مستحق "], ["Overdue: ", "متأخر: "], ["Due today: ", "مستحق اليوم: "], ["Retry problem: ", "أعد المسألة: "], ["Job: ", "مهمة: "], ["Apply feedback: ", "طبّق الملاحظة: "], ["due ", "الموعد "], ["Project: ", "مشروع: "], ["L1 · ", "م1 · "], ["Last full backup ", "آخر نسخة كاملة "], ["restore test ", "اختبار استعادة "], ["records", "سجلات"], ["Not ready: ", "غير جاهز: "], ["Explanation failed twice: ", "فشل الشرح مرتين: "], ["Enter the result for ", "أدخل نتيجة "], ["Last full backup was ", "آخر نسخة كاملة كانت "], ["output: ", "المخرَج: "], ["Next time focus on: ", "المرة القادمة ركّز على: "], ["Selected: ", "المحدد: "]],
  tr(text) {
    const t = text.trim(); if (!t || !/[A-Za-z]{2}/.test(t)) return null;
    const d = this.build();
    const one = (s) => {
      if (!s) return s;
      const nums = s.match(/\d+(?:[.,]\d+)?/g) || []; const key = s.replace(/\d+(?:[.,]\d+)?/g, "#");
      if (d[key] != null) { let i = 0; return d[key].replace(/#/g, () => (nums[i] != null ? nums[i++] : "#")); }
      return null;
    };
    let r = one(t); if (r != null) return text.replace(t, r);
    const parts = (sep) => { const ps = t.split(sep); if (ps.length < 2) return null; const out = ps.map((p) => one(p.trim()) ?? this.prefixed(p.trim(), one) ?? p.trim()); return out.join(sep); };
    r = parts(" · ") ?? this.prefixed(t, one) ?? parts(" — ") ?? parts(" / ");
    return r != null && r !== t ? text.replace(t, r) : null;
  },
  prefixed(t, one) { for (const [en, ar] of this.PREFIX) if (t.startsWith(en)) { const rest = t.slice(en.length); return ar + (one(rest) ?? rest); } return null; },
  skip(el) { return !el || el.closest('.verbatim,.ai-out,[data-noi18n],[data-uc],textarea,script,style,.ink-stage,.clock'); },
  apply(root) {
    const ar = this.lang() === "ar";
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; const nodes = [];
    while ((n = w.nextNode())) nodes.push(n);
    for (const node of nodes) {
      const p = node.parentElement; if (this.skip(p)) continue;

  },
  setDir() { const ar = this.lang() === "ar"; document.documentElement.lang = ar ? "ar" : "en"; document.documentElement.dir = ar ? "rtl" : "ltr"; },
  start() {
    this.setDir();
    let q = new Set(), sched = false;
    const run = () => { sched = false; const roots = [...q]; q = new Set(); for (const r of roots) if (r.isConnected) this.apply(r); };
    this.mo = new MutationObserver((ms) => {

  },

};
S5.locale = () => (S5.i18n.lang() === "ar" ? "ar-IQ-u-nu-latn" : "en-GB");
S5.fmtDate = (iso) => { if (!iso) return ""; const d = new Date(iso.length <= 10 ? iso + "T12:00:00" : iso); return d.toLocaleDateString(S5.locale(), { day: "numeric", month: "short", year: d.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined }); };
S5.fmtDateTime = (iso) => (iso ? new Date(iso).toLocaleString(S5.locale(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "");
S5.act.lang = () => S5.i18n.toggle();

// ---- main.js ----
/* Boot, event delegation, live re-rendering. */
// Standalone = served from its own site (Cloudflare), not inside a claude.ai artifact viewer.
S5.standalone = !(window.claude && typeof window.claude.use === "function");
if (S5.standalone && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("./sw.js").catch(() => {});
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); S5.installPrompt = e; S5.rerender && S5.rerender(); });
window.addEventListener("appinstalled", () => { S5.installPrompt = null; S5.ui.toast("Studio5 installed on this computer"); });
S5.act.install = async () => { const p = S5.installPrompt; if (!p) return; p.prompt(); try { await p.userChoice; } catch {} S5.installPrompt = null; S5.ui.render(); };
S5.LIVE = new Set(["notebook", "notebook-page", "drill", "file", "focus", "mock", "tool", "remote"]);
S5.ui.isLive = () => { const r = S5.ui.route; return S5.LIVE.has(r.v) || (r.v === "lecture" && (r.tab || "capture") === "capture") || (r.v === "library" && r.tab === "council"); };
S5.act.go = (el) => S5.ui.go(el.dataset.v);
S5.act.back = () => S5.ui.back();
S5.act.open = (el) => {
  const d = el.dataset; const route = { v: d.v };
  if (d.id) route.id = d.id; if (d.tab) route.tab = d.tab; if (d.kind) route.kind = d.kind; if (d.calc) route.calc = d.calc;
  if (d.page !== undefined && d.page !== "") route.page = +d.page;
  const cur = S5.ui.route; const same = cur.v === route.v && cur.id === route.id;
  S5.ui.go(route, same && (route.tab !== undefined || route.page !== undefined));
};
S5.act.edit = (el) => { const r = S5.store.get(el.dataset.id); if (r) S5.ui.edit(el.dataset.type || r.type, r); };
S5.act.new = (el) => { let defaults = {}; try { defaults = el.dataset.defaults ? JSON.parse(el.dataset.defaults) : {}; } catch {} const r = S5.ui.route; if (!defaults.subjectId && r.v === "subject") defaults.subjectId = r.id; if (!defaults.projectId && r.v === "project" && S5.SCHEMA[el.dataset.type].fields.some((f) => f.k === "projectId")) defaults.projectId = r.id; S5.ui.edit(el.dataset.type, defaults); };
S5.act.capture = (el) => S5.openCapture({ subjectId: el.dataset.subject, projectId: el.dataset.project, kind: el.dataset.kind });
S5.act["dismiss-recovered"] = () => { S5.store.recovered = false; S5.ui.renderChrome(); };

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.tagName === "LABEL" || (el.tagName === "INPUT" && el.type === "checkbox")) return;
  if (e.target.closest("select,input,textarea") && e.target.closest("[data-act]") === el && el.classList.contains("item") && e.target !== el) return;
  const f = S5.act[el.dataset.act]; if (!f) return;
  e.preventDefault();
  try { const p = f(el, e); if (p && p.catch) p.catch((err) => { console.error(err); S5.ui.toast(err.message || "Something went wrong", true); }); } catch (err) { console.error(err); S5.ui.toast(err.message || "Something went wrong", true); }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.actChange === "lec-pdf") { await S5.store.update(t.dataset.id, { fileId: t.value }); S5.ui.render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (document.querySelector(".scrim")) return;
  if (e.key === "c" && !e.ctrlKey && !e.metaKey && !S5.ui.isLive()) { e.preventDefault(); S5.openCapture(); }
  if (e.key === "/") { e.preventDefault(); document.getElementById("gsearch")?.focus(); }
});
/* thumbnails for images stored as blobs */
S5.fillThumbs = () => document.querySelectorAll("img[data-blob]:not([src])").forEach(async (img) => { const f = S5.store.get(img.dataset.blob); if (!f) return; const u = await S5.blobs.url(f.blobKey, f.assetId); if (u) img.src = u; });
const _render = S5.ui.render.bind(S5.ui);
S5.ui.render = function () { _render(); setTimeout(S5.fillThumbs, 0); };
/* re-render on data change, except views that hold live editors (they refresh themselves) */
S5.rerender = S5.debounce(() => { if (document.querySelector(".scrim")) { S5.pendingRender = true; return; } if (S5.ui.isLive()) S5.ui.renderChrome(); else { const y = window.scrollY; S5.ui.render(); window.scrollTo(0, y); } }, 120);
S5.bus.on("change", () => S5.rerender());
S5.bus.on("settings", () => { S5.applyTheme(); S5.rerender(); });
S5.bus.on("sync", () => { if (!document.querySelector(".scrim")) S5.ui.renderChrome(); });
S5.bus.on("ai", () => S5.rerender());
new MutationObserver(() => { if (S5.pendingRender && !document.querySelector(".scrim")) { S5.pendingRender = false; S5.rerender(); } }).observe(document.getElementById("modal-root"), { childList: true });

(async function boot() {
  try {
    await S5.store.init();
    S5.applyTheme();
    await S5.seedCurriculum();
    await S5.seedCivil();
    if (!S5.store.meta.demoSeeded && !S5.store.meta.demoCleared && !S5.store.list("slot").length) await S5.seedDemo();
    // daily automatic snapshot (device-local recovery point)
    const snaps = S5.store.meta.snapshots || [];
    if (!snaps.length || S5.daysBetween(snaps[0].at.slice(0, 10), S5.todayISO()) >= 1) S5.store.snapshot("Daily automatic snapshot");
    const h = (location.hash || "").replace("#", "");
    S5.ui.route = { v: S5.views[h] && ["today", "study", "projects", "practice", "library", "system", "remote"].includes(h) ? h : "today" };
    S5.ui.render();
    S5.i18n.start();
    S5.sync.init();
    if (S5.standalone && S5.store.meta.remote) S5.remote.connect();
    S5.ai.init();
    S5.health.refresh();
    window.addEventListener("hashchange", () => { const v = location.hash.replace("#", ""); if (v && v !== S5.ui.route.v && S5.views[v]) S5.ui.go(v, true); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") S5.rerender(); });
  } catch (e) {
    console.error(e);
    document.getElementById("view").innerHTML = `<div class="sheet alert"><h3>Studio5 could not start</h3><p class="small">${S5.esc(e.message)}</p><p class="small muted">Your data is not deleted. Reload the page; if this repeats, open it in a normal (not private) browser window.</p></div>`;
  }
})();

</script>
