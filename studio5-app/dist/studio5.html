<title>Studio5</title>
<meta name="theme-color" content="#1f3a68">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* Layout: drafting-table studio. Left tool rail on tablet/desktop, bottom tab bar on phone.
   Paper sheets on a cool graphite table; blueprint cobalt marks what you can act on,
   redline marks what needs attention (professor feedback, risk). */
:root {
  --table: #e9ebe7;        /* the desk under the sheets */
  --paper: #fbfbf8;        /* a sheet */
  --paper-2: #f3f4f0;      /* recessed sheet area */
  --ink: #1b2130;          /* main text */
  --graphite: #5a6271;     /* secondary text */
  --rule: #d5d9d2;         /* hairlines */
  --rule-strong: #b9beb6;
  --cobalt: #1f4fa8;       /* blueprint accent */
  --cobalt-wash: #e3eaf7;
  --redline: #b8392a;      /* critical / professor red pen */
  --redline-wash: #f7e4e0;
  --amber: #a26a06;
  --amber-wash: #f6ecd6;
  --green: #2d7a4b;
  --green-wash: #e0f0e5;
  --shadow: 0 1px 0 rgba(20,30,50,.04), 0 2px 8px rgba(20,30,50,.06);
  --f-display: "Archivo", "IBM Plex Sans Arabic", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", Tahoma, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
  --rail-w: 84px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #101419; --paper: #181d25; --paper-2: #1f2530; --ink: #e5e8ee; --graphite: #9aa3b2;
    --rule: #2b3340; --rule-strong: #3b4555; --cobalt: #86a8ff; --cobalt-wash: #1d2a47;
    --redline: #ff8a78; --redline-wash: #3a1f1c; --amber: #e9b552; --amber-wash: #352a14;
    --green: #6fcf97; --green-wash: #16301f; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #101419; --paper: #181d25; --paper-2: #1f2530; --ink: #e5e8ee; --graphite: #9aa3b2;
  --rule: #2b3340; --rule-strong: #3b4555; --cobalt: #86a8ff; --cobalt-wash: #1d2a47;
  --redline: #ff8a78; --redline-wash: #3a1f1c; --amber: #e9b552; --amber-wash: #352a14;
  --green: #6fcf97; --green-wash: #16301f; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--table); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
[dir="rtl"], .ar { font-family: var(--f-ar); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cobalt); }
h1, h2, h3, h4 { font-family: var(--f-display); font-stretch: 88%; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: 1.85rem; font-weight: 750; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 650; }
h4 { font-size: .95rem; font-weight: 650; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; color: var(--graphite); }
.muted { color: var(--graphite); }
.small { font-size: .85rem; }
.tiny { font-size: .75rem; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0,1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 14px 8px; background: var(--paper); border-inline-end: 1px solid var(--rule); }
.rail .mark { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 1.35rem; text-align: center; color: var(--ink); padding: 4px 0 12px; letter-spacing: -.02em; }
.rail .mark span { color: var(--cobalt); }
.navbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px; border: 0; background: none; border-radius: var(--r); color: var(--graphite); cursor: pointer; font-size: .72rem; font-weight: 500; }
.navbtn svg { width: 22px; height: 22px; }
.navbtn:hover { background: var(--paper-2); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--cobalt-wash); color: var(--cobalt); }
.rail .spacer { flex: 1; }
.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: color-mix(in srgb, var(--table) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.search { flex: 1; min-width: 0; max-width: 560px; position: relative; }
.search input { width: 100%; padding-block: 9px; padding-inline: 34px 12px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--paper); }
.search svg { position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--graphite); }
.topbar .chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--rule-strong); background: var(--paper); border-radius: var(--r); cursor: pointer; font-size: .82rem; white-space: nowrap; }
.topbar .chip-btn .count { font-family: var(--f-mono); background: var(--cobalt); color: var(--paper); border-radius: 9px; padding: 0 6px; font-size: .72rem; }
.topbar .chip-btn .count.crit { background: var(--redline); }
.health-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; }
.health-dot.warn { background: var(--amber); } .health-dot.bad { background: var(--redline); }
.view { padding: 22px 24px 120px; min-width: 0; outline: none; }
.boot { padding: 60px 0; color: var(--graphite); font-family: var(--f-mono); }
.banner-slot:empty { display: none; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 9px 24px; background: var(--amber-wash); color: var(--ink); font-size: .85rem; border-bottom: 1px solid var(--rule); }
.banner.safe { background: var(--cobalt-wash); }
.tabbar { display: none; }
.fab { position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--cobalt); color: var(--paper); box-shadow: 0 6px 18px rgba(20,40,90,.35); cursor: pointer; display: grid; place-items: center; }
.fab:active { transform: scale(.96); }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .rail { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--paper); border-top: 1px solid var(--rule); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); }
  .topbar { padding: 8px 16px; }
  .topbar .hide-sm { display: none; }
  .view { padding: 16px 16px 140px; }
  .banner { padding: 9px 16px; }
  .fab { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); right: 16px; }
  h1 { font-size: 1.5rem; }
}

/* ---------- page structures ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head .titles { display: grid; gap: 4px; min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .82rem; color: var(--graphite); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--cobalt); cursor: pointer; font-size: inherit; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .split { grid-template-columns: minmax(0,1fr); } }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1; min-width: 0; }

.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.sheet.flat { box-shadow: none; }
.sheet > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.sheet.now { border-left: 4px solid var(--cobalt); }
.sheet.alert { border-left: 4px solid var(--redline); }
.titleblock { display: grid; grid-template-columns: 1fr auto; border: 1px solid var(--rule-strong); font-family: var(--f-mono); font-size: .72rem; }
.titleblock div { padding: 4px 8px; border-right: 1px solid var(--rule-strong); }
.titleblock div:last-child { border-right: 0; }

.list { display: grid; }
.item { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.item:last-child { border-bottom: 0; }
.item.click { cursor: pointer; }
.item.click:hover { background: var(--paper-2); }
.item .t { font-weight: 500; overflow-wrap: anywhere; }
.item .s { font-size: .8rem; color: var(--graphite); overflow-wrap: anywhere; }
.item .lead { width: 10px; height: 10px; border-radius: 2px; background: var(--rule-strong); }
.item .lead.cobalt { background: var(--cobalt); } .item .lead.red { background: var(--redline); } .item .lead.amber { background: var(--amber); } .item .lead.green { background: var(--green); }
.empty { padding: 18px 4px; color: var(--graphite); font-size: .9rem; }
.empty strong { color: var(--ink); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; font-size: .72rem; font-weight: 500; background: var(--paper-2); color: var(--graphite); border: 1px solid var(--rule); white-space: nowrap; }
.pill.cobalt { background: var(--cobalt-wash); color: var(--cobalt); border-color: transparent; }
.pill.red { background: var(--redline-wash); color: var(--redline); border-color: transparent; }
.pill.amber { background: var(--amber-wash); color: var(--amber); border-color: transparent; }
.pill.green { background: var(--green-wash); color: var(--green); border-color: transparent; }
.pill.demo { background: transparent; border-style: dashed; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; min-height: 38px; border-radius: var(--r); border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink); cursor: pointer; font-weight: 500; font-size: .88rem; white-space: nowrap; }
.btn:hover { border-color: var(--cobalt); }
.btn.primary { background: var(--cobalt); color: var(--paper); border-color: var(--cobalt); }
.btn.danger { color: var(--redline); border-color: var(--redline); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--cobalt); }
.btn.sm { padding: 4px 9px; min-height: 30px; font-size: .8rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule-strong); border-radius: var(--r); overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-size: .84rem; color: var(--graphite); border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--cobalt-wash); color: var(--cobalt); font-weight: 600; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--rule-strong); margin-bottom: 16px; scrollbar-width: thin; }
.tabs button { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--graphite); font-size: .88rem; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cobalt); font-weight: 600; }
.tabs .n { font-family: var(--f-mono); font-size: .7rem; color: var(--graphite); margin-inline-start: 4px; }

.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--f-display); font-stretch: 80%; font-size: 1.8rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: .75rem; color: var(--graphite); }
.meter { height: 6px; background: var(--paper-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--rule); }
.meter > i { display: block; height: 100%; background: var(--cobalt); }
.meter.red > i { background: var(--redline); } .meter.amber > i { background: var(--amber); } .meter.green > i { background: var(--green); }
.ladder { display: flex; gap: 3px; }
.ladder i { flex: 1; height: 6px; border-radius: 2px; background: var(--rule); }
.ladder i.on { background: var(--cobalt); }

table.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th { text-align: start; font-weight: 600; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--graphite); border-bottom: 1px solid var(--rule-strong); padding: 6px 8px; }
.tbl td { border-bottom: 1px solid var(--rule); padding: 7px 8px; vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; }
.tbl-wrap { overflow-x: auto; }
.tbl input, .tbl select { width: 100%; min-width: 60px; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); }

/* ---------- forms & modal ---------- */
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .78rem; font-weight: 600; color: var(--graphite); }
.field input, .field select, .field textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--paper); min-height: 40px; }
.field textarea { min-height: 84px; resize: vertical; }
.field .hint { font-size: .74rem; color: var(--graphite); }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.form-grid .wide { grid-column: 1 / -1; }
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(15,20,30,.45); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--paper); border-radius: 10px; width: min(680px, 100%); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: grid; }
.modal.wide { width: min(1000px, 100%); }
.modal.full { width: 100%; height: calc(100dvh - 32px); max-width: 1400px; }
.modal > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); z-index: 2; }
.modal > .body { padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.modal > footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--rule); position: sticky; bottom: 0; background: var(--paper); }
.x { border: 0; background: none; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--graphite); padding: 4px 8px; }
#toast-root { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 6px; pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: .88rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 90vw; }
@media (max-width: 760px) { #toast-root { bottom: calc(140px + env(safe-area-inset-bottom, 0px)); } }

/* ---------- capture bar ---------- */
.capture-kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; }
.kind { display: grid; gap: 2px; padding: 10px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--paper); cursor: pointer; text-align: start; }
.kind b { font-size: .86rem; }
.kind small { font-size: .7rem; color: var(--graphite); }
.kind[aria-pressed="true"] { border-color: var(--cobalt); background: var(--cobalt-wash); }
.kind.k-gap[aria-pressed="true"], .kind.k-verbatim[aria-pressed="true"] { border-color: var(--redline); background: var(--redline-wash); }

/* ---------- ink ---------- */
.ink-wrap { position: relative; display: grid; grid-template-rows: auto minmax(0,1fr); min-height: 0; height: 100%; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--paper-2); overflow: hidden; }
.ink-tools { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.ink-tools .tb { min-width: 36px; height: 36px; border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer; display: inline-grid; place-items: center; color: var(--ink); font-size: .78rem; padding: 0 6px; }
.ink-tools .tb[aria-pressed="true"] { background: var(--cobalt-wash); border-color: var(--cobalt); color: var(--cobalt); }
.ink-tools .sep { width: 1px; height: 24px; background: var(--rule); margin: 0 4px; }
.ink-tools .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--rule-strong); cursor: pointer; padding: 0; }
.ink-tools .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--cobalt); }
.ink-tools select { height: 32px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font-size: .8rem; }
.ink-stage { position: relative; overflow: hidden; touch-action: none; min-height: 320px; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.ink-stage canvas { position: absolute; left: 0; top: 0; }
.ink-status { position: absolute; right: 8px; bottom: 6px; font-family: var(--f-mono); font-size: .68rem; color: var(--graphite); background: var(--paper); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--rule); pointer-events: none; }
.ink-text-edit { position: absolute; z-index: 5; min-width: 160px; padding: 4px; border: 1px dashed var(--cobalt); background: var(--paper); font: 16px var(--f-body); }

/* ---------- workspace (pdf + notebook split) ---------- */
.workspace { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; height: calc(100dvh - 210px); min-height: 480px; }
.workspace.one { grid-template-columns: minmax(0,1fr); }
.workspace.lec { height: calc(100dvh - 330px); min-height: 420px; }
.pane { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr); gap: 6px; }
@media (max-width: 900px) { .workspace { grid-template-columns: minmax(0,1fr); height: auto; } .workspace .pane { height: 70dvh; } .workspace .pane.hidden-sm { display: none; } }
.pdf-host { position: relative; overflow: auto; background: var(--paper-2); border: 1px solid var(--rule-strong); border-radius: var(--r); }
.pdf-page { position: relative; margin: 12px auto; box-shadow: var(--shadow); background: #fff; }
.pdf-page canvas { display: block; }
.pdf-page .overlay { position: absolute; inset: 0; touch-action: none; }
.pdf-page .overlay canvas { position: absolute; left: 0; top: 0; }

/* ---------- focus timer ---------- */
.focus-screen { display: grid; place-items: center; gap: 18px; padding: 30px 0; text-align: center; }
.clock { font-family: var(--f-display); font-stretch: 70%; font-weight: 300; font-size: clamp(3.5rem, 14vw, 7.5rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

/* ---------- misc ---------- */
.kv { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 4px 14px; font-size: .88rem; }
.kv dt { color: var(--graphite); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.prose { max-width: 68ch; display: grid; gap: 10px; }
.prose p, .ai-out { white-space: pre-wrap; overflow-wrap: anywhere; }
.ai-out { background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; font-size: .92rem; }
.ai-label { font-family: var(--f-mono); font-size: .68rem; color: var(--amber); letter-spacing: .06em; text-transform: uppercase; }
.verbatim { border-left: 3px solid var(--redline); padding: 4px 10px; font-style: normal; background: var(--redline-wash); border-radius: 0 4px 4px 0; }
.week { display: grid; grid-template-columns: 54px repeat(7, minmax(110px, 1fr)); min-width: 860px; font-size: .75rem; }
.week .hd { padding: 6px; font-weight: 600; border-bottom: 1px solid var(--rule-strong); position: sticky; top: 0; background: var(--paper); }
.week .col { position: relative; border-left: 1px solid var(--rule); }
.week .hr { height: 44px; border-bottom: 1px dashed var(--rule); }
.week .slot { position: absolute; left: 3px; right: 3px; background: var(--cobalt-wash); border-left: 3px solid var(--cobalt); border-radius: 3px; padding: 3px 5px; overflow: hidden; cursor: pointer; }
.week .tl { font-family: var(--f-mono); color: var(--graphite); text-align: right; padding-right: 6px; height: 44px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.year-strip { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.year-cell { padding: 10px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--paper); display: grid; gap: 4px; cursor: pointer; text-align: start; min-width: 0; }
.year-cell.active { border-color: var(--cobalt); background: var(--cobalt-wash); }
.year-cell.off { opacity: .7; border-style: dashed; }
@media (max-width: 600px) { .year-strip { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.matrix td, .matrix th { text-align: center; }
.dropzone { border: 2px dashed var(--rule-strong); border-radius: var(--r); padding: 18px; text-align: center; color: var(--graphite); }
.dropzone.over { border-color: var(--cobalt); background: var(--cobalt-wash); }
.thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; border: 1px solid var(--rule); background: var(--paper-2); max-width: 100%; }
.hl { background: var(--amber-wash); color: inherit; padding: 0 2px; border-radius: 2px; }
details.disclose > summary { cursor: pointer; color: var(--cobalt); font-size: .86rem; }
.bar-chart { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(80px, 160px) minmax(0,1fr) 56px; gap: 8px; align-items: center; font-size: .82rem; }
.bar-row .meter { height: 10px; }

body[data-route="remote"] .fab, body[data-route="drill"] .fab, body[data-route="mock"] .fab { display: none; }

/* Arabic interface */
html[lang="ar"] body { font-family: var(--f-ar); }
html[lang="ar"] .eyebrow { letter-spacing: 0; text-transform: none; font-family: var(--f-ar); font-size: .76rem; }
html[lang="ar"] .tbl th { letter-spacing: 0; text-transform: none; }
html[lang="ar"] span.ar[dir="rtl"] { display: none; }
html[dir="rtl"] .tbl td.num, html[dir="rtl"] .tbl th.num { text-align: left; }
html[dir="rtl"] .week .tl { text-align: left; padding-right: 0; padding-left: 6px; }

/* Studio5 Core — local-first record store, typed relations, migrations, sync, backup.
   Every record: {id, type, createdAt, updatedAt, rev, status?, source?, confidence?, deleted?, demo?, noAI?}
   Storage: IndexedDB (records, blobs, meta). Optional cloud mirror through the artifact `db`
   capability (private per-user subtree) and `assets` for file bytes. */
const S5 = (window.S5 = {});
S5.SCHEMA_VERSION = 3;
S5.APP_VERSION = "1.0.0";

/* ---------- small utilities ---------- */
S5.uid = (p = "r") => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
S5.now = () => new Date().toISOString();
S5.esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
S5.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
S5.num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
S5.round = (v, p = 1) => { const m = 10 ** p; return Math.round(v * m) / m; };
S5.todayISO = () => S5.dateISO(new Date());
S5.dateISO = (d) => { const z = new Date(d); return `${z.getFullYear()}-${String(z.getMonth() + 1).padStart(2, "0")}-${String(z.getDate()).padStart(2, "0")}`; };
S5.addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return S5.dateISO(d); };
S5.daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
S5.fmtDate = (iso) => { if (!iso) return ""; const d = new Date(iso.length <= 10 ? iso + "T12:00:00" : iso); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: d.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined }); };
S5.fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
S5.fmtMin = (m) => { m = Math.round(m || 0); if (m < 60) return m + "m"; const h = Math.floor(m / 60), r = m % 60; return h + "h" + (r ? " " + r + "m" : ""); };

S5.ls = { get(k, d) { try { const v = localStorage.getItem("s5:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("s5:" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("s5:" + k); } catch {} } };

/* ---------- event bus ---------- */
S5.bus = { m: new Map(), on(e, f) { (this.m.get(e) || this.m.set(e, new Set()).get(e)).add(f); return () => this.m.get(e).delete(f); }, emit(e, d) { (this.m.get(e) || []).forEach((f) => { try { f(d); } catch (err) { console.error(err); } }); } };

/* ---------- IndexedDB wrapper with memory fallback ---------- */
S5.idb = {
  db: null, mode: "memory", mem: { records: new Map(), blobs: new Map(), meta: new Map() },
  open() {
    return new Promise((resolve) => {
      let req;
      try { req = indexedDB.open("studio5", 1); } catch { return resolve(false); }
      req.onupgradeneeded = () => { const db = req.result; ["records", "blobs", "meta"].forEach((s) => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); }); };

  tx(store, mode, fn) {

  async put(store, key, val) { if (!this.db) { this.mem[store].set(key, val); return; } return this.tx(store, "readwrite", (os) => { os.put(val, key); }); },
  async putMany(store, entries) { if (!this.db) { entries.forEach(([k, v]) => this.mem[store].set(k, v)); return; } return this.tx(store, "readwrite", (os) => { entries.forEach(([k, v]) => os.put(v, k)); }); },
  async del(store, key) { if (!this.db) { this.mem[store].delete(key); return; } return this.tx(store, "readwrite", (os) => { os.delete(key); }); },
  async clear(store) { if (!this.db) { this.mem[store].clear(); return; } return this.tx(store, "readwrite", (os) => { os.clear(); }); },
  async all(store) {

/* ---------- migrations ---------- */
S5.migrations = {
  // v1 -> v2: lectures gain `status`; tasks gain `origin`.
  2(records) { for (const r of records) { if (r.type === "lecture" && !r.status) r.status = r.summary ? "closed" : "captured"; if (r.type === "task" && !r.origin) r.origin = "manual"; } },
  // v2 -> v3: gaps carry an explicit ladder stage (0..5) and attempts array.
  3(records) { for (const r of records) { if (r.type === "gap") { if (typeof r.stage !== "number") r.stage = 0; if (!Array.isArray(r.attempts)) r.attempts = []; } } },
};

/* ---------- the record store ---------- */
S5.store = {
  recs: new Map(),
  meta: {},
  ready: false,
  async init() {
    await S5.idb.open();
    const metaEntries = await S5.idb.all("meta");
    for (const [k, v] of metaEntries) this.meta[k] = v;
    const rows = await S5.idb.all("records");
    let records = rows.map(([, v]) => v);
    const from = this.meta.schemaVersion || (records.length ? 1 : S5.SCHEMA_VERSION);
    if (from < S5.SCHEMA_VERSION && records.length) {
      await this.snapshot(`Before migration v${from}→v${S5.SCHEMA_VERSION}`, records);
      for (let v = from + 1; v <= S5.SCHEMA_VERSION; v++) { if (S5.migrations[v]) S5.migrations[v](records); }
      await S5.idb.putMany("records", records.map((r) => [r.id, r]));
      S5.audit("migration", `Schema v${from} → v${S5.SCHEMA_VERSION} (${records.length} records)`);
    }
    await this.setMeta("schemaVersion", S5.SCHEMA_VERSION);
    for (const r of records) this.recs.set(r.id, r);
    // crash journal: an ink page or text draft that did not reach IndexedDB
    const journal = S5.ls.get("journal", null);
    if (journal && journal.rec) {
      const cur = this.recs.get(journal.rec.id);
      if (!cur || (cur.updatedAt || "") < journal.rec.updatedAt) { await this.put(journal.rec, { silent: true, keepTime: true }); S5.audit("recovery", `Recovered unsaved ${journal.rec.type} from crash journal`); this.recovered = true; }

    this.ready = true;
  },
  async setMeta(k, v) { this.meta[k] = v; await S5.idb.put("meta", k, v); },
  get(id) { const r = this.recs.get(id); return r && !r.deleted ? r : null; },
  raw(id) { return this.recs.get(id) || null; },
  list(type, pred) { const out = []; for (const r of this.recs.values()) if (r.type === type && !r.deleted && (!pred || pred(r))) out.push(r); return out; },
  where(type, field, value) { return this.list(type, (r) => r[field] === value); },
  count(type, pred) { return this.list(type, pred).length; },
  trash() { return [...this.recs.values()].filter((r) => r.deleted); },
  async create(type, fields = {}) {
    const t = S5.now();

    await this.put(rec);
    return rec;
  },
  async update(id, patch) {

    return rec;
  },
  async put(rec, opts = {}) {

    catch (e) { S5.health.lastWriteError = String(e); S5.ui?.toast("Could not save to device storage. Export a backup now.", true); throw e; }

  },
  // soft delete: nothing is purged automatically; Trash keeps it until the user empties it.
  async remove(id) { const r = this.recs.get(id); if (!r) return; await this.put({ ...r, deleted: true, deletedAt: S5.now() }); S5.audit("delete", `${r.type} “${S5.title(r)}” moved to Trash`); },
  async restore(id) { const r = this.recs.get(id); if (!r) return; const c = { ...r }; delete c.deleted; delete c.deletedAt; await this.put(c); },
  async purge(id) { const r = this.recs.get(id); if (!r) return; this.recs.delete(id); await S5.idb.del("records", id); if (r.blobKey) await S5.idb.del("blobs", r.blobKey); S5.sync.removeRemote(id); S5.audit("purge", `${r.type} “${S5.title(r)}” permanently deleted`); },
  // recovery snapshots (records only) kept inside the device, last 6
  async snapshot(reason, records) {
    const list = (await S5.idb.get("meta", "snapshots")) || [];

    const key = "snap_" + Date.now();
    await S5.idb.put("meta", key, data);
    list.unshift({ key, reason, at: S5.now(), count: data.length });

  },
  async restoreSnapshot(key) {

    await S5.idb.putMany("records", data.map((r) => [r.id, r]));
    data.forEach((r) => this.recs.set(r.id, r));

    S5.bus.emit("change", null);
  },
};

/* ---------- blobs (immutable originals) ---------- */
S5.blobs = {
  async put(file) {
    const buf = await file.arrayBuffer();
    const hash = await S5.sha256(buf);
    const key = "b_" + hash.slice(0, 40);
    const existing = await S5.idb.get("blobs", key);
    if (!existing) await S5.idb.put("blobs", key, { mime: file.type || "application/octet-stream", data: buf, size: buf.byteLength, at: S5.now() });
    return { key, hash, size: buf.byteLength, mime: file.type || "application/octet-stream", dup: !!existing };
  },
  async get(key, assetId) {
    let b = await S5.idb.get("blobs", key);
    if (!b && assetId) {
      try { const r = await fetch("/_blob/" + assetId); if (r.ok) { const buf = await r.arrayBuffer(); b = { mime: r.headers.get("content-type") || "", data: buf, size: buf.byteLength, at: S5.now() }; await S5.idb.put("blobs", key, b); } } catch {}
    }
    return b || null;
  },
  async url(key, assetId) { const b = await this.get(key, assetId); return b ? URL.createObjectURL(new Blob([b.data], { type: b.mime })) : null; },
};

/* ---------- intake of a user file → FileRecord ---------- */
S5.intakeFile = async (file, fields = {}) => {
  const info = await S5.blobs.put(file);
  const dup = S5.store.list("file", (r) => r.hash === info.hash)[0];
  if (dup) { S5.ui?.toast(`Already in your library: ${dup.name}`); return dup; }
  const kind = info.mime === "application/pdf" ? "pdf" : info.mime.startsWith("image/") ? "image" : info.mime.startsWith("video/") ? "video" : "other";
  const rec = await S5.store.create("file", { name: file.name, mime: info.mime, size: info.size, hash: info.hash, blobKey: info.key, kind, immutable: true, ...fields });
  S5.sync.uploadBlob(rec);
  return rec;
};

/* ---------- typed relations ---------- */
S5.REL = ["CONTAINS", "APPLIES_TO", "IMPLEMENTS", "PROVES", "GENERATED_FROM", "SEEKS_CLARIFICATION_FROM", "DERIVED_FROM", "SATISFIES", "REFERENCES", "PRACTICES", "SUPERSEDES", "CONFLICTS_WITH"];
S5.link = async (from, rel, to, note) => {
  if (!from || !to || from === to) return null;
  const dup = S5.store.list("link", (l) => l.from === from && l.to === to && l.rel === rel)[0];
  if (dup) return dup;
  return S5.store.create("link", { from, rel, to, note: note || "" });
};
S5.linksOf = (id) => S5.store.list("link", (l) => l.from === id || l.to === id);

/* ---------- audit log (sensitive actions), capped, device-local ---------- */
S5.audit = (kind, text) => {
  const log = S5.store.meta.audit || [];
  log.unshift({ at: S5.now(), kind, text });
  if (log.length > 400) log.length = 400;
  S5.store.meta.audit = log;
  S5.idb.put("meta", "audit", log).catch(() => {});
};

/* ---------- settings ---------- */
S5.settings = {
  defaults: { programs: ["arch", "civil"], activeYear: 1, activeSemester: 1, theme: "system", penOnly: true, aiEnabled: true, aiDailyCap: 60, safeMode: false, dailySessionCap: 4, energyMin: 300, studentName: "", university: "Northern Technical University", city: "Kirkuk", lat: 35.47, flags: {}, backupEveryDays: 7, weekStart: 6 },
  get(k) { const s = S5.store.meta.settings || {}; return k in s ? s[k] : this.defaults[k]; },
  async set(k, v) { const s = { ...(S5.store.meta.settings || {}) }; s[k] = v; await S5.store.setMeta("settings", s); S5.sync.pushSettings(); S5.bus.emit("settings", { k, v }); },
  all() { return { ...this.defaults, ...(S5.store.meta.settings || {}) }; },

/* ---------- cloud mirror (artifact db + assets) ---------- */
S5.sync = {
  db: null, col: null, assets: null, uid: null, state: "local", pending: new Map(), lastSync: null, errors: 0, localOnly: new Set(), unsub: null, flushing: false,
  async init() {
    if (!window.claude || typeof window.claude.use !== "function") { this.state = "local"; return; }
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) { this.state = "local"; S5.bus.emit("sync", this.state); return; }
      const uid = await user.id();
      if (!uid) { this.state = "local"; S5.bus.emit("sync", this.state); return; }
      this.db = db; this.uid = uid; this.col = db.collection("data/users/" + uid);
      this.state = "connecting"; S5.bus.emit("sync", this.state);

      const acked = S5.store.meta.syncAck || {};
      for (const r of S5.store.recs.values()) if ((acked[r.id] || "") < r.updatedAt) this.pending.set(r.id, r);
      this.unsub = this.col.onSnapshot((snap) => this.onRemote(snap), (e) => { this.state = e.code === "revoked" ? "local" : "error"; this.errors++; S5.bus.emit("sync", this.state); });
      this.flush();
    } catch (e) { console.warn("sync init", e); this.state = "local"; S5.bus.emit("sync", this.state); }
    try { this.assets = await window.claude.use("assets"); } catch { this.assets = null; }
  },
  async onRemote(snap) {
    let applied = 0;
    const acked = { ...(S5.store.meta.syncAck || {}) };
    for (const ch of snap.docChanges()) {
      if (ch.type === "removed") continue;
      const d = ch.doc.data(); if (!d) continue;
      if (ch.doc.id === "settings") { if (d.settings && (d.at || "") > (S5.store.meta.settingsAt || "")) { await S5.store.setMeta("settings", d.settings); await S5.store.setMeta("settingsAt", d.at); S5.bus.emit("settings", {}); } continue; }
      if (!d.rec) continue;

      const local = S5.store.recs.get(remote.id);
      if (!local || remote.updatedAt > local.updatedAt) {

          const copy = { ...local, id: S5.uid(local.type.slice(0, 3)), conflictOf: local.id, title: (local.title || local.name || "") + " (conflict copy)", name: local.name ? local.name + " (conflict copy)" : local.name };

  },
  queue(rec) { if (!this.col) { return; } this.pending.set(rec.id, rec); this.flushSoon(); },
  flushSoon: null,
  async flush() {
    if (!this.col || this.flushing) return;
    this.flushing = true;
    const acked = { ...(S5.store.meta.syncAck || {}) };
    try {
      for (const [id, rec] of [...this.pending]) {
        const json = JSON.stringify(rec);
        if (json.length > 240000) { this.localOnly.add(id); this.pending.delete(id); continue; }
        try {
          await this.col.doc(id).set({ rec: json, u: rec.updatedAt, t: rec.type });

  async removeRemote(id) { if (!this.col) return; try { await this.col.doc(id).delete(); } catch {} },
  async pushSettings() { if (!this.col) return; const at = S5.now(); await S5.store.setMeta("settingsAt", at); try { await this.col.doc("settings").set({ settings: S5.store.meta.settings || {}, at }); } catch {} },
  async uploadBlob(rec) {
    if (!this.assets || rec.assetId || !rec.blobKey) return;
    const b = await S5.idb.get("blobs", rec.blobKey); if (!b || b.size > 19 * 1048576) return;
    try { const res = await this.assets.upload(new Blob([b.data], { type: b.mime }), { contentType: b.mime }); await S5.store.update(rec.id, { assetId: res.id }); }
    catch (e) { console.warn("asset upload", e && e.code); }
  },
};
S5.sync.flushSoon = S5.debounce(() => S5.sync.flush(), 1200);

/* ---------- health ---------- */
S5.health = {
  lastWriteError: null, storage: null,
  async refresh() { try { if (navigator.storage?.estimate) this.storage = await navigator.storage.estimate(); } catch {} },
  report() {
    const s = S5.store; const items = [];
    items.push({ k: "Local database", v: S5.idb.mode === "indexeddb" ? `Healthy · ${s.recs.size} records · schema v${s.meta.schemaVersion}` : "Memory only — data is lost when you close this page. Export a backup.", level: S5.idb.mode === "indexeddb" ? "ok" : "bad" });
    if (this.lastWriteError) items.push({ k: "Last write", v: "Failed: " + this.lastWriteError, level: "bad" });
    const sy = S5.sync;
    const syncText = { local: S5.standalone ? "This computer only — move data between devices with Backup → Restore" : "Device only (sign in to mirror to the cloud)", connecting: "Connecting…", synced: `Synced${sy.lastSync ? " · " + S5.fmtDateTime(sy.lastSync) : ""}`, pending: `${sy.pending.size} change(s) waiting`, error: "Sync interrupted — changes stay on this device", full: "Cloud storage full — new records stay local" }[sy.state] || sy.state;
    items.push({ k: "Sync", v: syncText + (sy.localOnly.size ? ` · ${sy.localOnly.size} large record(s) device-only` : ""), level: sy.state === "error" || sy.state === "full" ? "warn" : "ok" });
    const lb = s.meta.lastBackupAt; const every = S5.settings.get("backupEveryDays");
    const age = lb ? S5.daysBetween(lb.slice(0, 10), S5.todayISO()) : null;
    items.push({ k: "Backup", v: lb ? `Last full backup ${S5.relDay(lb.slice(0, 10))}${s.meta.lastRestoreTestAt ? " · restore test " + S5.relDay(s.meta.lastRestoreTestAt.slice(0, 10)) : " · no restore test yet"}` : "No full backup yet", level: lb == null || age > every ? "warn" : "ok" });
    if (this.storage) { const pct = this.storage.quota ? this.storage.usage / this.storage.quota : 0; items.push({ k: "Storage", v: `${S5.fmtBytes(this.storage.usage || 0)} used of ${S5.fmtBytes(this.storage.quota || 0)}`, level: pct > 0.85 ? "bad" : pct > 0.6 ? "warn" : "ok" }); }
    items.push({ k: "AI", v: !S5.settings.get("aiEnabled") ? "Turned off by you" : S5.ai.state === "ready" ? `Available · ${S5.ai.usedToday()} of ${S5.settings.get("aiDailyCap")} requests today` : S5.ai.state === "none" ? (S5.standalone ? "Not available in the installed app — open the claude.ai version for AI" : "Not available in this view — everything else works") : "Checking…", level: "ok" });
    items.push({ k: "Windows companion", v: "Not connected — remote jobs are queued as plans until a companion exists", level: "ok" });
    return items;
  },
  level() { const r = this.report(); return r.some((i) => i.level === "bad") ? "bad" : r.some((i) => i.level === "warn") ? "warn" : "ok"; },
};

/* ---------- full backup / verify / restore ---------- */
S5.backup = {
  async build({ includeFiles = true } = {}) {
    const records = [...S5.store.recs.values()];
    const blobs = {};
    if (includeFiles) {
      for (const [k, v] of await S5.idb.all("blobs")) blobs[k] = { mime: v.mime, size: v.size, b64: S5.b64FromBuf(v.data) };
    }
    const body = { records, settings: S5.store.meta.settings || {}, blobs };
    const json = JSON.stringify(body);
    const checksum = await S5.sha256(json);
    return { format: "studio5-backup", appVersion: S5.APP_VERSION, schemaVersion: S5.SCHEMA_VERSION, exportedAt: S5.now(), device: S5.store.meta.deviceId, counts: { records: records.length, files: Object.keys(blobs).length }, checksum, body: json };
  },
  async verify(pkg) {
    const problems = [];
    if (!pkg || pkg.format !== "studio5-backup") return { ok: false, problems: ["This is not a Studio5 backup file."] };
    if (pkg.schemaVersion > S5.SCHEMA_VERSION) problems.push(`Backup is from a newer schema (v${pkg.schemaVersion}). Update Studio5 first.`);
    const sum = await S5.sha256(pkg.body || "");
    if (sum !== pkg.checksum) return { ok: false, problems: ["Checksum mismatch — the file is damaged or was edited. Nothing was restored."] };
    let body; try { body = JSON.parse(pkg.body); } catch { return { ok: false, problems: ["Backup body is unreadable."] }; }
    const ids = new Set(body.records.map((r) => r.id));
    let broken = 0;
    for (const r of body.records) { if (!r.id || !r.type) problems.push("A record without id/type"); if (r.blobKey && !body.blobs[r.blobKey] && !r.assetId) broken++; }
    const danglingLinks = body.records.filter((r) => r.type === "link" && (!ids.has(r.from) || !ids.has(r.to))).length;
    if (broken) problems.push(`${broken} file record(s) without their bytes (exported without files).`);
    if (danglingLinks) problems.push(`${danglingLinks} relation(s) point to missing records.`);
    return { ok: !problems.some((p) => p.startsWith("Backup is from")), problems, body, counts: { records: body.records.length, files: Object.keys(body.blobs).length } };
  },
  async restore(body, mode) {
    await S5.store.snapshot(`Before ${mode} restore`);
    if (mode === "replace") { await S5.idb.clear("records"); S5.store.recs.clear(); }
    let added = 0, updated = 0, kept = 0;
    let recs = body.records.map((r) => ({ ...r }));
    // migrate older backups forward
    const v = body.schemaVersion || 1;
    for (let i = v + 1; i <= S5.SCHEMA_VERSION; i++) if (S5.migrations[i]) S5.migrations[i](recs);
    const toWrite = [];
    for (const r of recs) {
      const cur = S5.store.recs.get(r.id);
      if (!cur) { added++; toWrite.push(r); } else if (r.updatedAt > cur.updatedAt) { updated++; toWrite.push(r); } else kept++;
    }
    await S5.idb.putMany("records", toWrite.map((r) => [r.id, r]));
    toWrite.forEach((r) => { S5.store.recs.set(r.id, r); S5.sync.queue(r); });
    for (const [k, b] of Object.entries(body.blobs || {})) { if (!(await S5.idb.get("blobs", k))) await S5.idb.put("blobs", k, { mime: b.mime, size: b.size, data: S5.bufFromB64(b.b64), at: S5.now() }); }
    if (mode === "replace" && body.settings) await S5.store.setMeta("settings", body.settings);
    S5.audit("restore", `${mode} restore: +${added} new, ${updated} updated, ${kept} kept`);
    S5.bus.emit("change", null);
    return { added, updated, kept };
  },
  // restore test: rebuilds the package, re-verifies it, and replays it into a throwaway map
  async restoreTest() {
    const pkg = await this.build({ includeFiles: true });
    const v = await this.verify(pkg);
    if (!v.ok) return { ok: false, detail: v.problems.join(" ") };
    const sim = new Map(); v.body.records.forEach((r) => sim.set(r.id, r));
    const ok = sim.size === S5.store.recs.size && [...S5.store.recs.keys()].every((k) => sim.has(k));
    if (ok) await S5.store.setMeta("lastRestoreTestAt", S5.now());
    return { ok, detail: ok ? `${sim.size} records and ${v.counts.files} files verified` : "Record count differs after replay" };
  },
};

/* ---------- display title for any record ---------- */
S5.title = (r) => {
  if (!r) return "";
  return r.title || r.name || r.text?.slice(0, 80) || r.question?.slice(0, 80) || r.verbatim?.slice(0, 80) || r.kind || r.type;
};

// ---- ink.js ----
/* Shared Ink Engine — one engine for notebooks, PDF markup, Drawing Coach, sketches and photo markup.
   Stroke model (document units, stored as tenths for compactness):
   {id, t:'pen'|'hl'|'line'|'rect'|'ell'|'arrow'|'text', c:color, w:width, l:layer, p:[x,y,pressure(0-100),…], d:duration ms, txt?, s?}
   Tools: pen, highlighter, eraser (splits strokes — only the touched segment goes), lasso (select/move/delete),
   shapes, text, hand (pan). Pen-only mode ignores palm/finger contact for drawing and uses fingers to pan/pinch. */
S5.inkState = Object.assign({ tool: "pen", color: "#1b2130", width: 2.2, hlColor: "#f2c94c", shape: "line", eraser: 14, template: null }, S5.ls.get("inkState", {}));
S5.INK_COLORS = ["#1b2130", "#1f4fa8", "#b8392a", "#2d7a4b", "#a26a06", "#7b3fa0", "#8a8f98"];
S5.INK_TEMPLATES = { blank: "Blank", ruled: "Ruled", grid: "Grid 5 mm", dots: "Dots", iso: "Isometric", engineering: "Engineering sheet", title: "Title block" };

S5.Ink = class Ink {
  constructor(host, opts) {
    this.host = host; this.o = opts; this.doc = opts.doc;
    this.W = opts.width || this.doc.width || 1000; this.H = opts.height || this.doc.height || 1414;
    this.strokes = (this.doc.strokes || []).map((s) => ({ ...s }));
    this.layers = this.doc.layers && this.doc.layers.length ? this.doc.layers.map((l) => ({ ...l })) : [{ n: "Layer 1", v: true }];
    this.layer = 0; this.undoS = []; this.redoS = []; this.sel = new Set(); this.ptrs = new Map();
    this.overlay = !!opts.overlay; // PDF page overlay: fixed scale, no own pan
    this.s = 1; this.ox = 0; this.oy = 0; this.bboxes = new WeakMap(); this.ghostAlpha = 0.25;
    this.build();
  }
  build() {
    const h = this.host; h.innerHTML = "";
    if (!this.overlay && !this.o.noToolbar) { this.bar = document.createElement("div"); this.bar.className = "ink-tools"; h.appendChild(this.bar); this.renderBar(); }
    this.stage = document.createElement("div"); this.stage.className = this.overlay ? "overlay" : "ink-stage";
    h.appendChild(this.stage);
    this.cBg = document.createElement("canvas"); this.cMain = document.createElement("canvas"); this.cLive = document.createElement("canvas");
    this.stage.append(this.cBg, this.cMain, this.cLive);
    if (!this.overlay) { this.status = document.createElement("div"); this.status.className = "ink-status"; this.stage.appendChild(this.status); }
    this.bind();
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(this.stage);
    if (this.o.refUrl) { this.refImg = new Image(); this.refImg.onload = () => this.drawBg(); this.refImg.src = this.o.refUrl; }
    requestAnimationFrame(() => { this.resize(); if (!this.overlay) this.fit(); });
  }
  destroy() { this.ro?.disconnect(); this.flush(); this.dead = true; }
  /* ---------- toolbar ---------- */
  renderBar() {
    const st = S5.inkState, b = (tool, label, title) => `<button class="tb" data-ink="tool" data-v="${tool}" aria-pressed="${st.tool === tool}" title="${title}">${label}</button>`;
    const icons = { pen: '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>', hl: '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 19h6M9 15l8-8 3 3-8 8H9z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>', eraser: '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 16l9-9 6 6-6 6H8zM11 19h9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>', lasso: '<svg width="18" height="18" viewBox="0 0 24 24"><ellipse cx="12" cy="10" rx="8" ry="5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2"/><path d="M8 14c-1 3 1 5 3 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>', shape: '<svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="4" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="15" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>', text: '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13" stroke="currentColor" stroke-width="2" fill="none"/></svg>', hand: '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 013 0v5V4.5a1.5 1.5 0 013 0V11V6a1.5 1.5 0 013 0v8c0 4-3 6-6 6s-5-2-6.5-4L4 12.5a1.5 1.5 0 012.5-1.5L8 13" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>' };
    const cols = S5.INK_COLORS.map((c) => `<button class="sw" data-ink="color" data-v="${c}" style="background:${c}" aria-pressed="${st.color === c}" aria-label="Colour ${c}"></button>`).join("");
    this.bar.innerHTML = `${b("pen", icons.pen, "Pen (P)")}${b("hl", icons.hl, "Highlighter (H)")}${b("eraser", icons.eraser, "Eraser — removes only the part you touch (E)")}${b("lasso", icons.lasso, "Lasso select / move (L)")}${b("shape", icons.shape, "Shapes")}${b("text", icons.text, "Text (T)")}${b("hand", icons.hand, "Pan / zoom (space)")}
      <span class="sep"></span>${cols}<span class="sep"></span>
      <select data-ink="width" aria-label="Line width">${[0.8, 1.4, 2.2, 3.5, 6, 10].map((w) => `<option value="${w}" ${st.width == w ? "selected" : ""}>${w} pt</option>`).join("")}</select>
      ${st.tool === "shape" ? `<select data-ink="shape" aria-label="Shape">${[["line", "Line"], ["arrow", "Arrow"], ["rect", "Rectangle"], ["ell", "Ellipse"]].map(([v, n]) => `<option value="${v}" ${st.shape === v ? "selected" : ""}>${n}</option>`).join("")}</select>` : ""}
      ${this.o.noTemplate ? "" : `<select data-ink="template" aria-label="Paper">${Object.entries(S5.INK_TEMPLATES).map(([k, n]) => `<option value="${k}" ${(this.doc.template || "blank") === k ? "selected" : ""}>${n}</option>`).join("")}</select>`}
      <select data-ink="layer" aria-label="Layer">${this.layers.map((l, i) => `<option value="${i}" ${i === this.layer ? "selected" : ""}>${S5.esc(l.n)}${l.v ? "" : " (hidden)"}</option>`).join("")}<option value="+">+ New layer</option><option value="toggle">Show / hide current</option></select>
      <span class="sep"></span>
      <button class="tb" data-ink="undo" title="Undo (Ctrl+Z)">↶</button><button class="tb" data-ink="redo" title="Redo (Ctrl+Y)">↷</button>
      ${this.sel.size ? `<button class="tb" data-ink="delsel" title="Delete selection" style="color:var(--redline)">Delete ${this.sel.size}</button>` : ""}
      <button class="tb" data-ink="fit" title="Fit page">Fit</button>
      <button class="tb" data-ink="pen-only" aria-pressed="${S5.settings.get("penOnly")}" title="Pen-only: fingers pan and zoom, palm never draws">Pen only</button>
      ${this.o.ghost ? `<label class="tiny row" style="gap:4px">Overlay <input type="range" min="0" max="80" value="${this.ghostAlpha * 100}" data-ink="ghost" style="width:70px"></label>` : ""}

/* PDF viewer: the original stays immutable; ink annotations live in separate `inkpage` records

  const b = await S5.blobs.get(file.blobKey, file.assetId);
  if (!b) throw new Error("This file's bytes are not on this device yet. Open it on the device where you added it, or restore a backup that includes files.");

  const pdf = await task.promise;

};

};

S5.PdfView = class PdfView {

/* AI Orchestrator. AI explains, tests and suggests; it never becomes a trusted source by itself and never
   produces graded work for the student. Every request is logged (what was sent, why), respects the

  RULES: `You are the study assistant inside Studio5, a private study system for an architecture & building technology student (Northern Technical University, Iraq). Rules:
- Explain, coach, quiz and suggest. Never write graded work (reports, designs, exam answers) for the student to submit as their own.
- Separate clearly: what the source/professor said, what you infer. Mark uncertainty plainly.
- Engineering, structural, site and safety topics are for learning only, not for design approval or execution.

  async ask(purpose, prompt, { json = false, tier = "default", onText, records = [], images, signal } = {}) {

    if (blocked.length) throw { code: "blocked", message: `“${S5.title(blocked[0])}” is marked “no AI”. Remove that flag to use AI on it.` };
    if (this.usedToday() >= S5.settings.get("aiDailyCap")) throw { code: "cap", message: "Today's AI request limit is reached. Change it in Settings → AI." };

  ctxSubject(id) { const s = S5.store.get(id); return s ? `Subject: ${s.name} (${s.ar}), year ${s.year}, semester ${s.semester}.` : ""; },
  METHODS: { simple: "Explain it simply, like to a smart first-year student, in 5–8 short lines.", visual: "Explain it visually: describe a sketch or diagram the student can draw step by step, with labels.", practical: "Explain with a practical example from building sites or architecture studio work in Iraq.", technical: "Give a precise technical explanation with definitions and the governing formula or rule.", architectural: "Explain through an architectural design example (plans, sections, spaces).", fromStart: "Start from the prerequisite ideas and build up to this concept step by step." },
  explainGap(gap, method, onText) {

    return this.ask("Understanding rescue", `${ctx}\nThe student does not understand: "${gap.text}"\nDiagnosed problem type: ${gap.gapType || "unknown"}.\n${past ? "Previous explanations did not work:\n" + past + "\nUse a clearly different angle and split the idea into smaller steps." : ""}\nMethod: ${this.METHODS[method] || this.METHODS.simple}\nEnd with exactly one short check question the student must answer alone (do not give its answer).`, { onText, records: [gap] });

  professorQuestion(gap) {

  extractRequirements(text, project) {

  closeoutDraft(lecture, caps) {
    const lines = caps.map((c) => `- [${c.kind}] ${c.text}${c.page ? " (p." + c.page + ")" : ""}`).join("\n");

  diagnostic(subject, topics) {

  async council(question, context, onUpdate) {
    const roles = [["Tutor", "Explain the idea and the most useful way to think about it."], ["Critic", "Find the weak points, risks, hidden assumptions and what a strict professor would object to."], ["Examiner", "Turn it into what could be asked or graded, and how to prove mastery."]];

  },
  memoryPack(project, ctx) {
    return this.ask("Memory pack", `The student starts or continues: ${project.name}.\nRelevant history from their own records:\n${ctx}\nWrite a short "before you start" brief: repeated mistakes to avoid, professor preferences to respect, what worked before, weak skills to watch, realistic time notes. Only use the given history; say when history is thin. At most 180 words.`, { records: [project] });

    if (dl) { try { await dl.save({ filename: name, data: blob }); this.toast("Saved " + name); return true; } catch (e) { if (e && e.code === "cancelled") return false; } }
    if (S5.standalone) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); this.toast("Saved " + name); return true; }

      const text = await blob.text();
      const m = this.modal("Copy your file", `<p class="small muted">This view cannot save files directly. Copy the content below and save it as <strong>${esc(name)}</strong>.</p><textarea readonly style="width:100%;height:280px;font-family:var(--f-mono);font-size:.72rem">${esc(text)}</textarea>`, { footer: `<button class="btn primary" data-copy>Copy</button>` });

  pickFile(accept, multiple) { return new Promise((res) => { const i = document.createElement("input"); i.type = "file"; if (accept) i.accept = accept; if (multiple) i.multiple = true; i.style.display = "none"; document.body.appendChild(i); i.onchange = () => { res([...i.files]); i.remove(); }; i.click(); setTimeout(() => { if (!i.files?.length) {} }, 0); }); },
};

/* ---------- global capture ---------- */
S5.currentLecture = () => {
  const now = new Date(); const day = now.getDay(); const hm = now.toTimeString().slice(0, 5);
  const slot = S5.store.list("slot", (s) => +s.day === day && s.start <= hm && s.end >= hm && S5.subjectActive(S5.store.get(s.subjectId)))[0];
  return slot || null;
};
S5.ensureLecture = async (subjectId, date = S5.todayISO()) => {
  let lec = S5.store.list("lecture", (l) => l.subjectId === subjectId && l.date === date)[0];
  if (!lec) lec = await S5.store.create("lecture", { subjectId, date, title: "", status: "captured" });
  return lec;
};
S5.openCapture = (ctx = {}) => {

  const kinds = S5.CAPTURE_KINDS.map(([k, n, s]) => `<button type="button" class="kind k-${k}" data-kind="${k}" aria-pressed="${k === ctx.kind}"><b>${n}</b><small>${s}</small></button>`).join("");

  const projOpts = S5.store.list("project", (p) => p.phase !== "evaluated").map((p) => `<option value="${p.id}" ${p.id === ctx.projectId ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  const m = S5.ui.modal("Capture", `
    <div class="capture-kinds" id="cap-kinds">${kinds}</div>
    <label class="field"><span id="cap-label">What to capture</span><textarea id="cap-text" dir="auto" rows="3" placeholder="Type fast — organise later. Ctrl+Enter saves."></textarea></label>
    <div class="form-grid">
      <label class="field"><span>Subject</span><select id="cap-subj"><option value="">— (goes to Inbox)</option>${subjOpts}</select></label>
      <label class="field"><span>Project</span><select id="cap-proj"><option value="">—</option>${projOpts}</select></label>
      <label class="field"><span>Page</span><input id="cap-page" type="number" inputmode="numeric" value="${esc(ctx.page)}"></label>
      <label class="field" id="cap-due-wrap" hidden><span>Due</span><input id="cap-due" type="date"></label>
      <label class="field" id="cap-file-wrap" hidden><span>Photo or file</span><input id="cap-file" type="file" accept="image/*,application/pdf"></label>
    </div>
    ${slot ? `<p class="tiny muted">Now in timetable: ${esc(S5.store.get(slot.subjectId)?.name || "")} · ${slot.start}–${slot.end}. Captures attach to today's lecture.</p>` : ""}`,
    { footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="cap-save">Save capture</button>` });
  let kind = ctx.kind;

    if (kind === "verbatim" && projectId) { const fb = await S5.store.create("feedback", { projectId, subjectId, verbatim: text, status: "open", priority: "normal", understood: false }); await S5.store.update(cap.id, { resolved: true, convertedTo: fb.id }); }

/* convert a capture into the right record (atomic: record + resolution) */
S5.resolveCapture = async (cap, to) => {
  const base = { subjectId: cap.subjectId || "", projectId: cap.projectId || "", lectureId: cap.lectureId || "" };
  let rec;
  if (to === "task") rec = await S5.store.create("task", { ...base, title: cap.text, due: cap.due || "", priority: "normal", status: "open", origin: "capture", captureId: cap.id });
  if (to === "gap") rec = await S5.store.create("gap", { ...base, text: cap.text, page: cap.page, context: cap.lectureId ? `Lecture ${S5.title(S5.store.get(cap.lectureId)) || S5.fmtDate(S5.store.get(cap.lectureId)?.date)}` : "", stage: 0, attempts: [], gapType: "concept" });
  if (to === "question") rec = await S5.store.create("question", { ...base, text: cap.text, status: "draft" });
  if (to === "feedback") rec = await S5.store.create("feedback", { ...base, verbatim: cap.text, status: "open", priority: "normal", understood: false });
  if (to === "memory") rec = await S5.store.create("memory", { ...base, kind: cap.kind === "verbatim" ? "professor" : "lesson", text: cap.text, stage: 0 });
  if (to === "note") rec = await S5.store.create("note", { ...base, title: cap.text.slice(0, 60), body: cap.text });
  await S5.store.update(cap.id, { resolved: true, convertedTo: rec ? rec.id : "kept", resolvedAs: to });
  if (rec) await S5.link(cap.id, "DERIVED_FROM", rec.id);
  return rec;
};

/* ---------- inbox & notifications ---------- */
S5.inboxItems = () => {
  const caps = S5.store.list("capture", (c) => !c.resolved);
  const orphanTasks = S5.store.list("task", (t) => t.status === "open" && !t.subjectId && !t.projectId && !t.personal);
  const orphanFiles = S5.store.list("file", (f) => !f.subjectId && !f.projectId && !f.library);
  return [...caps.map((r) => ({ r, why: "capture" })), ...orphanTasks.map((r) => ({ r, why: "task without subject" })), ...orphanFiles.map((r) => ({ r, why: "file not filed" }))];
};
S5.notifications = () => {
  const T = S5.todayISO(); const out = []; const safe = S5.settings.get("safeMode");
  const add = (p, text, act, data = {}) => out.push({ p, text, act, data });
  for (const t of S5.store.list("task", (t) => t.status !== "done" && t.status !== "dropped" && t.due)) {
    const n = S5.daysBetween(T, t.due);
    if (n < 0) add(t.priority === "critical" || t.priority === "high" ? 0 : 1, `Overdue: ${t.title}`, "edit", { type: "task", id: t.id });
    else if (n === 0) add(1, `Due today: ${t.title}`, "edit", { type: "task", id: t.id });
    else if (n <= 7 && !safe) add(2, `Due ${S5.relDay(t.due)}: ${t.title}`, "edit", { type: "task", id: t.id });
  }
  for (const p of S5.store.list("project", (p) => p.deadline && !["frozen", "evaluated"].includes(p.phase))) {
    const n = S5.daysBetween(T, p.deadline); const risk = S5.projectRisk(p);
    if (n <= 2 && n >= 0) add(0, `${p.name} is due ${S5.relDay(p.deadline)} — run the submission gate`, "open", { v: "project", id: p.id, tab: "gate" });
    else if (risk.level === "high") add(1, `${p.name}: ${risk.reason}`, "open", { v: "project", id: p.id });
  }
  for (const a of S5.store.list("assessment", (a) => a.date && a.score == null)) {
    const n = S5.daysBetween(T, a.date);
    if (n >= 0 && n <= 7) add(n <= 2 ? 0 : 1, `${a.kind} (${S5.store.get(a.subjectId)?.name || ""}) ${S5.relDay(a.date)}${a.confirmed ? "" : " — weight not confirmed"}`, "open", { v: "subject", id: a.subjectId, tab: "exams" });
    if (n < 0 && n > -14 && !safe) add(2, `Enter the result for ${a.kind} and run a quick debrief`, "edit", { type: "assessment", id: a.id });
  }
  const unclosed = S5.store.list("lecture", (l) => l.status !== "closed" && l.date && l.date <= T && S5.store.list("capture", (c) => c.lectureId === l.id && !c.resolved).length);
  if (unclosed.length) add(1, `${unclosed.length} lecture(s) waiting for closeout`, "open", { v: "lecture", id: unclosed[0].id, tab: "closeout" });
  for (const p of S5.store.list("problem", (p) => p.retryAt && p.retryAt <= T && p.status !== "solved" && p.status !== "timed")) add(2, `Retry problem: ${p.question.slice(0, 60)}`, "open", { v: "subject", id: p.subjectId, tab: "problems" });
  const gaps = S5.store.list("gap", (g) => (g.attempts || []).filter((a) => a.result === "still unclear").length >= 2 && g.stage < 1);
  for (const g of gaps) add(1, `Explanation failed twice: “${g.text.slice(0, 50)}” — change method or ask the professor`, "rescue", { id: g.id });
  const lb = S5.store.meta.lastBackupAt;
  if (!lb || S5.daysBetween(lb.slice(0, 10), T) > S5.settings.get("backupEveryDays")) add(1, lb ? `Last full backup was ${S5.relDay(lb.slice(0, 10))}` : "No full backup yet — export one", "go", { v: "system" });
  if (S5.health.level() === "bad") add(0, "System health needs attention", "go", { v: "system" });
  if (S5.sync.state === "error") add(3, "Cloud sync interrupted — your changes are safe on this device", "go", { v: "system" });
  return out.filter((n) => !safe || n.p <= 1).sort((a, b) => a.p - b.p);
};

/* ---------- project risk & time intelligence (used by Today and Projects) ---------- */
S5.projectRisk = (p) => {
  const T = S5.todayISO(); if (!p.deadline) return { level: "low", reason: "No deadline set", score: 0 };
  const days = S5.daysBetween(T, p.internalDeadline || p.deadline);
  const delivs = S5.store.where("deliverable", "projectId", p.id);
  const remainingMin = delivs.filter((d) => !["ready", "frozen"].includes(d.status)).reduce((a, d) => a + Math.max(0, (d.estMin || 120) - (d.actMin || 0)), 0) + S5.store.list("task", (t) => t.projectId === p.id && t.status !== "done" && t.status !== "dropped").reduce((a, t) => a + (t.estimateMin || 60), 0);
  const openFb = S5.store.list("feedback", (f) => f.projectId === p.id && ["open", "task"].includes(f.status)).length;
  const unclearFb = S5.store.list("feedback", (f) => f.projectId === p.id && !f.understood && f.status === "open").length;
  const perDay = S5.settings.get("energyMin") * 0.45; // share of a day realistically available for one project
  const capacity = Math.max(0, days) * perDay;
  const ratio = capacity ? remainingMin / capacity : remainingMin ? 9 : 0;
  let level = "low", reason = "On track";
  if (days < 0) { level = "high"; reason = "Past your internal deadline"; }
  else if (ratio > 1) { level = "high"; reason = `Needs ~${S5.fmtMin(remainingMin)}, about ${S5.fmtMin(capacity)} realistically available`; }
  else if (ratio > 0.7 || unclearFb) { level = "medium"; reason = unclearFb ? `${unclearFb} feedback item(s) not understood yet` : "Tight: most of the remaining time is already needed"; }
  return { level, reason, score: ratio + unclearFb * 0.3 + (days < 3 ? 0.5 : 0), remainingMin, capacity, openFb, days };
};
S5.estimateRange = (estMin, kind) => {
  // learn from history: actual/estimate ratio of finished tasks & deliverables
  const done = [...S5.store.list("task", (t) => t.status === "done" && t.estimateMin && t.actualMin), ...S5.store.list("deliverable", (d) => d.estMin && d.actMin && ["ready", "frozen"].includes(d.status))];
  const ratios = done.map((d) => (d.actualMin || d.actMin) / (d.estimateMin || d.estMin)).sort((a, b) => a - b);
  if (ratios.length < 3) return { lo: Math.round(estMin * 0.9), hi: Math.round(estMin * 1.6), conf: "low", why: "Little history yet — using a default buffer of +60%" };
  const q = (p) => ratios[Math.min(ratios.length - 1, Math.floor(p * ratios.length))];
  return { lo: Math.round(estMin * q(0.25)), hi: Math.round(estMin * q(0.8)), conf: ratios.length > 10 ? "medium" : "low", why: `Based on ${ratios.length} finished items: you usually take ${S5.round(q(0.5), 2)}× your estimate` };
};

/* ---------- unified search ---------- */
S5.SEARCH_FIELDS = ["title", "name", "ar", "text", "question", "verbatim", "interpretation", "summary", "body", "idea", "note", "reason", "attempt", "correct", "cause", "topics", "brief", "notes", "properties", "uses", "findings", "citation", "answerVerbatim", "author", "evidence", "quote", "goal", "kind"];
S5.search = async (q) => {
  q = (q || "").trim().toLowerCase(); if (q.length < 2) return [];
  const terms = q.split(/\s+/); const out = [];
  for (const r of S5.store.recs.values()) {
    if (r.deleted || ["link", "inkpage", "drillDef", "year", "semester"].includes(r.type)) continue;
    const hay = S5.SEARCH_FIELDS.map((f) => (typeof r[f] === "string" ? r[f] : "")).join("   ").toLowerCase();
    if (terms.every((t) => hay.includes(t))) { const i = hay.indexOf(terms[0]); out.push({ r, snip: hay.slice(Math.max(0, i - 50), i + 90) }); }
  }
  // inside PDFs (device-local text index)
  for (const f of S5.store.list("file", (f) => f.kind === "pdf")) {
    const pages = await S5.idb.get("meta", "pdftext_" + f.id); if (!pages) continue;
    pages.forEach((t, i) => { const l = t.toLowerCase(); if (terms.every((x) => l.includes(x))) { const j = l.indexOf(terms[0]); out.push({ r: f, page: i + 1, snip: t.slice(Math.max(0, j - 50), j + 90) }); } });
  }
  return out.slice(0, 200);
};
S5.openRecord = (r, page) => {
  const go = (x) => S5.ui.go(x);
  switch (r.type) {
    case "subject": return go({ v: "subject", id: r.id });
    case "lecture": return go({ v: "lecture", id: r.id });
    case "project": return go({ v: "project", id: r.id });
    case "file": return go({ v: "file", id: r.id, page });
    case "notebook": return go({ v: "notebook", id: r.id });
    case "research": return go({ v: "research", id: r.id });
    case "gap": return S5.rescue(r.id);
    case "capture": return go({ v: "inbox" });
    default:
      if (r.projectId && ["requirement", "assumption", "reference", "siteRecord", "space", "relation", "alternative", "decision", "feedback", "version", "deliverable", "evaluation"].includes(r.type)) return go({ v: "project", id: r.projectId, tab: { requirement: "brief", assumption: "brief", reference: "references", siteRecord: "site", space: "program", relation: "program", alternative: "alternatives", decision: "alternatives", feedback: "feedback", version: "versions", deliverable: "deliverables", evaluation: "evaluation" }[r.type] });
      if (S5.SCHEMA[r.type]) return S5.ui.edit(r.type, r);
  }
};
S5.typeLabel = (t) => (S5.SCHEMA[t]?.label) || { capture: "Capture", inkpage: "Ink page", drill: "Drawing attempt", link: "Relation" }[t] || t;

// ---- tools.js ----
/* Engineering & studio tools, activated by academic year. Learning tools only: results show the formula used
   (formula provenance) and a plausibility note; they are never design approval. */
const R = S5.round;
const T_ = (rows) => `<div class="tbl-wrap"><table class="tbl"><tbody>${rows.map(([k, v, u = ""]) => `<tr><td>${k}</td><td class="num mono">${v}</td><td class="muted small">${u}</td></tr>`).join("")}</tbody></table></div>`;
const lines = (txt) => (txt || "").split(/\n/).map((l) => l.split(/[,;\t]/).map((x) => x.trim())).filter((r) => r.some((x) => x !== ""));
const warn = (t) => `<p class="small" style="color:var(--amber)">⚠ ${t}</p>`;
const ok = (t) => `<p class="small" style="color:var(--green)">✓ ${t}</p>`;
const formula = (t) => `<p class="tiny muted mono" style="margin-top:6px">Formula: ${t}</p>`;
const svgChart = (pts, { w = 520, h = 160, label = "", zero = true } = {}) => {
  if (!pts.length) return "";
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]); const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys, zero ? 0 : Infinity), y1 = Math.max(...ys, zero ? 0 : -Infinity); if (y1 === y0) { y1 += 1; y0 -= 1; }
  const pad = 28, X = (x) => pad + ((x - x0) / (x1 - x0 || 1)) * (w - pad * 2), Y = (y) => h - pad + 4 - ((y - y0) / (y1 - y0)) * (h - pad * 2);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const area = `${path}L${X(x1)},${Y(Math.max(y0, 0))}L${X(x0)},${Y(Math.max(y0, 0))}Z`;
  const mx = pts.reduce((a, p) => (Math.abs(p[1]) > Math.abs(a[1]) ? p : a), pts[0]);
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" role="img" aria-label="${label}">

      const end = Math.max(...order.map((t) => t.ef)); [...order].reverse().forEach((t) => { const succ = ts.filter((s) => s.pre.includes(t.id)); t.lf = succ.length ? Math.min(...succ.map((s) => s.ls)) : end; t.ls = t.lf - t.d; t.fl = t.ls - t.es; });
      return `<p><b>Project duration: ${end} days.</b> Critical path: ${order.filter((t) => t.fl === 0).map((t) => t.id).join(" → ")}</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Task</th><th class="num">ES</th><th class="num">EF</th><th class="num">LS</th><th class="num">Float</th><th style="min-width:240px">Timeline</th></tr></thead><tbody>${order.map((t) => `<tr><td>${S5.esc(t.id)} · ${S5.esc(t.name)}</td><td class="num mono">${t.es}</td><td class="num mono">${t.ef}</td><td class="num mono">${t.ls}</td><td class="num mono">${t.fl}</td><td><div style="position:relative;height:14px;background:var(--paper-2);border-radius:3px"><i style="position:absolute;left:${(t.es / end) * 100}%;width:${(t.d / end) * 100}%;top:0;bottom:0;border-radius:3px;background:${t.fl === 0 ? "var(--redline)" : "var(--cobalt)"}"></i></div></td></tr>`).join("")}</tbody></table></div>` + formula("Forward pass ES = max(EF of predecessors); backward pass LF = min(LS of successors); float = LS − ES");
    },
  },
  npv: {
    inputs: [["rate", "Discount rate %", 8], ["flows", "Cash flows year 0, 1, 2… (negative = cost)", "-500000, 120000, 140000, 150000, 150000, 160000", "textarea"]],
    run(v) {

      return T_([["NPV", Math.round(npv(r)).toLocaleString()], ["IRR", irr == null ? "n/a" : R(irr * 100, 2) + " %"], ["Simple payback", pb == null ? "not reached" : R(pb, 2) + " years"]]) + (npv(r) >= 0 ? ok("Positive NPV at this rate.") : warn("Negative NPV at this rate.")) + formula("NPV = Σ CFₜ ÷ (1+r)ᵗ; IRR solves NPV = 0 (bisection)");
    },
  },
  lcc: {
    inputs: [["rate", "Discount rate %", 6], ["years", "Study period (years)", 25], ["alts", "Alternatives: name, initial cost, annual cost", "Single glazing, 3000000, 900000\nDouble glazing, 5200000, 520000", "textarea"]],
    run(v) {
      const r = S5.num(v.rate) / 100, n = S5.num(v.years, 25); const pwf = r ? (1 - (1 + r) ** -n) / r : n;
      const alts = lines(v.alts).map(([nm, ic, ac]) => ({ nm, pw: S5.num(ic) + S5.num(ac) * pwf })); const best = alts.reduce((a, b) => (b.pw < a.pw ? b : a), alts[0] || { pw: 0 });

    },
  },
};
S5.renderTool = (key, saved) => {

S5.bindTool = (root, key) => {

  grid.addEventListener("input", upd);
  return read;
};

/* ---------- grade state ---------- */
S5.gradeState = (subjectId, target) => {
  const as = S5.store.list("assessment", (a) => a.subjectId === subjectId);
  let graded = 0, earned = 0, remaining = 0, unconfirmed = 0, remMin = 0, remMax = 0;
  for (const a of as) {
    const w = S5.num(a.weight, (S5.num(a.weightMin) + S5.num(a.weightMax)) / 2);
    if (!a.confirmed) unconfirmed += w;
    if (a.score != null && a.maxScore) { graded += w; earned += (w * a.score) / a.maxScore; }
    else { remaining += w; remMin += a.confirmed ? w : S5.num(a.weightMin, w); remMax += a.confirmed ? w : S5.num(a.weightMax, w); }
  }
  const pct = graded ? (earned / graded) * 100 : 0;
  const needed = target != null && remaining ? ((target - earned) / remaining) * 100 : null;
  return { as, graded, earned, remaining, unconfirmed, pct, needed, remMin, remMax, total: graded + remaining };
};

      ${H.section("Notebooks & notes", nbs.length + notes.length ? `<div class="list">${nbs.map((n) => H.item({ lead: "cobalt", t: S5.esc(n.title), s: `${(n.pages || []).length} page(s) · ${S5.INK_TEMPLATES[n.template] || ""}`, act: "open", data: { v: "notebook", id: n.id } })).join("")}${notes.map((n) => H.item({ t: S5.esc(n.title), s: S5.esc((n.body || "").slice(0, 90)), act: "edit", data: { type: "note", id: n.id } })).join("")}</div>` : H.empty("No notebooks yet.", ""))}</div>`;
  } else if (tab === "tasks") {
